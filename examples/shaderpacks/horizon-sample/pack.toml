# The sample Horizon shader pack (docs/shader-packs.md). Copy this folder into
# `shaderpacks/` beside options.txt and pick it in Video Settings > Shader Packs.
[pack]
name = "Horizon Sample"
description = "A warm grade, sun-lit haze and a soft vignette."
authors = ["Horizon contributors"]
version = "1.0.0"
license = "MIT"
api = 1

[[stage]]
kind = "composite"
shader = "shaders/golden_hour.wgsl"

[options.saturation]
label = "Saturation"
default = 1.15
min = 0.0
max = 2.0
step = 0.05

[options.warmth]
label = "Warmth"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[options.haze]
label = "Sun haze"
default = true

[options.vignette]
label = "Vignette"
default = true
