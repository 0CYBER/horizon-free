# Horizon Ultra: multi-pass API 2 WGSL shader pack with PCF directional shadows,
# screen-space AO, water SSR & absorption, screen-space godrays, HDR bloom and ACES tonemapping.
[pack]
name = "Horizon Ultra"
description = "PCF sun/moon shadows, ambient occlusion, water reflections, godrays, bloom and ACES filmic tonemapping."
authors = ["Horizon contributors"]
version = "2.0.0"
license = "MIT"
api = 2

[[stage]]
kind = "composite"
shader = "shaders/deferred_lighting.wgsl"
format = "rgba16float"

[[stage]]
kind = "composite"
shader = "shaders/water_reflections.wgsl"
format = "rgba16float"

[[stage]]
kind = "composite"
shader = "shaders/bloom_godrays.wgsl"
scale = 0.5
format = "rgba16float"

[[stage]]
kind = "composite"
shader = "shaders/final_tonemap.wgsl"

[profiles.low]
shadows = false
ao_strength = 0.25
water_ssr = false
godrays = false
bloom_strength = 0.15
tonemap_aces = true
vignette = false

[profiles.medium]
shadows = true
shadow_strength = 0.70
ao_strength = 0.50
water_ssr = true
godrays = true
bloom_strength = 0.25
tonemap_aces = true
vignette = true

[profiles.high]
shadows = true
shadow_strength = 0.85
ao_strength = 0.75
water_ssr = true
godrays = true
bloom_strength = 0.35
tonemap_aces = true
vignette = true

[profiles.ultra]
shadows = true
shadow_strength = 1.0
ao_strength = 1.0
water_ssr = true
godrays = true
bloom_strength = 0.45
tonemap_aces = true
vignette = true

[options.shadows]
label = "Directional Shadows"
description = "Cast real-time sun and moon PCF shadows across terrain and entities."
default = true

[options.shadow_strength]
label = "Shadow Strength"
description = "Intensity of directional sun and moon shadows."
default = 0.85
min = 0.0
max = 1.0
step = 0.05

[options.ao_strength]
label = "Ambient Occlusion"
description = "Screen-space ambient occlusion in corners and crevices."
default = 0.75
min = 0.0
max = 1.5
step = 0.05

[options.water_ssr]
label = "Water Reflections & Refraction"
description = "Screen-space sky and terrain reflections on water and translucent surfaces."
default = true

[options.godrays]
label = "Godrays"
description = "Atmospheric light shafts cast through trees and terrain towards the sun."
default = true

[options.bloom_strength]
label = "HDR Bloom"
description = "Soft glow around bright sky, lava, torches and emissive blocks."
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[options.exposure]
label = "Exposure"
description = "Overall scene exposure multiplier before filmic tonemapping."
default = 1.10
min = 0.5
max = 2.0
step = 0.05

[options.saturation]
label = "Color Saturation"
description = "Color vibrancy of the final tonemapped image."
default = 1.12
min = 0.0
max = 2.0
step = 0.05

[options.tonemap_aces]
label = "ACES Filmic Tonemap"
description = "Apply ACES fitted filmic curve to preserve highlight detail."
default = true

[options.vignette]
label = "Cinematic Vignette"
description = "Subtle darkening at the edges of the viewport."
default = true
