# Only explicit overrides; DH fills in other defaults on first launch.
[common.multiThreading]
numberOfThreads = 2
threadRunTimeRatio = "0.5"
threadPriority = 3

[common.worldGenerator]
limitIfServerUnhealthy = true
pauseIfMovingQuickly = true

[client.advanced.graphics.quality]
lodChunkRenderDistanceRadius = 128
horizontalQuality = "MEDIUM"
verticalQuality = "MEDIUM"

[client.advanced.autoUpdater]
enableAutoUpdater = false
enableSilentUpdates = false
