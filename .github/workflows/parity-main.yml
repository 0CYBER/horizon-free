name: parity-main
# The vanilla harnesses on main, a batch of merges at a time (docs/release-flow.md#parity-on-main), on the Mac mini's
# runner. One run at a time: merges that land while a run goes on wait in one pending run (GitHub keeps only the
# newest), which checks every merge since main's last green parity-main (tools/parity_main.py base). On a failure the
# failing harnesses run again at HEAD (tools/parity_main.py verdict): the run passes when they all pass then. The search
# for the merge that broke them is not part of this run (tools/parity_main.py bisect, by hand). Releases ship only a
# commit whose parity-main passed (tools/release_train.py), so nothing a harness catches reaches players.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  # tools/parity_main.py base reads earlier runs.
  actions: read
concurrency:
  group: parity-main
  cancel-in-progress: false
env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  HORIZON_TELEMETRY_URL: "off"

jobs:
  parity-main:
    # A Mac mini runner of its own (ludovics-mac-mini-2 holds only this label since 2026-10-26): behind PR parity jobs
    # this run waited 2 h while every merge replaced the pending one, and on the release runner a release then waited
    # behind the next run. PR parity jobs have ludovics-mac-mini and playhorizon. Not playhorizon: its 4 CPUs
    # make a core-crate run several times longer.
    runs-on: [self-hosted, macOS, horizon-parity-main]
    # A batch reruns up to ~670 harnesses: 89-234 min in the nine runs logged up to 2026-11-20 (then with the merge
    # search), the longest on a loaded Mac (an 85 min probe prebuild). After the oracle shim's key changes, its
    # records are rebuilt once, which adds up to ~23 min to the first full run.
    timeout-minutes: 360
    env:
      # This run's identity: tools/parity.py records it with the harnesses that failed (last-run.json), and the verdict
      # judges only a list this run wrote, never one an earlier run left when this batch stopped before writing its own.
      PARITY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      # The probe prebuild's turn on the self-hosted Mac (tools/compile_lock.py), and the preparer build's in
      # vanilla-data.sh: a pull request's parity job takes the turn only while this run neither waits for it nor holds
      # it. This run waits at most 20 min in all, and its prebuild has 240 min (tools/parity.py PREBUILD_LIMIT): a
      # prebuild that builds everything takes over 2 hours even alone. Of the job's 360 min, 120 remain beyond the
      # prebuild's limit; after a full 20 min wait, 100 remain for setup and the harnesses.
      HORIZON_COMPILE_LOCK_ROLE: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          # Keeps .local/ (parity state, probe builds, oracle results) and target/ between runs.
          clean: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: stable
      - name: Tools from the runner
        run: bash tools/ci/runner-env.sh
      - name: Vanilla data, and resources prepared by this preparer
        run: bash tools/ci/vanilla-data.sh
      - name: Main's last green parity-main
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(python3 tools/parity_main.py base)" >> "$GITHUB_OUTPUT"
      - name: The harnesses the merges since then can affect
        id: harnesses
        # A failure here is judged by the next step: the run passes when every failed harness passes again at HEAD.
        continue-on-error: true
        env:
          PARITY_HOSTS: ''
          BASE_SHA: ${{ steps.base.outputs.sha }}
        # exec: a cancelled job's signals reach tools/parity.py, which stops its builds' process groups.
        run: |
          echo "Merges since ${BASE_SHA}:"
          git log --first-parent --format='  %h %s' "$BASE_SHA..HEAD"
          exec python3 tools/parity.py --changed "$BASE_SHA" --timeout 2400
      - name: Preserve the initial failure logs
        if: steps.harnesses.outcome == 'failure'
        run: |
          rm -rf .local/parity-main-logs && cp -R .local/parity-runner/logs .local/parity-main-logs 2>/dev/null || true
      - name: Upload the initial failure logs
        if: steps.harnesses.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-main-logs
          path: .local/parity-main-logs/
          if-no-files-found: warn
          retention-days: 7
      - name: The failed harnesses again, the run's verdict
        if: steps.harnesses.outcome == 'failure'
        # Measured reruns (2026-11-17 to 11-20): 0.3-6.4 min where they then passed; where some failed again 0.1 min
        # (1 harness), 0.9 (2), 4.3 (43), 4.7 (44) and 12.7 (2). tools/parity.py ends a hung harness at its 40 min
        # --timeout and fails it; 50 min leaves room for that, and a rerun hung past it ends red (a step over its
        # limit fails) instead of being cancelled by the job's limit.
        timeout-minutes: 50
        env:
          PARITY_HOSTS: ''
          BASE_SHA: ${{ steps.base.outputs.sha }}
          # The failed harnesses' probes were built in the step before: no wait for a turn inside this step's 50 min.
          HORIZON_COMPILE_LOCK_ROLE: 'off'
        run: python3 tools/parity_main.py verdict "$BASE_SHA"
      - name: Upload the verdict
        if: ${{ !cancelled() && steps.harnesses.outcome == 'failure' }}
        # Best effort: the artifact service never decides the run. Only this attempt's report (its name holds
        # PARITY_RUN_ID), never one an earlier attempt left on the runner.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-main-verdict
          path: .local/parity-runner/verdict-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: ignore
          retention-days: 7
      - name: A run whose harnesses passed, for the flake history
        if: steps.harnesses.outcome == 'success'
        # The history only lists harnesses that needed the rerun (tools/parity_main.py repeat_flakers): never the
        # run's verdict.
        continue-on-error: true
        run: python3 tools/parity_main.py history
