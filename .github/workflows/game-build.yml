name: game build
# Builds the game for every platform from `ref`: the Java exporters, then Linux and the Linux server, Windows x64
# and ARM64 on GitHub, and macOS on the Mac mini's runner with a 1500-frame offscreen run of a new world (smoke-test.json): Apple
# Silicon, and Intel cross-built there for x86_64-apple-darwin and checked under Rosetta 2 (#1161). Called by
# nightly-build.yml (the Nightly, which release.yml starts), always from main's copy of this file: the caller's
# commit, never the one being built. It holds no secrets: signing the checksums is the callers' own job,
# which never runs what this one built. See docs/release-flow.md.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build
        type: string
        required: true
      version:
        description: The version built in (HORIZON_VERSION), e.g. 0.2.81 or nightly-2026-10-28
        type: string
        required: true
      nightly:
        description: A nightly's "<date> <short sha>" (HORIZON_NIGHTLY), shown by the game; empty for a release
        type: string
        default: ''
      trusted:
        # No caller passes true today: release.yml starts nightly-build.yml, which passes false here and for
        # developer_id. With false, the build never runs on the release runner and never saves the Rust cache (its
        # key is its own anyway). Mac jobs, true or false, don't read machine-shared caches or cargo configuration
        # from outside the checkout (tools/ci/cargo_isolation.py; tests/test_nightly.py pins all of it).
        description: The source is main (a release); false for anything else (a nightly)
        type: boolean
        default: false
      developer_id:
        description: Sign the macOS programs with Developer ID and notarize the zip (the runner's keychain)
        type: boolean
        default: true
permissions:
  contents: read
env:
  # The Mac compiles' class in the turns at compiling on the self-hosted Mac (tools/compile_lock.py), also for
  # tools/ci/vanilla-data.sh's preparer build. Elsewhere the turn is a no-op.
  HORIZON_COMPILE_LOCK_ROLE: build
jobs:
  wasm-std:
    # One shared std member, built without credentials or shared caches. Its symbol names don't depend on the host
    # (cargo-horizon-mod gives std crates a host-free disambiguator; wasm-std-hosts.yml checks Windows against Linux).
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rust-src
          targets: wasm32-unknown-unknown
      - name: Build the shared wasm standard library
        run: |
          mkdir -p wasm-std
          cargo run --locked -p cargo-horizon-mod -- wasm-std wasm-std/horizon-wasm-std.wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-std
          path: wasm-std/horizon-wasm-std.wasm
          if-no-files-found: error
          retention-days: 3

  exporters:
    # This runner holds the maintainer's own pinned Minecraft jars. Only our classes leave it. An untrusted build
    # goes to the Mac mini's nightly runner (macOS + horizon-nightly: ludovics-mac-mini-nightly, beside the one that
    # runs pull requests' parity jobs, so a nightly never waits behind their queue), never the release runner
    # (MAC_RUNNER: ludovics-mac-mini-release) nor parity-main's.
    runs-on: ${{ inputs.trusted && vars.MAC_RUNNER || fromJSON('["self-hosted", "macOS", "horizon-nightly"]') }}
    # Three full preparations (two isolated, one batched) besides the compile, and up to 60 min of waiting for turns
    # at compiling on the Mac (tools/compile_lock.py), shared by the job's compiles.
    timeout-minutes: 150
    env:
      # An empty RUSTC_WRAPPER also overrides a build.rustc-wrapper in any cargo config. The variables cargo_isolation.py
      # refuses may be set here only empty.
      RUSTC_WRAPPER: ''
      RUSTC_WORKSPACE_WRAPPER: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          clean: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: stable
      - name: A fresh cargo home and no cargo configuration from outside the checkout
        # The guard comes from this workflow's commit (GITHUB_WORKFLOW_SHA: the caller's, whose ./ copy of this file
        # runs), never from the checkout it checks, which may be an older commit without it. It is fetched into a new
        # folder and run by the system's own curl and Python (curl -q: no curlrc; python3 -I -S: no environment, no
        # site), and the step passes only when its last line says it finished.
        run: |
          set -euo pipefail
          [ -x /usr/bin/python3 ] || { echo "::error::/usr/bin/python3 is missing"; exit 1; }
          dir="$(/usr/bin/mktemp -d "$RUNNER_TEMP/workflow-tools.XXXXXX")"
          url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_WORKFLOW_SHA/tools/ci/cargo_isolation.py"
          /usr/bin/curl -q --fail --silent --show-error --proto '=https' --proto-redir '=https' --max-redirs 0 \
            --noproxy '*' --max-time 60 --retry 5 -o "$dir/cargo_isolation.py" "$url"
          out="$(/usr/bin/python3 -I -S "$dir/cargo_isolation.py" "$GITHUB_WORKSPACE")" || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          [ "${out##*$'\n'}" = "cargo isolation: clean" ] || { echo "::error::the cargo guard did not finish"; exit 1; }
      - run: bash tools/ci/runner-env.sh
        env:
          # Nightly, dry-run and release Mac jobs don't read machine-shared caches: no sccache, and a fresh cargo home
          # per run (rustup's toolchains stay the machine's).
          HORIZON_NO_SCCACHE: '1'
      - run: bash tools/ci/vanilla-data.sh
      - name: The preparer, compiled in its turn
        shell: bash
        # target/ is gone after the clean checkout, and vanilla-data.sh builds the preparer only when it prepares
        # afresh. Its own step, exec'd, so a cancelled job's signals reach the turn's holder (tools/compile_lock.py).
        run: |
          [ -f tools/ci/compile-lock.sh ] || { echo "  compile lock: this ref has no tools/ci/compile-lock.sh: compiling without a turn"; exec cargo build --release --locked -p horizon-prepare; }
          exec bash tools/ci/compile-lock.sh build -- cargo build --release --locked -p horizon-prepare
      - name: Compile and validate original exporters against the pinned jars
        shell: bash
        run: |
          set -euo pipefail
          # Compiled here, never taken from the runner's shared preparations: pull requests' parity jobs
          # write those (vanilla-data.sh links .local/exporters to them).
          rm -rf .local/exporters
          bundle=$(target/release/horizon-prepare compile-exporters --root "$PWD" | tail -1)
          mkdir -p exporters
          cp -R "$bundle/server" "$bundle/client" "$bundle/manifest.json" exporters/
          # Only our classes and their manifest leave this runner.
          stray=$(find exporters -type f ! -path exporters/manifest.json \
            ! \( -name '*.class' \( -path 'exporters/server/dev/horizonlab/parity/*' -o -path 'exporters/client/dev/horizonlab/parity/*' \) \))
          [ -z "$stray" ] || { echo "::error::not one of our classes: $stray"; exit 1; }
          python3 tools/check_prepare_exporters.py --binary target/release/horizon-prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: original-exporters
          path: exporters/
          if-no-files-found: error
          retention-days: 3
      - name: The run's cargo home removed
        if: always()
        run: rm -rf "$RUNNER_TEMP/cargo-home"

  polytone-windows:
    # The Polytone path regressions (#18051): resource paths joined with `\` list nothing on Windows. A job of its own
    # beside `build windows`, not a step in it, so the Windows archive doesn't wait ~25 min for a test binary. It
    # builds that binary the same way: the Windows x64 runner, toolchain, RUSTFLAGS and release profile, from `ref`.
    # Callers wait for it as for `build`: a failed job fails this whole workflow, so `needs: build` holds sign and
    # publish. No cache: a cold build of its own.
    name: polytone windows
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      HORIZON_VERSION: ${{ inputs.version }}
      HORIZON_NIGHTLY: ${{ inputs.nightly }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          clean: true
      - id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - name: Windows x64 Polytone path regressions
        run: |
          cargo test --release --locked -p horizon-client-render --lib particles::polytone::tests::

  build:
    needs: [exporters, wasm-std]
    name: build ${{ matrix.name }}
    # Windows ARM64 and musl are new: a failure never holds the other platforms' release (the signing job
    # needs this job, and a failed entry of it would fail it). The release steps leave the missing
    # optional archives out with a warning. Intel macOS is not one of them: its programs pass the
    # guest-stack start check under Rosetta 2 since #19008, so a failure there fails the build like arm64's.
    continue-on-error: ${{ matrix.name == 'windows-arm64' || matrix.name == 'linux-musl' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            dir: horizon-linux-x86_64
            asset: horizon-linux-x86_64.tar.gz
            # The server build too: packaging/server/install.sh installs it on Linux.
            server_dir: horizon-server-linux-x86_64
            server_asset: horizon-server-linux-x86_64.tar.gz
          - name: linux-musl
            os: ubuntu-22.04
            musl: true
            dir: horizon-linux-musl-x86_64
            asset: horizon-linux-musl-x86_64.tar.gz
          - name: windows
            os: windows-latest
            dir: horizon-windows-x64
            asset: horizon-windows-x64.zip
            exe: .exe
            pe_arch: x64
            # The C runtime linked in, so the game runs without the Visual C++ redistributable.
            rustflags: -C target-feature=+crt-static
          - name: windows-arm64
            os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            dir: horizon-windows-arm64
            asset: horizon-windows-arm64.zip
            exe: .exe
            pe_arch: arm64
            # The ARM64 runner builds and runs native ARM64 executables; keep the C runtime in the archive.
            rustflags: -C target-feature=+crt-static
          - name: macos
            mac: true
            dir: horizon-macos-arm64
            asset: horizon-macos-arm64.zip
          # Intel Macs: built on the same runner for another target; its checks and smoke test run the x86_64
          # programs under Rosetta 2.
          - name: macos-x64
            mac: true
            target: x86_64-apple-darwin
            dir: horizon-macos-x64
            asset: horizon-macos-x64.zip
    runs-on: ${{ matrix.mac && (inputs.trusted && vars.MAC_RUNNER || fromJSON('["self-hosted", "macOS", "horizon-nightly"]')) || matrix.os }}
    # Notarizing the zip can take a few minutes. The hosted Windows and Linux release builds alone took 35–40 min
    # on 2026-11-18 (run 44227464218), past the old 40. Windows x64 took 76-77 min on 2026-11-19/20 with the Polytone
    # tests in it (runs 44424401791, 44515830051); they run in `polytone-windows` beside it now. The Mac legs also wait
    # up to 60 min in all for their turns at compiling (tools/compile_lock.py), and build without a compiler cache.
    timeout-minutes: ${{ matrix.mac && 180 || startsWith(matrix.name, 'windows') && 90 || 75 }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # The release's version, built in (horizon_core::release): --version, user agents, crash reports and
      # telemetry say it. No version-bump commits.
      HORIZON_VERSION: ${{ inputs.version }}
      # A nightly's date and commit ("2026-10-28 0c02067"), which the game shows; empty for a release.
      HORIZON_NIGHTLY: ${{ inputs.nightly }}
      # Where cargo puts the programs: target/release, or target/<target>/release for another target.
      BIN: ${{ matrix.target && format('target/{0}/release', matrix.target) || 'target/release' }}
      # As in `exporters`.
      RUSTC_WRAPPER: ''
      RUSTC_WORKSPACE_WRAPPER: ''
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # Always from a clean checkout, the Mac mini's runner too: its work folder is shared with pull requests'
          # parity jobs, and nothing they leave (target/, an untracked .cargo/config.toml, a build script's output)
          # may end up in a release. target/ is rebuilt from scratch; .local/ is relinked by vanilla-data.sh, which
          # keeps its preparations outside the checkout.
          clean: true
      - id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: ${{ matrix.target }}
      - name: A fresh cargo home and no cargo configuration from outside the checkout
        if: runner.environment == 'self-hosted'
        # The guard comes from this workflow's commit (GITHUB_WORKFLOW_SHA: the caller's, whose ./ copy of this file
        # runs), never from the checkout it checks, which may be an older commit without it. It is fetched into a new
        # folder and run by the system's own curl and Python (curl -q: no curlrc; python3 -I -S: no environment, no
        # site), and the step passes only when its last line says it finished.
        run: |
          set -euo pipefail
          [ -x /usr/bin/python3 ] || { echo "::error::/usr/bin/python3 is missing"; exit 1; }
          dir="$(/usr/bin/mktemp -d "$RUNNER_TEMP/workflow-tools.XXXXXX")"
          url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_WORKFLOW_SHA/tools/ci/cargo_isolation.py"
          /usr/bin/curl -q --fail --silent --show-error --proto '=https' --proto-redir '=https' --max-redirs 0 \
            --noproxy '*' --max-time 60 --retry 5 -o "$dir/cargo_isolation.py" "$url"
          out="$(/usr/bin/python3 -I -S "$dir/cargo_isolation.py" "$GITHUB_WORKSPACE")" || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          [ "${out##*$'\n'}" = "cargo isolation: clean" ] || { echo "::error::the cargo guard did not finish"; exit 1; }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted' && !matrix.musl
        with:
          # A release restores only what a release saved: an untrusted build has its own key and saves nothing.
          shared-key: ${{ inputs.trusted && 'release' || 'nightly' }}-${{ matrix.name }}
          save-if: ${{ inputs.trusted }}
      - name: ALSA and udev headers
        if: runner.os == 'Linux' && !matrix.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Build the official game, horizon-ctl, horizon-prepare and horizon-server
        if: ${{ !matrix.musl }}
        run: |
          # Turns at compiling on the self-hosted Mac (tools/compile_lock.py), exec'd so a cancelled job's signals
          # reach the turn's holder.
          lock=""
          if [ "${{ matrix.mac }}" = true ]; then
            if [ -f tools/ci/compile-lock.sh ]; then lock="bash tools/ci/compile-lock.sh build --"
            else echo "  compile lock: this ref has no tools/ci/compile-lock.sh: compiling without a turn"; fi
          fi
          exec $lock cargo build --release --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -p horizon-official --bin horizon-official -p horizon-client-lib --bin horizon-ctl -p horizon-prepare --bin horizon-prepare -p horizon-server --bin horizon-server
      - name: The official game is the game players get, under its name
        # horizon-official: horizon-client's game with Horizon's own parts plugged in (docs/layers.md, "How a
        # Horizon crate plugs in"). Everything below, the launcher and players know it as horizon-client.
        if: ${{ !matrix.musl }}
        run: cp -f "$BIN/horizon-official${{ matrix.exe }}" "$BIN/horizon-client${{ matrix.exe }}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-std
          path: wasm-std
      - name: Install the shared wasm standard library beside the game
        if: ${{ !matrix.musl }}
        run: cp wasm-std/horizon-wasm-std.wasm "$BIN/horizon-wasm-std.wasm"
      - name: Every program the release folder takes was built
        if: ${{ !matrix.musl }}
        run: |
          for binary in horizon-client horizon-ctl horizon-prepare horizon-server; do
            test -f "$BIN/$binary${{ matrix.exe }}" || { echo "::error::$BIN/$binary${{ matrix.exe }} is missing"; exit 1; }
          done
      - name: Verify Windows executable architecture
        if: runner.os == 'Windows'
        run: |
          python tools/check_pe_arch.py "${{ matrix.pe_arch }}" \
            "$BIN/horizon-client${{ matrix.exe }}" "$BIN/horizon-ctl${{ matrix.exe }}" \
            "$BIN/horizon-prepare${{ matrix.exe }}" "$BIN/horizon-server${{ matrix.exe }}"
      - name: The signing keychain, unlocked
        if: runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: packaging/macos/keychain.sh unlock
      - name: Signed with Developer ID and the hardened runtime
        # Before the checks below, so they run the programs as players will.
        if: runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: |
          for binary in horizon-client horizon-ctl horizon-prepare horizon-server; do
            codesign --force --options runtime --timestamp --keychain "$MACOS_SIGN_KEYCHAIN" \
              --identifier "dev.horizon.${binary#horizon-}" --sign "$MACOS_SIGN_IDENTITY" "$BIN/$binary"
            codesign --verify --strict --verbose=2 "$BIN/$binary"
          done
      - name: Only system libraries
        if: ${{ !matrix.musl }}
        # Windows: no non-system DLL (a "DLL not found" dialog on some players' machines). Linux: the standard
        # loader and libraries every desktop distribution has. macOS: only the system's own libraries.
        run: |
          for binary in horizon-client horizon-ctl horizon-prepare horizon-server; do
            file="$BIN/$binary${{ matrix.exe }}"
            if [[ "$RUNNER_OS" == macOS ]]; then
              others=$(otool -L "$file" | tail -n +2 | awk '{print $1}' | grep -v -E '^(/usr/lib/|/System/Library/)' || true)
              [[ -z "$others" ]] || { echo "::error::$binary links $others"; exit 1; }
            else
              ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/check_imports.py "$file"
            fi
          done
      - name: Baseline x86-64 CPUs only
        # No POPCNT or LZCNT at all (the script says why only those): a C library's count intrinsic killed the
        # game before main on a Core 2 (#7264). Not the Mac builds: every Intel Mac that runs macOS 11 has both.
        if: runner.os != 'macOS' && matrix.pe_arch != 'arm64' && !matrix.musl
        run: |
          set -euo pipefail
          rustup component add llvm-tools
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/check_cpu_baseline.py \
            $(for binary in horizon-client horizon-ctl horizon-prepare horizon-server; do echo "$BIN/$binary${{ matrix.exe }}"; done)
      - name: Every program starts
        if: ${{ !matrix.musl }}
        run: |
          set -euo pipefail
          bin=$BIN
          "$bin/horizon-client${{ matrix.exe }}" --help | grep -q -- '--resources'
          "$bin/horizon-ctl${{ matrix.exe }}" --help > /dev/null
          "$bin/horizon-prepare${{ matrix.exe }}" --help | grep -q -- '--minecraft-dir'
          # The version is the release's.
          for binary in horizon-prepare horizon-server; do
            out=$("$bin/$binary${{ matrix.exe }}" --version | tr -d '\r')
            echo "$out"
            [[ "$out" == "$binary $HORIZON_VERSION" ]] || { echo "::error::expected $binary $HORIZON_VERSION"; exit 1; }
          done
      - name: Tools from the runner
        if: runner.environment == 'self-hosted'
        env:
          HORIZON_NO_SCCACHE: '1' # as in `exporters`
        run: bash tools/ci/runner-env.sh
      - name: Resources prepared from the runner's own Minecraft
        if: runner.environment == 'self-hosted'
        run: bash tools/ci/vanilla-data.sh
      - name: The game runs (offscreen, a new world, 1500 frames)
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          # From a scratch folder: the game keeps its saves and options in the folder it starts in.
          home="$RUNNER_TEMP/horizon-smoke"
          rm -rf "$home" && mkdir -p "$home"
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' research-lock.json | head -1)
          client="$PWD/$BIN/horizon-client"
          resources="$PWD/.local/horizon-client/$version"
          (cd "$home" && HORIZON_HOME="$home" HORIZON_NO_AUDIO=1 "$client" --resources "$resources" --offscreen \
            --world smoke --seed 1 --render-distance 4 --world-frames 1500 --timeout-seconds 180 \
            --smoke-report "$home/smoke.json" > "$home/client.log" 2>&1) || { tail -40 "$home/client.log"; exit 1; }
          python3 - "$home/smoke.json" <<'EOF'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print(json.dumps(report))
          if report.get("error") is not None or report.get("frames", 0) < 1500 or not report.get("chunks") \
                  or not report.get("meshed_sections") or not report.get("player"):
              sys.exit("the smoke run did not draw a world")
          EOF
          # Published with the release; the publish job checks it again before it publishes anything.
          cp "$home/smoke.json" "$RUNNER_TEMP/smoke-test.json"
      # One smoke-test.json per build, the Apple Silicon one's; the Intel build must pass its own run too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.environment == 'self-hosted' && !matrix.target
        with:
          name: smoke-test.json
          path: ${{ runner.temp }}/smoke-test.json
          if-no-files-found: error
          retention-days: 3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: original-exporters
          path: exporters
      - name: Build, check and package for musl in Alpine
        if: matrix.musl
        # Run Docker on the Ubuntu host: JavaScript actions themselves require glibc.
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e HORIZON_VERSION -e HORIZON_NIGHTLY \
            rust:alpine3.22 sh tools/ci/build-musl.sh
      - name: The packaging tool, compiled in its turn
        if: matrix.mac
        # What `Package` compiles on the Mac, compiled here first, so that step's cargo run only runs it.
        run: |
          [ -f tools/ci/compile-lock.sh ] || { echo "  compile lock: this ref has no tools/ci/compile-lock.sh: compiling without a turn"; exec cargo build --locked -p xtask; }
          exec bash tools/ci/compile-lock.sh build -- cargo build --locked -p xtask
      - name: Package
        if: ${{ !matrix.musl }}
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- package "$BIN/horizon-client${{ matrix.exe }}" "dist/${{ matrix.dir }}"
          # Windows x64: Microsoft's DXC, pinned and checksummed, which DirectX 12 uses on integrated GPUs
          # (gfx/dx12_compiler.rs), with its licence. ARM64 keeps FXC (THIRD_PARTY_NOTICES.md says why).
          if [[ "${{ matrix.name }}" == windows ]]; then
            python tools/ci/fetch_dxc.py "dist/${{ matrix.dir }}"
          fi
          cd dist
          rm -f "${{ matrix.asset }}"
          case "${{ matrix.asset }}" in
            *.tar.gz) tar czf "${{ matrix.asset }}" "${{ matrix.dir }}" ;;
            *) if [[ "$RUNNER_OS" == Windows ]]; then 7z a -tzip "${{ matrix.asset }}" "${{ matrix.dir }}" > /dev/null
               else
                 # Without resource forks and extended attributes: plain ditto adds an
                 # AppleDouble `._` file beside every file that has any.
                 ditto -c -k --norsrc --noextattr --noqtn --keepParent "${{ matrix.dir }}" "${{ matrix.asset }}"
                 if unzip -Z1 "${{ matrix.asset }}" | grep -E '(^|/)(\._|__MACOSX/)'; then
                   echo "::error::macOS metadata files in ${{ matrix.asset }}"; exit 1
                 fi
               fi ;;
          esac
          ls -l "${{ matrix.asset }}"
      - name: Notarized
        # A zip of programs can't be stapled: Gatekeeper asks Apple the first time each one runs.
        if: runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        run: |
          for binary in horizon-client horizon-ctl horizon-prepare horizon-server; do
            codesign --verify --strict "dist/${{ matrix.dir }}/$binary"
          done
          packaging/macos/notarize.sh "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 3
      - name: The server build (the game without sound or controllers, as horizon-engine)
        if: matrix.server_asset
        run: |
          set -euo pipefail
          # The dedicated executable belongs to horizon-game, not the gameplay library.
          cargo build --release --locked -p horizon-game --no-default-features --bin horizon-client
          cargo run --locked -p xtask -- package-server target/release/horizon-client "dist/${{ matrix.server_dir }}"
          folder="dist/${{ matrix.server_dir }}"
          python3 tools/check_imports.py --server "$folder/horizon-engine" "$folder/horizon-server" "$folder/horizon-prepare"
          "$folder/horizon-engine" --help | grep -q -- '--resources'
          [[ "$("$folder/horizon-server" --version)" == "horizon-server $HORIZON_VERSION" ]]
          cd dist
          rm -f "${{ matrix.server_asset }}"
          tar czf "${{ matrix.server_asset }}" "${{ matrix.server_dir }}"
          ls -l "${{ matrix.server_asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.server_asset
        with:
          name: ${{ matrix.server_asset }}
          path: dist/${{ matrix.server_asset }}
          if-no-files-found: error
          retention-days: 3
      - name: The signing keychain, locked again
        if: always() && runner.os == 'macOS' && vars.MACOS_SIGN_IDENTITY != '' && inputs.developer_id
        run: packaging/macos/keychain.sh lock
      - name: The run's cargo home removed
        if: always() && runner.environment == 'self-hosted'
        run: rm -rf "$RUNNER_TEMP/cargo-home"

