name: parity-hosted
# The vanilla harnesses on Blacksmith's runners instead of the Mac mini (docs/ci-runners.md#hosted-parity): the vanilla
# data comes encrypted from the maintainers' private repository horizon-rust/vanilla-data; Horizon's code still never
# downloads the game. Advisory for now: nothing waits for it, and its result is not the Mac's `parity / parity`. Runs
# start from caches that only runs of main write; what is made from the data is sealed in them (see the run job).
# A push to main runs every harness hosted runners can run, for that commit alone, at most every 3 hours (the spacing
# job) and one run at a time (below).
# Started by hand: gh workflow run parity-hosted.yml --ref <branch> -f harnesses="food light" (or -f base=<commit>,
# or -f full=true).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      harnesses:
        description: Harnesses to run by name, space-separated
        type: string
        default: ''
      base:
        description: Or a base commit (usually main's) for the harnesses the branch's changes since then can affect
        type: string
        default: ''
      full:
        description: Or every harness hosted runners can run, the known failing included, as a push to main runs
        type: boolean
        default: false
# Main's runs share one group: a run in progress is never cancelled, and of those waiting only the newest push's
# stays, so each finished run is followed by one for the newest main. A hand-started run has a group of its own and
# never displaces one of main's. A dispatch's event carries `inputs`, a push's does not (an event-name comparison in
# an expression is kept out of this file: see the gate in the plan job).
concurrency:
  group: ${{ github.event.inputs && format('parity-hosted-dispatch-{0}', github.run_id) || 'parity-hosted-main' }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  HORIZON_TELEMETRY_URL: "off"

jobs:
  # A push runs in full only when main's last full push run started at least SPACING_HOURS ago (about 8 a day);
  # otherwise the run ends here, green, saying when the next is due. A hand start is never spaced. Main's full push
  # runs leave a marker artifact, read back through the artifacts API: the one job with `actions: read`, which checks
  # nothing out, restores nothing and sees no secret. A marker counts only when the run it belongs to is this
  # workflow file's, on a push to main of this repository (asked of the runs API for that run): another workflow, or
  # a fork's pull request naming its branch main, cannot hold parity back. Anything it cannot read or parse skips
  # the run, never runs one.
  spacing:
    name: hosted parity spacing
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      go: ${{ steps.spacing.outputs.go }}
      why: ${{ steps.spacing.outputs.why }}
    steps:
      - name: Whether this run is due
        id: spacing
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO_ID: ${{ github.repository_id }}
          RUN_ID: ${{ github.run_id }}
          SPACING_HOURS: "3"
          MARKER: parity-hosted-full-start
          WORKFLOW: .github/workflows/parity-hosted.yml
        run: |
          set -uo pipefail
          STAMP='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          # "<created_at> <run id>" for each marker from another run on main of this repository, newest first.
          markers() {
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=$MARKER" \
              --jq ".artifacts[] | select(.workflow_run.head_branch == \"main\" and
                    .workflow_run.head_repository_id == $REPO_ID and .workflow_run.id != $RUN_ID)
                    | \"\(.created_at) \(.workflow_run.id)\""
          }
          # Prints ours when run $1 is this workflow file's, on a push to main of this repository.
          ours() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1" \
              --jq "select(.path == \"$WORKFLOW\" and .event == \"push\" and .head_branch == \"main\" and
                    .repository.id == $REPO_ID and .head_repository.id == $REPO_ID) | \"ours\""
          }
          decide() {
            go=false marker=false
            if [ "$EVENT" != push ]; then
              go=true why="started by hand: never spaced"; return
            fi
            if ! [[ "$REPO_ID" =~ ^[0-9]+$ && "$RUN_ID" =~ ^[0-9]+$ && "$SPACING_HOURS" =~ ^[0-9]+$ ]]; then
              why="skipped: no repository or run id to read the last full run with"; return
            fi
            local found created run answer newest="" last next
            if ! found=$(markers); then
              why="skipped: when the last full run on main started could not be read"; return
            fi
            while read -r created run; do
              [ -n "$created" ] || continue
              if ! [[ "$created" =~ $STAMP && "$run" =~ ^[0-9]+$ ]]; then
                why="skipped: a full run's marker could not be read"; return
              fi
              if ! answer=$(ours "$run"); then
                why="skipped: the run of a full run's marker could not be read"; return
              fi
              if [ "$answer" = ours ]; then newest=$created; break; fi
            done < <(printf '%s\n' "$found" | sort -r)
            if [ -z "$newest" ]; then
              go=true marker=true why="no full run on main in the artifacts' retention"; return
            fi
            if ! last=$(date -u -d "$newest" +%s 2> /dev/null); then
              why="skipped: the last full run's start could not be read"; return
            fi
            if [ $(( $(date -u +%s) - last )) -ge $(( SPACING_HOURS * 3600 )) ]; then
              go=true marker=true why="the last full run on main started at $newest"; return
            fi
            next=$(date -u -d "@$(( last + SPACING_HOURS * 3600 ))" +%Y-%m-%dT%H:%M:%SZ)
            why="skipped: the last full run on main started at $newest, less than $SPACING_HOURS h ago;"
            why+=" the first push after $next runs in full"
          }
          decide
          { echo "go=$go"; echo "marker=$marker"; echo "why=$why"; } >> "$GITHUB_OUTPUT"
          echo "$why" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$marker" = true ]; then
            mkdir -p "$RUNNER_TEMP/full-start"
            echo "$GITHUB_SHA $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$RUNNER_TEMP/full-start/started.txt"
          fi
      - name: Mark this full run's start
        if: steps.spacing.outputs.marker == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-hosted-full-start
          path: ${{ runner.temp }}/full-start/started.txt
          retention-days: 1

  # Which harnesses, on how many runners: no secret and no game data here.
  plan:
    name: hosted parity plan
    needs: spacing
    if: needs.spacing.outputs.go == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      data: ${{ steps.access.outputs.data }}
      head: ${{ steps.head.outputs.sha }}
      main: ${{ steps.merge.outputs.main }}
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
      left_out: ${{ steps.plan.outputs.left_out }}
      known_failing: ${{ steps.plan.outputs.known_failing }}
      full: ${{ steps.plan.outputs.full }}
      java: ${{ steps.keys.outputs.java }}
      prepare: ${{ steps.keys.outputs.prepare }}
      saves: ${{ steps.gate.outputs.saves }}
      trusted: ${{ steps.trusted.outputs.sha }}
      sealed: ${{ steps.trusted.outputs.sealed }}
    steps:
      # First, so nothing else can fail before it: a run without the data's secrets (a fork's, Dependabot's) runs
      # nothing, and `hosted parity (advisory)` fails saying so. Only whether they are set reaches this job.
      - name: Access to the vanilla data
        id: access
        env:
          SET: ${{ secrets.VANILLA_DATA_DEPLOY_KEY != '' && secrets.VANILLA_DATA_PASSPHRASE != '' }}
        run: echo "data=$SET" >> "$GITHUB_OUTPUT"
      # Only a run of main writes the caches every other run starts from (docs/ci-runners.md#hosted-parity): main, the
      # protected default branch, by an event that runs main's own code (a dispatch or a push; the allow-list keeps a
      # pull_request_target, which reports main's ref for another's code, out if a trigger is added). No schedule
      # trigger: its event has no repository object, so DEFAULT here and in the next step would be empty and the run
      # would stop at the trusted commit; the push queue already follows every run with one for the newest main.
      # Compared here in the shell, exactly: an expression's == ignores case, and a dispatch on a branch `Main` would
      # pass it. A step output and not a variable: the oracle shim keys every variable the harnesses see, so main's
      # saving run and a reading run would never share a record. Before the checkout: nothing of the tested commit
      # runs first.
      - name: Whether this run saves the caches
        id: gate
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          PROTECTED: ${{ github.ref_protected }}
        run: |
          saves=false
          if [ "$REF" = refs/heads/main ] && [ "$REF" = "refs/heads/$DEFAULT" ] && [ "$PROTECTED" = true ]; then
            case "$EVENT" in workflow_dispatch|push|schedule) saves=true ;; esac
          fi
          echo "saves=$saves" >> "$GITHUB_OUTPUT"
      # The default branch's commit whose fetch and seal scripts the run jobs use: each step there that holds a secret
      # downloads them by this commit, after every cache entry it depends on is restored.
      - name: The commit of the trusted scripts
        id: trusted
        if: steps.access.outputs.data == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The branch by its explicit ref: a tag or another ref of the same name never stands in for it.
          [[ "$DEFAULT" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::bad default branch name"; exit 1; }
          ref="repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT"
          sha=$(gh api "$ref" --jq 'select(.object.type == "commit") | .object.sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no commit for heads/$DEFAULT"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/contents/tools/ci/fetch-vanilla-data.sh?ref=$sha" --silent ||
            { echo "::error::no tools/ci/fetch-vanilla-data.sh on $DEFAULT"; exit 1; }
          sealed=true
          if ! gh api "repos/$GITHUB_REPOSITORY/contents/tools/ci/sealed-cache.sh?ref=$sha" --silent 2> /dev/null; then
            sealed=false
            echo "::warning::no tools/ci/sealed-cache.sh on $DEFAULT: no sealed cache this run"
          fi
          { echo "sha=$sha"; echo "sealed=$sealed"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.access.outputs.data == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The commit every job tests, resolved once. The data is the maintainers': only a commit on a branch of this
      # repository runs with it, never one that only a pull request's ref (a fork's) reaches.
      - name: The commit to test, on a branch of this repository
        id: head
        if: steps.access.outputs.data == 'true'
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          git fetch -q --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          if [ -z "$(git branch -r --contains "$sha")" ]; then
            echo "::error::$sha is on no branch of $GITHUB_REPOSITORY: hosted parity tests only its own branches' commits"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # As parity.yml: the head merged into main's current tip, what merging it would land; selection then compares
      # with that main, and the run jobs merge the same main commit. Only a head that conflicts with main is tested
      # alone, and only then does the base input count: it is what the head's changes are compared with. A push to
      # main is tested alone too: it is main, and a run that waited for the one before it would otherwise test a newer
      # main than the commit its verdict and cache entries name.
      - name: The head merged into main (what merging it would land)
        id: merge
        if: steps.access.outputs.data == 'true'
        env:
          BASE_SHA: ${{ inputs.base }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          main=$(git rev-parse origin/main)
          if [ "$EVENT" = push ]; then
            { echo "base="; echo "main="; } >> "$GITHUB_OUTPUT"
            echo "Tested: main ${HEAD_SHA:0:9} as pushed" | tee -a "$GITHUB_STEP_SUMMARY"
          elif git -c user.name=parity -c user.email=parity@localhost merge -q --no-edit --no-ff "$main" >/dev/null 2>&1; then
            { echo "base=$main"; echo "main=$main"; } >> "$GITHUB_OUTPUT"
            echo "Tested: head ${HEAD_SHA:0:9} merged into main ${main:0:9}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git merge --abort
            { echo "base=$BASE_SHA"; echo "main="; } >> "$GITHUB_OUTPUT"
            echo "::warning::head ${HEAD_SHA:0:9} conflicts with main ${main:0:9}: tested alone, without main's fixes"
            echo "Tested: head ${HEAD_SHA:0:9} alone (it conflicts with main ${main:0:9})" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # What the run jobs need from the tested tree before they check it out: they fetch and unseal first (no code of
      # the tested commit may run beside the passphrase), and validate these. The preparer's key is vanilla-data.sh's.
      - name: The JDK and the preparer's key, for the run jobs
        id: keys
        if: steps.access.outputs.data == 'true'
        run: |
          set -euo pipefail
          {
            echo "java=$(sed -n 's/.*"java_major": *\([0-9]*\).*/\1/p' research-lock.json | head -1)"
            echo "prepare=$(git ls-files -s crates/horizon-prepare mods/horizon/src/test/java research-lock.json tools/ci/vanilla-data.sh tools/ci/seed_prepared_extras.py tools/prepare_output.py | sha256sum | cut -c1-16)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.access.outputs.data == 'true'
        with:
          python-version: '3.13'
      # No dependency lists yet: every harness counts as reached by a change, so `base` plans the full set. They will
      # come from a hosted full run on main. Before this job takes them, it must check that the run producing them is
      # this repository's own parity-hosted.yml on a push or schedule of refs/heads/main (head repository this one, a
      # fork's pull request reports head_branch main too), at a head SHA that is an ancestor of the main tested here,
      # and validate every record before any build option in it reaches cargo.
      - name: The harnesses, in shards by probe
        id: plan
        if: steps.access.outputs.data == 'true'
        env:
          BASE_SHA: ${{ steps.merge.outputs.base }}
          HARNESSES: ${{ inputs.harnesses }}
          FULL: ${{ inputs.full }}
          EVENT: ${{ github.event_name }}
          PARITY_SHARED: ${{ runner.temp }}/parity-shared
        run: |
          set -euo pipefail
          # A full run takes the known failing harnesses too: the verdict then says which of them pass now.
          known=()
          if [ -n "$HARNESSES" ]; then
            read -ra selection <<< "$HARNESSES"
          elif [ "$EVENT" = push ] || [ "$FULL" = true ]; then
            selection=(--all) known=(--known-failing)
          elif [ -n "$BASE_SHA" ]; then
            selection=(--changed "$BASE_SHA")
          else
            echo "::error::name harnesses (-f harnesses=...), a base commit (-f base=...) or -f full=true"
            exit 1
          fi
          echo "full=$([ "${selection[0]}" = --all ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          python3 tools/parity_plan.py --hosted "${known[@]}" --plan "$RUNNER_TEMP/plan.json" -- "${selection[@]}" |
            tee -a "$GITHUB_STEP_SUMMARY"
          python3 - <<'EOF'
          import json, os
          plan = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "plan.json")))
          # For the verdict, which has no checkout: each known failing entry (a harness's or one shard's) with every
          # harness or shard it covers, those left out of this plan included: it can come off only when all of them
          # passed here.
          import sys
          sys.path.insert(0, "tools")
          import parity
          found = list(parity.harnesses())
          known = {entry: [name for name in found if name == entry or parity.base_name(name) == entry]
                   for entry in sorted(parity.known_failing(parity.host_config()))}
          shards = [shard for shard in plan["shards"] if shard["harnesses"]]
          # A group's first shard alone saves its build folders on main: one entry per group, not one per shard.
          first = {}
          for index, shard in enumerate(shards, 1):
              first.setdefault(shard["group"], index)
          include = [{"shard": index, "of": len(shards), "group": shard["group"], "harnesses": " ".join(shard["harnesses"]),
                      "saves_build": first[shard["group"]] == index}
                     for index, shard in enumerate(shards, 1)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"matrix={json.dumps({'include': include})}\n")
              output.write(f"shards={len(shards)}\n")
              output.write(f"left_out={json.dumps(plan['left_out'])}\n")
              output.write(f"known_failing={json.dumps(known)}\n")
          EOF

  # One shard: the data, the shard's probes and its harnesses, on a 16-vCPU runner with no GPU (Xvfb and Mesa's
  # software Vulkan for the harnesses that start the game). It starts from main's caches (docs/ci-runners.md#hosted-
  # parity): the dataset's encrypted chunks as they are; the build folders, prepared resources, oracle results and
  # parity state sealed and authenticated by tools/ci/sealed-cache.sh. Only a run of main (the plan's `saves`) writes
  # any of them.
  #
  # The steps that hold a secret (fetch, unseal, seal) trust nothing a cache entry could have written: actions/cache
  # unpacks an entry with absolute paths before anything checks it, so an entry should cache scoping fail could write
  # any file the runner's user owns. They run with root's bash from /usr/bin, download their script from the trusted
  # commit inside the step, and run it with PATH=/usr/bin:/bin, a new empty HOME, only the variables it needs and the
  # secrets on its stdin (never a command line); an entry's contents are data, checked before they are decrypted.
  run:
    name: hosted parity ${{ matrix.shard }}/${{ matrix.of }} (${{ matrix.group }})
    needs: plan
    if: needs.plan.outputs.data == 'true' && needs.plan.outputs.shards != '0'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # No compiler cache: sccache would keep what this job builds where nothing checks it.
      HORIZON_NO_SCCACHE: "1"
      CARGO_BUILD_JOBS: "16"
      # dtolnay/rust-toolchain sets 0 when it is unset, which turns off the profiles' incremental builds: a cached
      # build then recompiles a changed crate whole (a one-line gameplay change: 162 s instead of 19 s).
      CARGO_INCREMENTAL: "1"
      PARITY_LOCAL_JOBS: "8"
      PARITY_MACHINE_JOBS: "8"
      PARITY_HOSTS: ''
      # A harness retried after a first failure keeps that run's log (tools/parity.py): uploaded below.
      PARITY_KEEP_FIRST_LOGS: "1"
      # This fresh runner has one parity run, which owns the oracle cache alone: tools/parity.py may remove a damaged
      # hash database before the shims start (elsewhere another run in the checkout may have it open).
      PARITY_REPAIR_ORACLE_HASHES: "1"
      # tools/parity_hosts.json's solo harnesses (game windows) run alone, after the others: their frames are drawn
      # on the CPU here (lavapipe), and beside 7 other harnesses remote_fireball saw its egg in 1 of 6 samples, twice
      # (2026-11-23), as on playhorizon. tools/parity.py turns solo off by itself on more than 4 CPUs.
      PARITY_SOLO: "1"
      DATASET: 26.3-linux-x64
    steps:
      - name: Folders for the data, outside the checkout
        run: |
          {
            echo "HORIZON_SHARED_SOURCE=$RUNNER_TEMP/vanilla/shared-local"
            echo "HORIZON_PREPARED_CACHE=$RUNNER_TEMP/vanilla/prepared"
            echo "PARITY_SHARED=$RUNNER_TEMP/vanilla/parity-shared"
            echo "VANILLA_DATA_CACHE=$RUNNER_TEMP/vanilla-encrypted"
            echo "SEALED=$RUNNER_TEMP/sealed"
            echo "UNSEALED=$RUNNER_TEMP/unsealed"
            # The oracle shim's memo of JDK file hashes, guarded by this machine's stat data (tools/parity_shim.py):
            # never sealed, restored or placed.
            echo "RUNTIME_MEMO=$GITHUB_WORKSPACE/.local/parity-runner/runtime-memo"
            # This run's harness logs: one restored from an earlier run would read as this run's (a first-run log as
            # an unfinished retry).
            echo "PARITY_LOGS=$GITHUB_WORKSPACE/.local/parity-runner/logs"
          } >> "$GITHUB_ENV"
      # Before the checkout: the keys below may only come from what the tested commit cannot run.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ needs.plan.outputs.java }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: stable
      # Keys, before any cache entry is restored. The build folders: the shard's probe group and the toolchain, then
      # the week (restored from the newest of the same group and toolchain; Cargo fingerprints what changed since). The
      # oracle results and parity state: their format, the dataset, the JDK, the toolchain and the runner's folders
      # (the oracle shim keys on absolute paths), then the group, the week and the shard. The prepared resources: the
      # preparer's key and the dataset. The plan job's values come from the tested tree: checked before they name
      # anything. v3/v2: sealed entries name their key since 2026-11-20 (tools/ci/sealed-cache.sh).
      - name: Cache keys
        id: keys
        env:
          GROUP: ${{ matrix.group }}
          JAVA_MAJOR: ${{ needs.plan.outputs.java }}
          PREPARE: ${{ needs.plan.outputs.prepare }}
        run: |
          set -euo pipefail
          [[ "$GROUP" =~ ^[a-z+]+$ && "$JAVA_MAJOR" =~ ^[0-9]+$ && "$PREPARE" =~ ^[0-9a-f]{16}$ ]] ||
            { echo "::error::the plan's keys are not what it computes"; exit 1; }
          h() { sha256sum | cut -c1-12; }
          rust=$(rustc -vV | h)
          java=$(java -version 2>&1 | h)
          folders=$(echo "$GITHUB_WORKSPACE $RUNNER_TEMP" | h)
          {
            echo "build=parity-build-v2-$GROUP-$rust-"
            echo "oracle=$java-$rust-$folders-$GROUP-"
            echo "prepare=$PREPARE"
          } >> "$GITHUB_OUTPUT"
      - name: Restore the encrypted dataset
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VANILLA_DATA_CACHE }}
          key: parity-dataset-v1-${{ env.DATASET }}-newest
          restore-keys: parity-dataset-v1-${{ env.DATASET }}-
      # The only step with the deploy key. The script writes the secrets to a private folder and removes it, key and
      # passphrase with it, before it ends; it prints sizes, counts and timings only. It takes the restored chunks only
      # when they are plain files matching the MANIFEST it reads from the repository, and reports the dataset's digest
      # for the keys.
      - name: Fetch the vanilla data
        id: fetch
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          VANILLA_DATA_DEPLOY_KEY: ${{ secrets.VANILLA_DATA_DEPLOY_KEY }}
          VANILLA_DATA_PASSPHRASE: ${{ secrets.VANILLA_DATA_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SHA: ${{ needs.plan.outputs.trusted }}
          BASH_ENV: ''
          ENV: ''
        run: |
          # The trusted script in a fixed environment (see the run job's comment).
          export PATH=/usr/bin:/bin
          unset BASH_ENV ENV CDPATH
          if [ -w /usr/bin ] || [ -w /bin ]; then echo "::error::/usr/bin is writable: no step with a secret"; exit 1; fi
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no trusted commit"; exit 1; }
          private=$(mktemp -d /tmp/trusted.XXXXXXXX)
          trap 'rm -rf "$private"' EXIT
          mkdir "$private/home"
          api() {  # api ACCEPT PATH FILE; the token goes on stdin, never on a command line
            printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" |
              env -i HOME="$private/home" PATH=/usr/bin:/bin curl -q -fsS --proto =https --retry 3 --max-time 120 -K - \
                -H "Accept: $1" -o "$3" "https://api.github.com/repos/$GITHUB_REPOSITORY/$2"
          }
          # verified FILE ID: FILE is not empty and its git blob id, sha1 of "blob <length>\0" and its bytes, is ID.
          verified() {
            [[ "$2" =~ ^[0-9a-f]{40}$ ]] && [ -s "$1" ] &&
              [ "$({ printf 'blob %d\0' "$(stat -c %s "$1")"; cat "$1"; } | sha1sum | cut -c1-40)" = "$2" ]
          }
          # fetched NAME: tools/ci/NAME at the trusted commit into the private folder, its bytes checked against the
          # blob id the API names for that path at that commit, asked for separately.
          fetched() {
            api application/vnd.github+json "contents/tools/ci/$1?ref=$TRUSTED_SHA" "$private/$1.json" &&
              api application/vnd.github.raw "contents/tools/ci/$1?ref=$TRUSTED_SHA" "$private/$1" &&
              verified "$private/$1" "$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["sha"])' \
                "$private/$1.json" 2> /dev/null)"
          }
          isolated() {
            local secrets=$1 name extra=()
            shift
            while [ "$1" != -- ]; do extra+=("$1"); shift; done
            shift
            for name in $secrets; do printf '%s\0' "${!name}"; done |
              env -i PATH=/usr/bin:/bin HOME="$private/home" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" \
                GITHUB_OUTPUT="$GITHUB_OUTPUT" "${extra[@]}" bash --noprofile --norc -c \
                'for name in $1; do IFS= read -r -d "" "$name"; export "$name"; done; shift; exec bash --noprofile --norc "$@"' \
                isolated "$secrets" "$@"
          }
          fetched fetch-vanilla-data.sh || {
            echo "::error::tools/ci/fetch-vanilla-data.sh at $TRUSTED_SHA did not download, or is not the blob the API" \
              "names: no data, the shard stops"
            exit 1
          }
          isolated "VANILLA_DATA_DEPLOY_KEY VANILLA_DATA_PASSPHRASE" VANILLA_DATA_CACHE="$VANILLA_DATA_CACHE" -- \
            "$private/fetch-vanilla-data.sh" "$HORIZON_SHARED_SOURCE" "$DATASET"
      # The keys of this shard's sealed entries, from the parts above and the dataset's digest: the same strings name
      # an entry when it is restored, sealed (which authenticates it) and saved. A key names the UTC week, not the
      # commit: a key is never overwritten and the runners' cache has no delete a workflow can reach without a new
      # secret, so main's first full run of a week saves the build (about 15 GB) and each shard's oracle entry, and
      # later runs that week restore them and save nothing (an exact key's hit). A week's entries go unused the next
      # week and are evicted 7 days after their last use.
      - name: Keys of the sealed entries
        id: entries
        if: needs.plan.outputs.sealed == 'true' && steps.fetch.outputs.digest != ''
        env:
          DIGEST: ${{ steps.fetch.outputs.digest }}
          BUILD: ${{ steps.keys.outputs.build }}
          ORACLE: ${{ steps.keys.outputs.oracle }}
          PREPARE: ${{ steps.keys.outputs.prepare }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^[0-9a-f]{16}$ && "$SHARD" =~ ^[0-9]+$ ]] || { echo "::error::bad digest or shard"; exit 1; }
          week=$(date -u +%G-w%V)
          {
            echo "prepared=parity-prepared-v2-$PREPARE-$DIGEST"
            echo "oracle_prefix=parity-oracle-v3-$DIGEST-$ORACLE"
            echo "oracle=parity-oracle-v3-$DIGEST-$ORACLE$week-$SHARD"
            echo "build_prefix=$BUILD"
            echo "build=$BUILD$week"
          } >> "$GITHUB_OUTPUT"
      - name: Restore the prepared resources (sealed)
        id: prepared
        if: steps.entries.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SEALED }}/prepared
          key: ${{ steps.entries.outputs.prepared }}
      - name: Restore the oracle results and parity state (sealed)
        id: oracle
        if: steps.entries.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SEALED }}/oracle
          key: ${{ steps.entries.outputs.oracle }}
          restore-keys: ${{ steps.entries.outputs.oracle_prefix }}
      - name: Restore the build folders (sealed)
        id: build
        if: steps.entries.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SEALED }}/build
          key: ${{ steps.entries.outputs.build }}
          restore-keys: ${{ steps.entries.outputs.build_prefix }}
      # The passphrase's second step, after every restore. An entry sealed for a key outside its prefix, whose tag
      # fails, or holding a member that may not be unpacked is discarded with a warning (the run goes on without it),
      # never decrypted or unpacked. What it holds goes to a stage, moved into place after the checkout.
      - name: Unseal the restored caches
        if: steps.entries.outcome == 'success'
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          VANILLA_DATA_PASSPHRASE: ${{ secrets.VANILLA_DATA_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SHA: ${{ needs.plan.outputs.trusted }}
          BASH_ENV: ''
          ENV: ''
          PREPARED: ${{ steps.entries.outputs.prepared }}
          ORACLE_PREFIX: ${{ steps.entries.outputs.oracle_prefix }}
          BUILD_PREFIX: ${{ steps.entries.outputs.build_prefix }}
        run: |
          # The trusted script in a fixed environment (see the run job's comment).
          export PATH=/usr/bin:/bin
          unset BASH_ENV ENV CDPATH
          if [ -w /usr/bin ] || [ -w /bin ]; then echo "::error::/usr/bin is writable: no step with a secret"; exit 1; fi
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no trusted commit"; exit 1; }
          private=$(mktemp -d /tmp/trusted.XXXXXXXX)
          trap 'rm -rf "$private"' EXIT
          mkdir "$private/home"
          api() {  # api ACCEPT PATH FILE; the token goes on stdin, never on a command line
            printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" |
              env -i HOME="$private/home" PATH=/usr/bin:/bin curl -q -fsS --proto =https --retry 3 --max-time 120 -K - \
                -H "Accept: $1" -o "$3" "https://api.github.com/repos/$GITHUB_REPOSITORY/$2"
          }
          # verified FILE ID: FILE is not empty and its git blob id, sha1 of "blob <length>\0" and its bytes, is ID.
          verified() {
            [[ "$2" =~ ^[0-9a-f]{40}$ ]] && [ -s "$1" ] &&
              [ "$({ printf 'blob %d\0' "$(stat -c %s "$1")"; cat "$1"; } | sha1sum | cut -c1-40)" = "$2" ]
          }
          # fetched NAME: tools/ci/NAME at the trusted commit into the private folder, its bytes checked against the
          # blob id the API names for that path at that commit, asked for separately.
          fetched() {
            api application/vnd.github+json "contents/tools/ci/$1?ref=$TRUSTED_SHA" "$private/$1.json" &&
              api application/vnd.github.raw "contents/tools/ci/$1?ref=$TRUSTED_SHA" "$private/$1" &&
              verified "$private/$1" "$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["sha"])' \
                "$private/$1.json" 2> /dev/null)"
          }
          isolated() {
            local secrets=$1 name extra=()
            shift
            while [ "$1" != -- ]; do extra+=("$1"); shift; done
            shift
            for name in $secrets; do printf '%s\0' "${!name}"; done |
              env -i PATH=/usr/bin:/bin HOME="$private/home" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" \
                GITHUB_OUTPUT="$GITHUB_OUTPUT" "${extra[@]}" bash --noprofile --norc -c \
                'for name in $1; do IFS= read -r -d "" "$name"; export "$name"; done; shift; exec bash --noprofile --norc "$@"' \
                isolated "$secrets" "$@"
          }
          fetched sealed-cache.sh || {
            echo "::warning::tools/ci/sealed-cache.sh at $TRUSTED_SHA did not download, or is not the blob the API" \
              "names: this run starts cold"
            exit 0
          }
          for entry in "prepared $PREPARED" "oracle $ORACLE_PREFIX" "build $BUILD_PREFIX"; do
            read -r label key <<< "$entry"
            isolated VANILLA_DATA_PASSPHRASE -- "$private/sealed-cache.sh" unseal "$label" "$key" "$SEALED/$label/archive" \
              --exclude "$RUNTIME_MEMO" --exclude "$PARITY_LOGS" "$UNSEALED/$label"
            rm -rf "${SEALED:?}/$label"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: The head merged into the plan's main
        env:
          MAIN_SHA: ${{ needs.plan.outputs.main }}
        run: |
          set -euo pipefail
          if [ -n "$MAIN_SHA" ]; then
            git fetch -q --no-tags origin "$MAIN_SHA"
            git -c user.name=parity -c user.email=parity@localhost merge -q --no-edit --no-ff "$MAIN_SHA"
          fi
      # Moved, not copied (the build folders are tens of GB; the stage is on the same disk), keeping their dates to
      # the nanosecond: the oracle shim replays a run only while its outputs keep theirs.
      - name: The unsealed files into place
        run: |
          python3 - "$UNSEALED" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" <<'EOF'
          import shutil, sys
          from pathlib import Path
          stages, roots = Path(sys.argv[1]), sys.argv[2:]
          def merge(source, target):
              for entry in sorted(source.iterdir()):
                  there = target / entry.name
                  if entry.is_dir() and not entry.is_symlink() and there.is_dir() and not there.is_symlink():
                      merge(entry, there)
                      continue
                  if there.is_symlink() or there.is_file():
                      there.unlink()
                  elif there.exists():
                      shutil.rmtree(there)
                  shutil.move(entry, there)
          for stage in sorted(stages.iterdir()) if stages.is_dir() else []:
              for root in roots:
                  source = stage / root.lstrip("/")
                  if source.is_dir():
                      Path(root).mkdir(parents=True, exist_ok=True)
                      merge(source, Path(root))
          shutil.rmtree(stages, ignore_errors=True)
          EOF
      # What tools/ci/linux-runner.sh installs on Ubuntu, the screen included (Xvfb, Mesa's lavapipe), less sccache,
      # and less what the image has (gcc, make; no crate builds with cmake).
      - name: Build and screen packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libasound2-dev libudev-dev \
            mesa-vulkan-drivers libvulkan1 xvfb x11-utils libx11-6 libxcursor1 libxrandr2 libxi6 libxinerama1 \
            libxkbcommon0 libxkbcommon-x11-0 libgl1 libegl1 > /dev/null
      - name: A virtual screen with software Vulkan
        run: |
          Xvfb :90 -screen 0 1280x720x24 -nolisten tcp > /dev/null 2>&1 &
          for _ in $(seq 100); do xdpyinfo -display :90 > /dev/null 2>&1 && break; sleep 0.1; done
          xdpyinfo -display :90 > /dev/null 2>&1 || { echo "::error::Xvfb did not answer within 10 s"; exit 1; }
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          [ -n "$icd" ] || { echo "::error::no lavapipe driver file"; exit 1; }
          { echo "DISPLAY=:90"; echo "VK_DRIVER_FILES=$icd"; } >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Tools from the runner
        run: bash tools/ci/runner-env.sh
      # The crates Cargo.lock names, before any harness: a fresh runner has none, and the harnesses that run cargo
      # --offline (mob_discard, nbt_path_reader, snbt_unicode) otherwise fail in a second unless another harness has
      # fetched them first (mob_discard on 2026-11-23). Fetching runs no build script; ~/.cargo is never sealed.
      - name: The crates, before the harnesses
        run: cargo fetch --locked
      # A checkout dates every file now: files whose Git object is the one the restored build saw get that build's
      # dates back (as tools/ci/build_folder.sh does for the sticky disks), so Cargo rebuilds only what changed.
      - name: Source dates of the restored build
        run: |
          mkdir -p .local/parity-target target
          python3 tools/ci/source_mtimes.py .local/parity-target/source-mtimes-v1.json
      - name: Vanilla data, and resources prepared by this preparer
        run: bash tools/ci/vanilla-data.sh
      # The oracles' shims (tools/parity_shim.py) share one hash database. On a cold cache the first ones all create
      # it and switch it to WAL at once, and a shim can fail there ("database is locked"), failing its harness's first
      # run. Created here first, alone. A damaged one (an entry cut short) is left here: tools/parity.py removes it
      # before the first shim starts (check_oracle_hashes, PARITY_REPAIR_ORACLE_HASHES), and a shim that meets one
      # hashes files itself.
      - name: The oracle cache, created before the harnesses start
        env:
          PARITY_SHIM_CACHE: ${{ github.workspace }}/.local/parity-runner/oracle-cache
        run: |
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, "tools")
          import parity_shim
          parity_shim.Hashes().close()  # never an error, a damaged database included
          EOF
      - name: The shard's harnesses
        id: harnesses
        env:
          HARNESSES: ${{ matrix.harnesses }}
        run: |
          # The restored parity state holds main's earlier results: only records finished after this file are this
          # run's (the step below). A file, not a variable: the harnesses must see nothing that differs per run.
          touch "$RUNNER_TEMP/harnesses-started"
          read -ra names <<< "$HARNESSES"
          python3 tools/parity.py --timeout 2400 "${names[@]}"
      # The first run's log of each retried harness, and the last log of each that did not pass (compared values, log
      # tails and names, as parity.yml's), kept 3 days. Nothing else of .local/ or the data leaves the runner, but
      # results-<shard>.json: each harness this run finished, whether it passed and whether it was retried, from its
      # saved record. A harness with no record finished in this run is left out of it: the verdict says it did not
      # finish, never that it passed. A first log is moved aside before its retry starts, so a shard stopped mid-retry
      # leaves one with no outcome: never read as passed.
      - name: The logs to keep
        if: always()
        env:
          HARNESSES: ${{ matrix.harnesses }}
          SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'EOF'
          import json, os, shutil, time
          from pathlib import Path
          logs, kept = Path(".local/parity-runner/logs"), Path(os.environ["RUNNER_TEMP"]) / "parity-hosted-logs"
          kept.mkdir(parents=True, exist_ok=True)
          try:
              records = json.loads(Path(".local/parity-runner/state.json").read_text())["harnesses"]
          except (OSError, ValueError, KeyError):
              records = {}
          try:
              # tools/parity.py's own format and clock for a record's `finished`.
              started = time.strftime("%Y-%m-%dT%H:%M:%S", time.localtime(
                  Path(os.environ["RUNNER_TEMP"], "harnesses-started").stat().st_mtime))
          except OSError:
              started = None  # the harnesses never started: nothing here is this run's
          names = os.environ["HARNESSES"].split()
          ours = {name: records[name] for name in names if started and isinstance(records.get(name), dict)
                  and str(records[name].get("finished", "")) >= started}
          for name in names:
              chosen = [logs / f"{name}.first-run.log"]
              if ours.get(name, {}).get("status") != "pass":
                  chosen.append(logs / f"{name}.log")
              for log in chosen:
                  if log.exists():
                      shutil.copy(log, kept)
          results = {name: {"status": "pass" if record.get("status") == "pass" else "fail",
                            "retried": bool(record.get("retried"))} for name, record in ours.items()}
          (kept / f"results-{os.environ['SHARD']}.json").write_text(json.dumps(results))
          EOF
      - name: Upload the logs to keep
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-hosted-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/parity-hosted-logs/
          if-no-files-found: ignore
          retention-days: 3
      # The saves: main's runs only (the plan's `saves`), whether its harnesses passed or not, once they ran. An entry
      # whose exact key exists (the same commit again) is not saved twice. The dataset and the prepared resources are
      # the same for every shard (the first saves them), the build folders for every shard of a group (its first).
      - name: Save the encrypted dataset
        if: ${{ !cancelled() && needs.plan.outputs.saves == 'true' && matrix.shard == 1 && steps.fetch.outputs.cache == 'refreshed' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VANILLA_DATA_CACHE }}
          key: parity-dataset-v1-${{ env.DATASET }}-${{ steps.fetch.outputs.digest }}
      # The passphrase's third step, on main only, where the tested code is main's own. Every real folder in .local/
      # but the build (the rest are links to the data), and parity.py's shared passes; the prepared resources once;
      # the build folders (sealed too: a build script could copy data into them, and the harnesses run what they hold).
      - name: Seal for the caches
        id: seal
        if: ${{ !cancelled() && needs.plan.outputs.saves == 'true' && steps.entries.outcome == 'success' && steps.harnesses.outcome != 'skipped' }}
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          VANILLA_DATA_PASSPHRASE: ${{ secrets.VANILLA_DATA_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SHA: ${{ needs.plan.outputs.trusted }}
          BASH_ENV: ''
          ENV: ''
          SEAL_PREPARED: ${{ matrix.shard == 1 && steps.prepared.outputs.cache-hit != 'true' }}
          SEAL_ORACLE: ${{ steps.oracle.outputs.cache-hit != 'true' }}
          SEAL_BUILD: ${{ matrix.saves_build && steps.build.outputs.cache-hit != 'true' }}
          PREPARE: ${{ steps.keys.outputs.prepare }}
          PREPARED: ${{ steps.entries.outputs.prepared }}
          ORACLE: ${{ steps.entries.outputs.oracle }}
          BUILD: ${{ steps.entries.outputs.build }}
        run: |
          # The trusted script in a fixed environment (see the run job's comment).
          export PATH=/usr/bin:/bin
          unset BASH_ENV ENV CDPATH
          if [ -w /usr/bin ] || [ -w /bin ]; then echo "::error::/usr/bin is writable: no step with a secret"; exit 1; fi
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no trusted commit"; exit 1; }
          private=$(mktemp -d /tmp/trusted.XXXXXXXX)
          trap 'rm -rf "$private"' EXIT
          mkdir "$private/home"
          api() {  # api ACCEPT PATH FILE; the token goes on stdin, never on a command line
            printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" |
              env -i HOME="$private/home" PATH=/usr/bin:/bin curl -q -fsS --proto =https --retry 3 --max-time 120 -K - \
                -H "Accept: $1" -o "$3" "https://api.github.com/repos/$GITHUB_REPOSITORY/$2"
          }
          # verified FILE ID: FILE is not empty and its git blob id, sha1 of "blob <length>\0" and its bytes, is ID.
          verified() {
            [[ "$2" =~ ^[0-9a-f]{40}$ ]] && [ -s "$1" ] &&
              [ "$({ printf 'blob %d\0' "$(stat -c %s "$1")"; cat "$1"; } | sha1sum | cut -c1-40)" = "$2" ]
          }
          # fetched NAME: tools/ci/NAME at the trusted commit into the private folder, its bytes checked against the
          # blob id the API names for that path at that commit, asked for separately.
          fetched() {
            api application/vnd.github+json "contents/tools/ci/$1?ref=$TRUSTED_SHA" "$private/$1.json" &&
              api application/vnd.github.raw "contents/tools/ci/$1?ref=$TRUSTED_SHA" "$private/$1" &&
              verified "$private/$1" "$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["sha"])' \
                "$private/$1.json" 2> /dev/null)"
          }
          isolated() {
            local secrets=$1 name extra=()
            shift
            while [ "$1" != -- ]; do extra+=("$1"); shift; done
            shift
            for name in $secrets; do printf '%s\0' "${!name}"; done |
              env -i PATH=/usr/bin:/bin HOME="$private/home" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" \
                GITHUB_OUTPUT="$GITHUB_OUTPUT" "${extra[@]}" bash --noprofile --norc -c \
                'for name in $1; do IFS= read -r -d "" "$name"; export "$name"; done; shift; exec bash --noprofile --norc "$@"' \
                isolated "$secrets" "$@"
          }
          fetched sealed-cache.sh || {
            echo "::warning::tools/ci/sealed-cache.sh at $TRUSTED_SHA did not download, or is not the blob the API" \
              "names: this run saves nothing"
            exit 0
          }
          seal() { isolated VANILLA_DATA_PASSPHRASE -- "$private/sealed-cache.sh" seal "$@"; }
          if [ "$SEAL_PREPARED" = true ] && [ -d "$HORIZON_PREPARED_CACHE/prepared/$PREPARE" ]; then
            seal prepared "$PREPARED" "$SEALED/prepared/archive" "$HORIZON_PREPARED_CACHE/prepared/$PREPARE"
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$SEAL_ORACLE" = true ]; then
            mapfile -t folders < <(find .local -mindepth 1 -maxdepth 1 -type d ! -name parity-target -printf "$PWD/%p\n")
            seal oracle "$ORACLE" "$SEALED/oracle/archive" --exclude "$RUNTIME_MEMO" --exclude "$PARITY_LOGS" \
              "${folders[@]}" "$PARITY_SHARED"
            echo "oracle=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$SEAL_BUILD" = true ]; then
            seal build "$BUILD" "$SEALED/build/archive" "$GITHUB_WORKSPACE/.local/parity-target" "$GITHUB_WORKSPACE/target"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the prepared resources (sealed)
        if: ${{ !cancelled() && steps.seal.outputs.prepared == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SEALED }}/prepared
          key: ${{ steps.entries.outputs.prepared }}
      - name: Save the oracle results and parity state (sealed)
        if: ${{ !cancelled() && steps.seal.outputs.oracle == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SEALED }}/oracle
          key: ${{ steps.entries.outputs.oracle }}
      - name: Save the build folders (sealed)
        if: ${{ !cancelled() && steps.seal.outputs.build == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SEALED }}/build
          key: ${{ steps.entries.outputs.build }}

  # The job to read: it fails when hosted parity failed or did not run at all. Its summary is the verdict: the tested
  # commit, how many harnesses were planned and passed, which failed, passed only on retry or did not finish, which
  # known failing ones passed, and what was left out and why. The same as JSON in the parity-hosted-verdict artifact
  # and on one `parity-hosted-verdict {...}` line of this job's log. Main's verdict is a run whose event is push. A
  # push run the spacing job skipped passes with its one line, and leaves no verdict: the newest verdict is a real one.
  result:
    name: hosted parity (advisory)
    needs: [spacing, plan, run]
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      # The shards' results-<shard>.json, with their logs; a failed download is said below.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: logs
        if: needs.run.result != 'skipped'
        continue-on-error: true
        with:
          pattern: parity-hosted-logs-*
          path: ${{ runner.temp }}/logs
          merge-multiple: true
      - name: Passed or failed, and what was not run here
        env:
          SPACING: ${{ needs.spacing.result }}
          DUE: ${{ needs.spacing.outputs.go }}
          WHY: ${{ needs.spacing.outputs.why }}
          PLAN: ${{ needs.plan.result }}
          DATA: ${{ needs.plan.outputs.data }}
          RUN: ${{ needs.run.result }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          LEFT_OUT: ${{ needs.plan.outputs.left_out }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          KNOWN_FAILING: ${{ needs.plan.outputs.known_failing }}
          FULL: ${{ needs.plan.outputs.full }}
          HEAD_SHA: ${{ needs.plan.outputs.head }}
          MAIN_SHA: ${{ needs.plan.outputs.main }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          LOGS: ${{ steps.logs.outcome }}
        run: |
          set -o pipefail  # a step's default shell is bash -e only: without it, tee's success would hide a failure
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, re, sys
          from pathlib import Path
          env = os.environ
          plan, data, run, shards = (env[key] for key in ("PLAN", "DATA", "RUN", "SHARDS"))
          if env["SPACING"] == "success" and env["DUE"] != "true":
              print(f"Hosted parity not run: {env['WHY'][:300]}")
              sys.exit(0)
          # Names come from the tested tree and its runners: shown only in a harness name's shape.
          NAME = re.compile(r"[A-Za-z0-9_.-]+(#[0-9]+)?")
          SHA = re.compile(r"[0-9a-f]{40}")
          def parsed(text, default):
              try:
                  value = json.loads(text) if text else default
              except ValueError:
                  return default
              return value if isinstance(value, type(default)) else default
          def shown(name):
              return name if NAME.fullmatch(name) else "(a name not shown)"
          def listed(names):
              return ", ".join(map(shown, names)) or "none"
          def escaped(text):
              # A reason from the tested tree, as one line of plain text: control characters and line breaks as
              # JSON escapes, Markdown and HTML characters behind a backslash. The JSON keeps the original string.
              return re.sub(r"([\\`*_{}\[\]()<>#+!|~&-])", r"\\\1", json.dumps(text)[1:-1])
          planned = [name for shard in parsed(env["MATRIX"], {}).get("include", []) if isinstance(shard, dict)
                     for name in str(shard.get("harnesses", "")).split()]
          # {entry: every harness or shard it covers}, from the plan job.
          known = {str(entry): [str(name) for name in names]
                   for entry, names in parsed(env["KNOWN_FAILING"], {}).items() if isinstance(names, list)}
          left = {str(name): str(why) for name, why in parsed(env["LEFT_OUT"], {}).items()}
          logs = Path(env["RUNNER_TEMP"]) / "logs"
          results = {}
          for path in sorted(logs.glob("results-*.json")) if logs.is_dir() else []:
              for name, record in parsed(path.read_text(encoding="utf-8", errors="replace"), {}).items():
                  if name in planned and isinstance(record, dict):
                      results[name] = record
          # Without the shards' files the lists are unknown: said so, never read as no failures.
          lists = data == "true" and plan == "success" and (run == "skipped" or env["LOGS"] == "success")
          def entry(name):
              base = name.split("#", 1)[0]
              return name if name in known else base if base in known else None
          passed = [name for name in planned if results.get(name, {}).get("status") == "pass"]
          failed = [name for name in planned if name in results and name not in passed]
          unfinished = [name for name in planned if name not in results]
          blocking = [name for name in failed if entry(name) is None]
          again = [name for name in failed if entry(name) is not None]
          retried = [name for name in passed if results[name].get("retried")]
          # An entry can come off only when every harness or shard it covers passed here, those the plan left out
          # included; one that passed wherever it ran, but not everywhere, is said so.
          passing = set(passed)
          ran = sorted({entry(name) for name in passed if entry(name)} - {entry(name) for name in again})
          off = [name for name in ran if known[name] and all(shard in passing for shard in known[name])]
          partly = [name for name in ran if name not in off]
          def missing():
              names = ", ".join(map(shown, unfinished[:20])) + (" …" if len(unfinished) > 20 else "")
              return f"no result for {len(unfinished)} planned harnesses ({names})"
          if env["SPACING"] != "success":
              verdict, ok = f"FAILED: the spacing job ended {env['SPACING']}", False
          elif data != "true":
              verdict, ok = "FAILED: hosted parity did not run: no access to the data", False
          elif plan != "success":
              verdict, ok = f"FAILED: the plan job ended {plan}", False
          elif shards == "0" and run == "skipped":
              verdict, ok = "Hosted parity: nothing to run.", True
          elif run != "success":
              verdict, ok = f"FAILED: hosted parity's shards ended {run}: see their jobs", False
          elif not lists:
              verdict, ok = "FAILED: incomplete: the shards' results could not be downloaded", False
          elif unfinished:
              verdict, ok = f"FAILED: incomplete: {missing()}", False
          elif blocking:
              verdict, ok = f"FAILED: {len(blocking)} harnesses failed", False
          else:
              verdict, ok = f"Hosted parity passed: {shards} shards.", True
          head = env["HEAD_SHA"] if SHA.fullmatch(env["HEAD_SHA"]) else None
          main = env["MAIN_SHA"] if SHA.fullmatch(env["MAIN_SHA"]) else None
          selection = "full" if env["FULL"] == "true" else "subset"
          record = {"run": env.get("GITHUB_RUN_ID"), "event": env["EVENT"], "ref": env["REF"], "commit": head,
                    "merged_into_main": main, "selection": selection, "passed": ok, "verdict": verdict,
                    "planned": len(planned), "harnesses_passed": len(passed) if lists else None,
                    **{key: value if lists else None for key, value in (
                        ("failed", blocking), ("passed_on_retry", retried), ("known_failing_failed", again),
                        ("known_failing_passed", off), ("known_failing_passed_where_run", partly),
                        ("did_not_finish", unfinished))},
                    "left_out": left}
          tested = f"`{head}` merged into main `{main}`" if head and main else f"`{head}`" if head else "unknown"
          print(f"## {'Passed' if ok else 'FAILED'}: hosted parity, {selection} selection ({env['EVENT']})\n")
          print(f"Commit: {tested}\n")
          if lists:
              print(f"{len(planned)} harnesses planned: {len(passed)} passed, {len(blocking)} failed, {len(again)} "
                    f"known failing failed again, {len(unfinished)} did not finish; {len(left)} left out.\n")
              print(f"- failed: {listed(blocking)}")
              print(f"- passed only on retry: {listed(retried)}")
              print(f"- known failing, failed again: {listed(again)}")
              print(f"- known failing, passed in every shard (can come off known_failing in tools/parity_hosts.json "
                    f"once parity-main agrees): {listed(off)}")
              print(f"- known failing, passed where run, not all shards: {listed(partly)}")
              print(f"- did not finish: {listed(unfinished)}")
          elif data == "true" and plan == "success":
              print(f"{len(planned)} harnesses planned. The shards' results could not be downloaded: which passed, "
                    "failed or were retried is unknown here.")
          if left:
              print(f"\nNot run here ({len(left)}), so not passed here:\n")
              for name, why in left.items():
                  print(f"- {shown(name)}: {escaped(why[:300])}")
          print(f"\n{verdict}")
          folder = Path(env["RUNNER_TEMP"]) / "verdict"
          folder.mkdir(exist_ok=True)
          (folder / "verdict.json").write_text(json.dumps(record, indent=1) + "\n", encoding="utf-8")
          print("parity-hosted-verdict " + json.dumps(record), file=sys.stderr, flush=True)
          sys.exit(0 if ok else 1)
          EOF
      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-hosted-verdict
          path: ${{ runner.temp }}/verdict/verdict.json
          if-no-files-found: ignore
          retention-days: 30
