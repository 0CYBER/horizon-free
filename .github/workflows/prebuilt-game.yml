name: prebuilt game
# Manual recovery route under the same release authority as Nightly. Default is a full dry run.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full main SHA (empty means this workflow's exact commit)
        type: string
        default: ''
      dry_run:
        description: Build, smoke, index and sign with a throwaway key; publish nothing
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: prebuilt-game
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit || github.sha }}
          PUBLISH: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
          RELEASES_PAUSED: ${{ vars.RELEASES_PAUSED }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$COMMIT" ]] || exit 1
          if [[ "$PUBLISH" == true ]]; then
            git fetch -q --no-tags origin +refs/heads/main:refs/remotes/origin/main
            python3 tools/prebuilt_game.py authorize "$COMMIT"
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
  build:
    needs: source
    uses: ./.github/workflows/prebuilt-game-build.yml
    with:
      commit: ${{ needs.source.outputs.commit }}
      dry_run: ${{ needs.source.outputs.publish != 'true' }}
  publish:
    needs: [source, build]
    if: needs.build.outputs.needed == 'true'
    permissions:
      contents: write
      actions: read
      issues: read
    uses: ./.github/workflows/sdk-publish.yml
    with:
      commit: ${{ needs.source.outputs.commit }}
      publish: ${{ needs.source.outputs.publish == 'true' }}
    secrets: inherit
  existing:
    needs: [source, build]
    if: needs.build.outputs.needed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate the existing SDK instead of overwriting it
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.source.outputs.commit }}
        run: python3 tools/ci/nightly.py require-sdk "$COMMIT"
