name: prebuilt game
run-name: prebuilt game${{ inputs.off_main && ' (off main)' || '' }}
# Manual recovery route under the same release authority as Nightly. Default is a full dry run.
# The commit gets the Nightly's base rule (nightly.py base, docs/release-flow.md): on main, or, in a dry run with
# off_main only, a commit a dry-run/* branch holds. Nothing on this route saves a cache (tests/test_nightly.py).
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full main SHA (empty means this workflow's exact commit)
        type: string
        default: ''
      dry_run:
        description: Build, smoke, index and sign with a throwaway key; publish nothing
        type: boolean
        default: true
      off_main:
        description: The commit is off main (a dry run only, a commit a dry-run/* branch holds)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: prebuilt-game
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      # The judge first, from this workflow's own commit, and the judged commit beside it: sibling folders, neither
      # inside the other, so nothing the commit tracks (a symlink included) decides where the judge is written.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: tools
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      # The Nightly's base rule (nightly.py base), in the judge's own clone, which holds main and the dry-run/* heads but
      # never the commit fetched by its SHA. -E -s: no Python variables or user site; not -I, which would drop the
      # script's own folder that nightly.py imports from (trusted/tools/ci, as cwd is trusted/).
      - id: rule
        shell: bash
        working-directory: trusted
        env:
          COMMIT: ${{ inputs.commit || github.sha }}
          PUBLISH: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
          OFF_MAIN: ${{ inputs.off_main }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git fetch -q --no-tags origin +refs/heads/main:refs/remotes/origin/main
          DRY_RUN=$([[ "$PUBLISH" == true ]] && echo false || echo true) NIGHTLY_OFF_MAIN="$OFF_MAIN" \
            python3 -E -s tools/ci/nightly.py base "$COMMIT"
      - id: source
        shell: bash
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit || github.sha }}
          PUBLISH: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
          RELEASES_PAUSED: ${{ vars.RELEASES_PAUSED }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$COMMIT" ]] || exit 1
          if [[ "$PUBLISH" == true ]]; then
            git fetch -q --no-tags origin +refs/heads/main:refs/remotes/origin/main
            python3 tools/prebuilt_game.py authorize "$COMMIT"
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
  build:
    needs: source
    uses: ./.github/workflows/prebuilt-game-build.yml
    with:
      commit: ${{ needs.source.outputs.commit }}
      dry_run: ${{ needs.source.outputs.publish != 'true' }}
  publish:
    needs: [source, build]
    if: needs.build.outputs.needed == 'true'
    permissions:
      contents: write
      actions: read
      issues: read
    uses: ./.github/workflows/sdk-publish.yml
    with:
      commit: ${{ needs.source.outputs.commit }}
      publish: ${{ needs.source.outputs.publish == 'true' }}
    # Only the signing keys, and none in a dry run: its index and verify jobs run the built commit's own scripts.
    # (RELEASE_SIGNING_KEY is the `release` environment's, which sdk-publish's sign job reads itself on a real run.)
    secrets:
      RELEASE_SIGNING_KEY: ${{ needs.source.outputs.publish == 'true' && secrets.RELEASE_SIGNING_KEY || '' }}
      RELEASE_SIGNING_KEY_NEXT: ${{ needs.source.outputs.publish == 'true' && secrets.RELEASE_SIGNING_KEY_NEXT || '' }}
  existing:
    needs: [source, build]
    if: needs.build.outputs.needed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate the existing SDK instead of overwriting it
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.source.outputs.commit }}
        run: python3 tools/ci/nightly.py require-sdk "$COMMIT"
