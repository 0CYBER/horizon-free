name: ignored-tests
# The #[ignore]d tests that verify doesn't run (slow, child process, network), on GitHub's runners. GitHub's runners have
# no prepared vanilla data and Horizon never downloads it, so a shard runs only the tests that need none
# (tools/ci/ignored_tests.py --without-data, which prints how many it left out). Run by the daily run (daily.yml) and by
# hand, never on pull requests or main pushes (CI tiers, owner 2026-11-13).
#   gh workflow run ignored-tests.yml --ref <branch>
on:
  workflow_call:
    inputs:
      commit:
        description: The commit to test (the daily run's)
        type: string
        default: ''
  workflow_dispatch:
permissions:
  contents: read
env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  HORIZON_TELEMETRY_URL: "off"
  # sccache cannot cache incremental compiles, so every Rust job builds non-incremental.
  CARGO_INCREMENTAL: 0
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - name: The ignored-tests shard matrix
        id: matrix
        run: python3 tools/ci/ignored_shards.py --matrix --all >> "$GITHUB_OUTPUT"
  # One package per shard (the plan lives in tools/ci/ignored_shards.py). tools/ci/ignored_tests.py fails on a new
  # failure and on a known one that passes, and prints only test names and results.
  ignored-tests-shards:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The daily run's commit; empty (this event's commit) on a dispatch of this workflow.
          ref: ${{ inputs.commit }}
      - name: ALSA and udev headers, and a virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev xvfb
      - name: Install Rust toolchain
        run: bash tools/ci/rustup_install.sh --profile minimal
      - name: Record data-leg start and compiler cache
        run: |
          date -u '+data-leg start utc=%Y-%m-%dT%H:%M:%SZ'
          sccache --show-stats || echo 'data-leg compiler-cache statistics unavailable'
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      - name: Run the ignored tests that need no vanilla data
        env:
          SHARD: ${{ matrix.shard }}
          HORIZON_DATA_LEG_TIMING: '1'
        run: python3 tools/ci/with_xvfb.py python3 tools/ci/ignored_tests.py --without-data --report "$RUNNER_TEMP/daily-report.json" "$SHARD"
      # The leg's verdict for the daily summary: test names, panic locations and policy only (ignored_tests.py --report).
      - name: Upload the leg report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/daily-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Record data-leg end and compiler cache
        if: always()
        run: |
          date -u '+data-leg end utc=%Y-%m-%dT%H:%M:%SZ'
          # Whole-job cgroup high-water: compilation, tests and file cache, not per-test RSS
          # or an isolated test-execution peak. Fixed kernel files only; telemetry is best effort.
          echo 'data-leg memory_scope=whole_job_cgroup_including_compilation_tests_file_cache'
          for metric in memory.peak memory.max memory.swap.peak memory.swap.max; do
            field="${metric//./_}_bytes"
            value=unavailable
            if IFS= read -r sample 2>/dev/null < "/sys/fs/cgroup/$metric"; then
              if [[ "$sample" =~ ^[0-9]+$ || "$sample" == max ]]; then
                value="$sample"
              fi
            fi
            echo "data-leg $field=$value"
          done
          sccache --show-stats || echo 'data-leg compiler-cache statistics unavailable'
