name: promote
# Beta game releases become stable once a day (docs/release-flow.md, "Channels"): at 20:00 UTC (21:00 in Paris in
# winter time, 22:00 in summer) tools/release_channels.py promotes the newest beta that had been out 6 hours by then,
# passed its release smoke test and isn't covered by an issue labelled release-blocker. Launchers on the Nightly
# channel install every beta when it is published; Stable gets the day's promotion. The later runs of the evening are
# retries for a run GitHub starts late or skips: they promote the same beta, so stable still moves once.
# By hand, from GitHub's app too (Actions > promote > Run workflow):
#   gh workflow run promote -f tag=v0.2.3                 # that beta now, without waiting for 20:00
#   gh workflow run promote -f tag=v0.2.3 -f force=true   # even blocked or without its smoke test
#   gh workflow run promote -f dry_run=true               # say what would be promoted
# Holding betas back: label an issue release-blocker. While it is open it holds every beta; closed as completed it
# still holds the betas published before it closed. The issue's text is never read (its author could edit it).
# When the oldest waiting beta is 30 hours old (it missed a promotion it was due for), an issue "Promotion to stable
# has stalled" says so; it closes itself after the next promotion.
on:
  schedule:
    - cron: '7,37 20-21 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: The beta to promote now (empty = the newest beta that is due)
        type: string
        default: ''
      force:
        description: Promote that tag even if a release-blocker covers it or its smoke test didn't run
        type: boolean
        default: false
      dry_run:
        description: Say what would be promoted, change nothing
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: promote
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes of a promoted release cover every pull request since the last stable one.
          fetch-depth: 0
          # gh uses GH_TOKEN below; nothing needs git credentials on disk.
          persist-credentials: false
      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force && 'yes' || '' }}
          DRY_RUN: ${{ (inputs.dry_run || github.ref != 'refs/heads/main') && 'yes' || '' }}
        run: python3 tools/release_channels.py promote ${TAG:+--tag "$TAG"} ${FORCE:+--force} ${DRY_RUN:+--dry-run}
