name: promote
# Beta game releases become stable (docs/release-flow.md, "Channels"): every 30 minutes tools/release_channels.py
# promotes the newest beta that has been out 6 hours, passed its release smoke test and isn't covered by an issue
# labelled release-blocker. By hand, from GitHub's app too (Actions > promote > Run workflow):
#   gh workflow run promote -f tag=v2026.10.19.03               # that beta now, without the wait
#   gh workflow run promote -f tag=v2026.10.19.03 -f force=true  # even blocked or without its smoke test
#   gh workflow run promote -f dry_run=true                      # say what would be promoted
# Holding a beta back: open (or label) an issue release-blocker that names its version; naming none holds them all.
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: The beta to promote now (empty = the newest beta that is due)
        type: string
        default: ''
      force:
        description: Promote that tag even if a release-blocker covers it or its smoke test didn't run
        type: boolean
        default: false
      dry_run:
        description: Say what would be promoted, change nothing
        type: boolean
        default: false
permissions:
  contents: write
  issues: read
concurrency:
  group: promote
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes of a promoted release cover every pull request since the last stable one.
          fetch-depth: 0
      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force && 'yes' || '' }}
          DRY_RUN: ${{ (inputs.dry_run || github.ref != 'refs/heads/main') && 'yes' || '' }}
        run: python3 tools/release_channels.py promote ${TAG:+--tag "$TAG"} ${FORCE:+--force} ${DRY_RUN:+--dry-run}
