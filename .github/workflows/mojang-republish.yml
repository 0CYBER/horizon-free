name: mojang republish
# Hourly: does Mojang's version manifest list a pinned-version JSON that research-lock.json does not know?
# If so, one issue "Mojang republished <version>: <sha8>" with the hashes and a lock snippet
# (tools/ci/mojang_republish.py). Reads only Mojang's public manifest.
#   gh workflow run "mojang republish" -f dry_run=true
on:
  schedule:
    - cron: '23 * * * *'  # hourly: a republished JSON breaks horizon-prepare for every new player until accepted
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print what it would do with issues
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: mojang-republish
  cancel-in-progress: false

jobs:
  check:
    # One of our small runners (label horizon-light, docs/ci-runners.md): main's script, Mojang's public manifest.
    runs-on: ${{ vars.SELF_HOSTED_CI != 'off' && fromJSON('["self-hosted", "linux", "horizon-light"]') || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sparse like the other bots on these runners: their checkout stays in the work folder, and a full
          # checkout after a sparse one keeps only the sparse one's paths (#17524).
          sparse-checkout: |
            tools/ci/mojang_republish.py
            research-lock.json
          sparse-checkout-cone-mode: false
      - name: Check the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/mojang_republish.py ${{ inputs.dry_run && '--dry-run' || '' }}
