name: checks
# verify: every pull request and every push to main, its parts side by side (below). It is the check main
# requires, so it runs in every run of this workflow, even a cancelled one: a skipped job counts as passed, and every
# run must report a real verify (a pull request that changes no Rust skips its Rust parts or finishes them in seconds).
# native-clippy: Windows and macOS lint the server build and OS-specific crates after Linux lint passes; documentation-only
# pull requests skip it. Disposable hosted runners keep forks away from the Mac mini's release and parity data.
# parity: the vanilla harnesses a pull request's changes can affect, on the Mac mini's runner, which holds the
# maintainer's own Minecraft files (Horizon never downloads the game); .github/workflows/parity.yml. Only for a pull
# request that changes a harness, oracle, probe or the runner: the rest are checked on main by parity-main. A fork's pull
# request runs it only when a maintainer adds the run-parity label (.github/workflows/run-parity.yml), so labels
# never start this workflow. See docs/release-flow.md.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  # The merge queue: main plus the queued pull requests ahead, checked as main's pushes are (the whole workspace, the
  # launcher). verify is the check the queue waits for; parity and the pull request's crate selection skip it.
  merge_group:
    types: [checks_requested]
  # A maintainer's try run of any branch here, without a pull request (docs/ci-runners.md#try-runs):
  # `gh workflow run checks --ref <branch>` runs verify's parts on main's disks, which it never saves; the inputs add
  # the jobs below that run by hand only. A fork cannot start it: dispatching takes write access to this repository.
  workflow_dispatch:
    inputs:
      windows:
        description: Also build the game for Windows x64 (a download kept 3 days) and test the launcher there
        type: boolean
        default: false
      arm64:
        description: Also run the Windows ARM64 game and launcher job (about 90 minutes)
        type: boolean
        default: false
      jfr:
        description: Also run the JFR analysis on the Linux game runner
        type: boolean
        default: false
permissions:
  contents: read
  # The push run asks whether the merge queue's run of the same commit passed (the `queued` steps).
  actions: read
concurrency:
  # A new push to a pull request replaces its running checks. On main, the running check finishes and only the
  # newest push waits behind it: GitHub cancels a waiting run when a newer one joins the group. A burst of merges
  # queued ~100 main runs on 2026-11-09; the release follows the newest finished main run (docs/release-flow.md).
  group: checks-${{ github.event.pull_request.number || (github.event_name == 'push' && 'main') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  HORIZON_TELEMETRY_URL: "off"
  # Whether a job saves its build folder's sticky disk (see verify below). Only main's pushes and the merge queue do;
  # every pull request, a fork's too, and every hand-started run (any branch's) starts from what they built and its
  # changes are discarded, so nothing a branch builds reaches main's disk. Forks once had a disk of their own, but
  # pull_request jobs never save one (Blacksmith refuses), so it stayed empty and every fork's pull request built the
  # workspace from scratch: 7-10 min per Rust part on 2026-11-17, against ~2 min for a branch of this repository on
  # main's disk.
  SAVE_BUILD_DISK: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group') && 'true' || 'false' }}

jobs:
  # verify runs as one job per part, side by side, so a run takes as long as its slowest part, not the sum. It was two
  # jobs (the three short parts as steps of one) while GitHub's 20 concurrent jobs were what a burst of pull requests
  # waited for; Blacksmith's runners are not in that pool. #18004's runs, both cold: the two jobs took 13.7 and 5.2
  # min, the first with its 32 cores mostly idle (clippy 5.5, the server build's clippy 3.0, the launcher 2.3, the Python
  # tests 1.9, one after another).
  # `verify` itself is the check main requires: it waits for the parts and passes only when each passed or had nothing
  # to do. It runs even in a cancelled run (`always()`), so it fails there instead of being skipped, which GitHub
  # would count as passed. A failed part re-runs alone ("Re-run failed jobs"), not the others.
  # The Linux build parts print a load line (tools/ci/load_probe.sh) for choosing runner sizes.
  #
  # The Linux parts use Blacksmith's runners (blacksmith.sh sponsors our minutes), each on a size that fits it,
  # for every pull request (a fork's once a maintainer approves it), the merge queue and main's pushes. They are
  # GitHub's own image on faster machines, but report themselves as self-hosted, so the steps tell them apart by
  # runner.name. The repository variable SELF_HOSTED_CI=all sends the Linux parts to our checks runners (label
  # horizon-checks), whose build folder persists (CARGO_TARGET_DIR, outside the checkout).
  # On Blacksmith each Linux Rust part keeps its build folder on a sticky disk instead (tools/ci/build_folder.sh), one disk per
  # part: parts that ran side by side on one disk would each replace the other's build. A cold disk builds everything
  # once; after that a pull request rebuilds what it changed.
  # Which parts a change reaches, decided on the smallest runner before the Rust parts start: a part that starts only to
  # find nothing to do still bills a whole minute of its runner (433 of the launcher's 577 jobs on 2026-11-19, #18843).
  # Every Rust part waits for it, so each starts 10-16 s later; the decision itself takes under a second. Only the
  # scripts it runs are checked out: `git grep` of a revision (the mod API's search of file contents) reads the whole
  # tree whatever the sparse checkout leaves out, and fetches the blobs it needs.
  verify-scope:
    name: verify (which parts run)
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.answers.outputs.rust }}
      launcher: ${{ steps.answers.outputs.launcher }}
      mod_api: ${{ steps.answers.outputs.mod_api }}
      windows_wasm_cache: ${{ steps.answers.outputs.windows_wasm_cache }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: tools
          persist-credentials: false
      # The Rust parts' answers: `required` (needs_rust) for the lint, server build and Rust tests parts, `mod_api`
      # for the mod API part and `windows_wasm_cache` for the focused Windows job. Only a pull request asks.
      - name: Does this pull request need Rust checks?
        if: github.event_name == 'pull_request'
        id: rust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Does this change the launcher or a crate it builds?
        if: github.event_name != 'workflow_dispatch'
        id: launcher
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ] ||
            ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with: the launcher is checked"
          else
            python3 tools/ci/rust_changes.py --launcher "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi
      # Each answer exactly `true` or `false`: the parts' `if`s compare without case, the gate with it. No answer (a
      # step that didn't run) means the part runs; anything else fails this job, and so verify.
      - name: Every answer is true or false
        id: answers
        env:
          RUST: ${{ steps.rust.outputs.required }}
          LAUNCHER: ${{ steps.launcher.outputs.required }}
          MOD_API: ${{ steps.rust.outputs.mod_api }}
          WINDOWS_WASM_CACHE: ${{ steps.rust.outputs.windows_wasm_cache }}
        run: |
          for answer in "rust=$RUST" "launcher=$LAUNCHER" "mod_api=$MOD_API" "windows_wasm_cache=$WINDOWS_WASM_CACHE"; do
            name=${answer%%=*} value=${answer#*=}
            case "$value" in
              true | false) ;;
              '') value=true ;;
              *) echo "::error::$name: '$value' is neither true nor false"; exit 1 ;;
            esac
            echo "$name=$value" | tee -a "$GITHUB_OUTPUT"
          done
  verify-tree:
    name: verify (tree and Python tests)
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A push reads every historical table's bytes (`--history`, #17605). Without them in the clone, git fetches
          # each one on its own, which takes over 30 minutes; the full clone reads them in about 7.
          filter: ${{ github.event_name != 'push' && 'blob:none' || '' }}
      # The merge queue merges with merge commits and main moves to the exact commit its merge_group run verified, so
      # that commit's push run would repeat a finished, green verify. Only a green merge_group run of this very commit
      # counts; an admin merge never had one, and an API error counts as not tested, so the push then verifies in full.
      - name: Did the merge queue already verify this commit?
        id: queued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          if n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&status=success&per_page=1" --jq .total_count 2>/dev/null) && [ "${n:-0}" -ge 1 ]; then
            tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: startsWith(runner.name, 'blacksmith-')
        with:
          python-version: '3.12'
      # A pull request or a merge group adds only its own commits to main, so it reads those; a push to main that the
      # merge queue didn't verify reads the whole history reachable from HEAD.
      - name: Keep game artifacts out of Git
        if: steps.queued.outputs.tested != 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          python tools/check_public_tree.py
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; then
            python tools/check_public_tree.py --range "$BASE_SHA..$HEAD_SHA"
          else
            # Our own runners reuse their clone, which keeps its blob filter: fetch the blobs once in one pack.
            if [ "$(git config --get remote.origin.promisor)" = true ]; then
              git fetch --quiet --refetch --no-filter origin "$GITHUB_SHA"
            fi
            python tools/check_public_tree.py --history
          fi
      # Some Python tests compile Rust with a bare `rustc` (GitHub's image has a default toolchain, our runners' own
      # rustup homes may not), and the GPU tests find no adapter, so they return early. Our runners have Mesa's software
      # Vulkan for parity and Blacksmith's image Mesa's llvmpipe, on which the GPU tests fail; a backend Linux lacks keeps
      # the tests from both, so a pull request's verify doesn't depend on which pool took it (#8627).
      - name: Our runners as GitHub's (a default Rust toolchain, no GPU)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          echo "WGPU_BACKEND=dx12" >> "$GITHUB_ENV"
      # On a pull request, the next two checks compare with HEAD^1: the main that GitHub's merge commit puts the pull
      # request on. pull_request.base.sha is main at the pull request's last push and falls behind, so main's own
      # changes since then would count as the pull request's (#13874).
      # docs/layers.md: a crate depends only on its own layer or a lower one; today's exceptions only shrink.
      - name: Crates follow the layers
        if: steps.queued.outputs.tested != 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: python3 tools/check_layers.py ${BASE:+--base "$BASE"}
      # docs/layers.md#built-in-addresses: every built-in outside address in the Horizon layer's home; the rest only shrinks.
      - name: Built-in addresses stay in their home
        if: steps.queued.outputs.tested != 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: python3 tools/check_addresses.py ${BASE:+--base "$BASE"}
      # A nested workspace's Cargo.lock goes stale when a crate it reaches outside its folder changes its dependencies,
      # and only its own build, after the merge, would notice (tools/ci/nested_locks.py). Index only, no compiling; it
      # runs only when a resolution input changed against the event's base: the main GitHub's merge commit sits on
      # (HEAD^1), the merge group's base_sha, or main before the push. No base (a manual run, a new branch): it runs.
      # Only cargo's --locked mismatch fails it; a registry it cannot reach is a warning.
      - name: Nested Cargo.lock files match the crates they reach
        if: steps.queued.outputs.tested != 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.merge_group.base_sha || github.event.before || '' }}
        run: python3 tools/ci/nested_locks.py ${BASE:+--base "$BASE"}
      # One module per process, on every core: in one process the suite took ~2 minutes.
      - name: Test offline research tooling
        if: steps.queued.outputs.tested != 'true'
        run: python tools/ci/unittest_parallel.py
      - name: Load probe
        if: always()
        continue-on-error: true
        run: timeout -k 5 10 tools/ci/load_probe.sh || echo "The load probe did not run"
  # Format and lint are not in the merge queue: every pull request passed them on its own head, and main's push after
  # the merge still runs clippy (a combination that breaks a lint shows there). A commit the queue verified skips the
  # format check but still runs clippy. A pull request that changes no Rust skips it (verify-scope).
  verify-lint:
    name: verify (format and lint)
    needs: verify-scope
    if: github.event_name != 'merge_group' && needs.verify-scope.outputs.rust != 'false'
    # Pass verify-scope's decision through so native-clippy can wait on this job's answer without re-running it.
    outputs:
      rust: ${{ needs.verify-scope.outputs.rust }}
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Did the merge queue already verify this commit?
        id: queued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          if n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&status=success&per_page=1" --jq .total_count 2>/dev/null) && [ "${n:-0}" -ge 1 ]; then
            tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain and the ALSA and udev headers the client links against
        env:
          HOSTED: ${{ startsWith(runner.name, 'blacksmith-') }}
        run: tools/ci/install_rust.sh libasound2-dev libudev-dev
      - name: Mount the build folder
        if: startsWith(runner.name, 'blacksmith-')
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-verify-lint-own
          path: ~/horizon-target
          commit: ${{ env.SAVE_BUILD_DISK }}
      - name: Build in it, rebuilding only what changed
        if: startsWith(runner.name, 'blacksmith-')
        run: tools/ci/build_folder.sh ~/horizon-target
      - name: Check formatting and lint
        env:
          TESTED: ${{ steps.queued.outputs.tested }}
        run: |
          [ "$TESTED" = true ] || cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Load probe
        if: always()
        continue-on-error: true
        run: timeout -k 5 10 tools/ci/load_probe.sh || echo "The load probe did not run"
  # Only after Linux lint passes, so a lint-broken or documentation-only pull request takes no native runner. Main and manual
  # runs have no rust answer from verify-scope and still lint. Native SDKs avoid cross-build setup; no tests or release
  # builds here. verify-lint skips the merge queue, so this dependent job does too; queued pull requests were already linted.
  native-clippy:
    name: native clippy (${{ matrix.os }})
    needs: verify-lint
    if: needs.verify-lint.outputs.rust != 'false'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint the server build and platform-specific crates
        run: >-
          cargo +stable clippy --all-targets --locked --no-default-features
          -p horizon-client -p horizon-threads -p horizon-perf-format
          -p horizon-perf-share -p horizon-server -- -D warnings
  # The server build (released as horizon-engine): the game without sound or controllers. Its libraries and binaries,
  # not the tests and examples verify-lint checks. Every pull request that changes Rust runs it, whatever crate the
  # change is in (tools/ci/rust_changes.py's server_build answer goes unread on purpose): the merge queue doesn't, so a
  # change that breaks only the server build must stop on its own pull request (a crate below the client can break it
  # without touching one).
  # 4 vCPU: its clippy keeps about two cores busy (load 1-3, 8-19% of 16 cores on 39 pull requests, 2026-11-20).
  # No ALSA or udev headers: without `audio` and `controllers` nothing in its build reaches alsa-sys or libudev-sys
  # (cpal and gilrs are optional dependencies behind them), as game-build.yml's server build shows.
  verify-server:
    name: verify (server build lint)
    needs: verify-scope
    if: github.event_name != 'merge_group' && needs.verify-scope.outputs.rust != 'false'
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Install Rust toolchain
        env:
          HOSTED: ${{ startsWith(runner.name, 'blacksmith-') }}
        run: tools/ci/install_rust.sh
      - name: Mount the build folder
        if: startsWith(runner.name, 'blacksmith-')
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-verify-server-own
          path: ~/horizon-target
          commit: ${{ env.SAVE_BUILD_DISK }}
      - name: Build in it, rebuilding only what changed
        if: startsWith(runner.name, 'blacksmith-')
        run: tools/ci/build_folder.sh ~/horizon-target
      - name: Lint the server build
        run: cargo +stable clippy -p horizon-client --lib --bins --locked --no-default-features -- -D warnings
      - name: Load probe
        if: always()
        continue-on-error: true
        run: timeout -k 5 10 tools/ci/load_probe.sh || echo "The load probe did not run"
  # The launcher is its own workspace (launcher/Cargo.toml), so verify's other cargo runs never build it. A pull request
  # that changes it or a crate it builds is checked here, and so are main's pushes when their range changes it: two pull
  # requests can each pass alone and break it together (#2059 and the registry ratings did, 2026-10-26), and the push
  # after their merge shows it. A push's range is the commits it added to main; a range verify-scope cannot read (a push
  # with no earlier commit, or one a force push removed) runs everything. Not in the merge queue, as verify-lint.
  # 8 vCPU: load 2.7-6.7 at its end, 13-21% of 16 cores busy (14 pull requests, 2026-11-20), well inside 32 GB.
  verify-launcher:
    name: verify (launcher)
    needs: verify-scope
    if: github.event_name != 'merge_group' && needs.verify-scope.outputs.launcher != 'false'
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Did the merge queue already verify this commit?
        id: queued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          if n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&status=success&per_page=1" --jq .total_count 2>/dev/null) && [ "${n:-0}" -ge 1 ]; then
            tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - name: Install Rust and the headers GPUI links against
        env:
          HOSTED: ${{ startsWith(runner.name, 'blacksmith-') }}
        run: |
          tools/ci/install_rust.sh libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev \
            libasound2-dev libudev-dev
      - name: Mount the build folder
        if: startsWith(runner.name, 'blacksmith-')
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-verify-launcher-own
          path: ~/horizon-target
          commit: ${{ env.SAVE_BUILD_DISK }}
      - name: Build in it, rebuilding only what changed
        if: startsWith(runner.name, 'blacksmith-')
        run: tools/ci/build_folder.sh ~/horizon-target
      - name: Check the launcher's formatting, lint and tests
        working-directory: launcher
        env:
          TESTED: ${{ steps.queued.outputs.tested }}
        # A commit the queue verified is only built (clippy, test binaries), so the build folder keeps main's build.
        run: |
          [ "$TESTED" = true ] || cargo +stable fmt --check
          cargo +stable clippy --all-targets --locked -- -D warnings
          if [ "$TESTED" = true ]; then
            cargo +stable test --locked --lib --bins --tests --no-run
          else
            cargo +stable test --locked --lib --bins --tests
          fi
      - name: Load probe
        if: always()
        continue-on-error: true
        run: timeout -k 5 10 tools/ci/load_probe.sh || echo "The load probe did not run"
  verify-test:
    name: verify (Rust tests)
    needs: verify-scope
    if: needs.verify-scope.outputs.rust != 'false'
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Did the merge queue already verify this commit?
        id: queued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          if n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&status=success&per_page=1" --jq .total_count 2>/dev/null) && [ "${n:-0}" -ge 1 ]; then
            tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      # Before the next step, so that the toolchain downloads beside apt and the next step finds it installed.
      - name: Install Rust toolchain, the ALSA and udev headers the client links against, and the mold linker
        env:
          HOSTED: ${{ startsWith(runner.name, 'blacksmith-') }}
        run: tools/ci/install_rust.sh libasound2-dev libudev-dev mold
      # As in verify-tree: a default toolchain and no GPU, so a part doesn't depend on which pool took it.
      - name: Our runners as GitHub's (a default Rust toolchain, no GPU)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          echo "WGPU_BACKEND=dx12" >> "$GITHUB_ENV"
      - name: Mount the build folder
        if: startsWith(runner.name, 'blacksmith-')
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-verify-test-own
          path: ~/horizon-target
          commit: ${{ env.SAVE_BUILD_DISK }}
      - name: Build in it, rebuilding only what changed
        if: startsWith(runner.name, 'blacksmith-')
        run: tools/ci/build_folder.sh ~/horizon-target
      # The mold linker, Blacksmith's runners only (installed above): linking the test binaries was a large part of this
      # job. Rust uses its own lld on x86_64 Linux by default; -linker-features=-lld turns that off so mold's
      # -fuse-ld applies. The same on every event, so the build folder's artifacts match between main and pull requests.
      # The variable replaces .cargo/config.toml's rustflags, so it repeats the parallel front end (-Zthreads=8).
      - name: Link with mold
        if: startsWith(runner.name, 'blacksmith-')
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker-features=-lld -C link-arg=-fuse-ld=mold -Zthreads=8" >> "$GITHUB_ENV"
      # Libraries, binaries and integration tests, then doc tests: not the ~275 examples, which verify-lint's clippy
      # type-checks and the parity job builds and runs (they were most of this step's build and link time).
      # cargo test --locked, not nextest: nextest's process per test reloads each binary's shared tables for every test, and on
      # these 4-core runners it was no faster (#4978).
      # Every event tests the whole workspace, pull requests included. A pull request used to test only its crates and
      # their dependents (`-p`, tools/ci/test_scope.py), but Cargo resolves features for the packages selected: `-p
      # horizon-core` builds libc, serde, syn and proc-macro2 with other features than `--workspace`, so a scoped run
      # rebuilt its whole selection from the bottom and never reused main's build in the build folder. With the folder
      # warm, the workspace build costs only what changed; running every test costs ~35 s (#18025's cold run: unit
      # tests 17 s, content-root 4 s, doc tests 13 s).
      - name: Test Rust core and voxel kernel correctness
        env:
          TESTED: ${{ steps.queued.outputs.tested }}
          # main's pushes record per-crate build times (#18047); the later runs rebuild nothing, so only the first has it.
          TIMINGS: ${{ github.ref == 'refs/heads/main' && '--timings' || '' }}
        run: |
          # A commit the queue already tested is only built, with the same arguments, so the build folder keeps main's build.
          if [ "$TESTED" = true ]; then
            cargo +stable test --locked --workspace --lib --bins --tests --no-run $TIMINGS
            exit 0
          fi
          cargo +stable test --locked --workspace --lib --bins --tests --no-run $TIMINGS
          # The build is done and Cargo holds no lock while tests run, so the three test phases share the 16 cores
          # (the build leaves them ~70% idle, and one binary at a time left them idle again: horizon-world's unit
          # tests alone ran 48 s with the other binaries waiting). The unit and integration binaries run 4 at a time
          # (tools/ci/run_test_binaries.py, which lists them with the same arguments, nothing compiles); the content-root
          # tests (#[ignore]d: minutes each on a laptop; they need the prepared vanilla data, so without it they pass at
          # once) and the doc tests run beside them. The target selection stays identical to the build's, to avoid
          # recompiling the workspace with a different dependency graph.
          logs="$RUNNER_TEMP/test-phases"
          mkdir -p "$logs"
          python3 tools/ci/run_test_binaries.py --jobs 4 -- cargo +stable test --locked --workspace --lib --bins --tests \
            > "$logs/unit.log" 2>&1 &
          unit=$!
          cargo +stable test --locked --workspace --lib --bins --tests mod_content::tests:: -- --ignored \
            > "$logs/content-root.log" 2>&1 &
          content=$!
          cargo +stable test --locked --workspace --doc > "$logs/doc.log" 2>&1 &
          doc=$!
          status=0
          for phase in unit:$unit content-root:$content doc:$doc; do
            name=${phase%%:*}
            if wait "${phase#*:}"; then
              echo "::group::$name tests passed"
              cat "$logs/$name.log"
              echo "::endgroup::"
            else
              echo "::error::The $name tests failed"
              cat "$logs/$name.log"
              status=1
            fi
          done
          exit $status
      - name: Upload the cargo build timings
        # Also after a failed test: the build, and so its timings, finished before the tests ran.
        if: "!cancelled() && github.ref == 'refs/heads/main'"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-timings
          path: ${{ env.CARGO_TARGET_DIR || 'target' }}/cargo-timings/cargo-timing-*.html
          if-no-files-found: warn
          retention-days: 30
      - name: Load probe
        if: always()
        continue-on-error: true
        run: timeout -k 5 10 tools/ci/load_probe.sh || echo "The load probe did not run"
  # docs/layers.md#the-mod-api-stays-put: a change to the game or to the generator must leave the generated mod API as
  # it was: the published loops, the game internals a native mod may declare (an internal goes only when
  # tools/mod_api_removed_internals.txt lists it), the hook catalog and the guest's dispatch. A new hook or internal
  # passes (--allow-added). It builds horizon-mod-api-gen's hook_snapshot example
  # for the pull request's tree (the merge commit) and for HEAD^1 (main, as in verify-tree): the generator's few
  # crates and their dependencies, not the game. A pull request runs it when tools/ci/rust_changes.py says its change
  # can reach the mod API (`mod_api`: the game module, the generator's crates, the check, manifests, or a Rust file
  # that mentions `replaceable` before or after; verify-scope asks); the rest never start it.
  # 4 vCPU: the generator and the comparison run on one core (2-10 min of a run), and only the compiles use more (a
  # missing base snapshot's ~55 s, the surface report's horizon-stage and layouts). 8 vCPU ran at ~13%, and the wire
  # loopback, its longest many-core compile, left with the injection points (#19576).
  # It is its own job beside verify-test, with a build folder of its own, so it adds no time to the slowest job (as a
  # step of verify-test it came after the tests and added ~2.5 min to every pull request that touches game/). Like
  # verify-test it runs on every event, because only main's pushes and the merge queue save a build folder's disk:
  # there it only warms the folder (below), and pull requests compare. It needs the history for HEAD^1, so the
  # checkout is whole, as the other parts'.
  verify-mod-api:
    name: verify (mod API)
    needs: verify-scope
    if: needs.verify-scope.outputs.mod_api != 'false'
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          # Nothing later pushes, and the pull request's code runs from here on: it needs no token.
          persist-credentials: false
      # apt beside rustup (tools/ci/install_rust.sh), as verify-test: one after the other they took 10-18 s here.
      - name: Install Rust toolchain, the ALSA and udev headers the client links against, and the mold linker
        env:
          HOSTED: ${{ startsWith(runner.name, 'blacksmith-') }}
        run: tools/ci/install_rust.sh libasound2-dev libudev-dev mold
      - name: Our runners as GitHub's (a default Rust toolchain)
        run: rustup default stable
      # The disk's key and the snapshot folder keep their names from verify-mod-points, so the job keeps its warm
      # build folder and stored snapshots.
      - name: Mount the build folder
        if: startsWith(runner.name, 'blacksmith-')
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-verify-mod-points-own
          path: ~/horizon-target
          commit: ${{ env.SAVE_BUILD_DISK }}
      - name: Build in it, rebuilding only what changed
        if: startsWith(runner.name, 'blacksmith-')
        run: tools/ci/build_folder.sh ~/horizon-target
      # The same mold flags as verify-test's.
      - name: Link with mold
        if: startsWith(runner.name, 'blacksmith-')
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker-features=-lld -C link-arg=-fuse-ld=mold -Zthreads=8" >> "$GITHUB_ENV"
      # On main's pushes and in the merge queue, where the build folder's disk is saved (SAVE_BUILD_DISK), the job only
      # builds what the check builds: the same cargo package, example, profile and features, in this folder, so a pull
      # request's run finds the generator's crates and dependencies built. A pull request does the comparison.
      # On Blacksmith those runs also run the generator and keep this commit's snapshot on the disk
      # (mod-points-snapshots, by commit), and a pull request whose HEAD^1 is stored compares with it instead of
      # building the base: the base side took 135-281 s in every pull request (#18840). Pull requests mount the disk
      # but never save it (Blacksmith refuses), so none can leave a snapshot for another; our checks runners keep what
      # a job leaves in the build folder, so there nothing is stored or read. Likewise the compiled layouts the surface
      # report compares (wire-layouts, by commit), which also leaves the API crates built for a pull request's head.
      - name: Warm the build folder with the generator, and keep this commit's mod API snapshot
        if: github.event_name != 'pull_request'
        env:
          STORE: ${{ env.SAVE_BUILD_DISK == 'true' && startsWith(runner.name, 'blacksmith-') }}
        run: |
          if [ "$STORE" = true ]; then
            python3 tools/check_mod_api_unchanged.py --store-snapshot "$CARGO_TARGET_DIR/mod-points-snapshots"
            # Only main's pushes store compiled layouts, not the merge queue: a baseline is main's own code.
            if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
              python3 tools/ci/surface_report.py --store-layouts "$CARGO_TARGET_DIR/wire-layouts"
            else
              cargo build --locked -p horizon-mod-api --example wire_layouts
            fi
          else
            cargo build --locked -p horizon-mod-api-gen --example hook_snapshot
            cargo build --locked -p horizon-mod-api --example wire_layouts
          fi
      - name: The generated mod API stays as it was
        if: github.event_name == 'pull_request'
        env:
          HOSTED: ${{ startsWith(runner.name, 'blacksmith-') }}
        run: |
          if [ "$HOSTED" = true ]; then
            python3 tools/check_mod_api_unchanged.py --base HEAD^1 --allow-added --snapshots "$CARGO_TARGET_DIR/mod-points-snapshots"
          else
            python3 tools/check_mod_api_unchanged.py --base HEAD^1 --allow-added
          fi
      # The mod API surface of the merge base and of this tree, diffed (tools/ci/surface_report.py). With
      # tools/ci/surface.toml's gate on, a breaking change that no new note in crates/horizon-mod-vocab/changes/ names
      # fails, and so does a change that makes the game refuse wasm mods built before it: a changed wire layout of a
      # type that crosses, or an argument added to a hook (the check above compares the generated text, which
      # shows neither). horizon-stage is built from the package and profile the check built hook_snapshot from. The
      # compiled layouts of HEAD^1 come from the store main's pushes fill, or are built by checking it out here, with its
      # own wire_layouts example, and then this commit again. A base without the example is compared by source alone,
      # with a warning.
      - name: The mod API keeps what mods built before it use
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          EVENT: ${{ github.event_name }}
        run: |
          cargo build --locked --quiet -p horizon-mod-api-gen --bin horizon-stage
          HORIZON_STAGE_TOOL="${CARGO_TARGET_DIR:-$PWD/target}/debug/horizon-stage" \
            WIRE_LAYOUTS_STORE="${CARGO_TARGET_DIR:-$PWD/target}/wire-layouts" python3 tools/ci/surface_report.py
      - name: Load probe
        if: always()
        continue-on-error: true
        run: timeout -k 5 10 tools/ci/load_probe.sh || echo "The load probe did not run"
  # The cache uses Windows file handles and ACLs. Run its native tests on relevant pull requests.
  verify-windows-wasm-cache:
    name: verify (Windows Wasm cache)
    needs: verify-scope
    if: github.event_name == 'pull_request' && needs.verify-scope.outputs.windows_wasm_cache != 'false'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: ${{ steps.rust.outputs.version }}-x86_64-pc-windows-msvc
      - name: Test the Windows Wasm module cache
        run: cargo test --locked --target x86_64-pc-windows-msvc -p horizon-mod-wasm --lib module_cache
  verify:
    needs: [verify-scope, verify-tree, verify-lint, verify-server, verify-launcher, verify-test, verify-mod-api, verify-windows-wasm-cache, native-clippy]
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Every part of verify passed or had nothing to do
        env:
          SCOPE: ${{ needs.verify-scope.result }}
          TREE: ${{ needs.verify-tree.result }}
          LINT: ${{ needs.verify-lint.result }}
          NATIVE: ${{ needs.native-clippy.result }}
          SERVER: ${{ needs.verify-server.result }}
          LAUNCHER: ${{ needs.verify-launcher.result }}
          TEST: ${{ needs.verify-test.result }}
          MODAPI: ${{ needs.verify-mod-api.result }}
          WINDOWS_WASM_CACHE: ${{ needs.verify-windows-wasm-cache.result }}
          EVENT: ${{ github.event_name }}
          RUST_ANSWER: ${{ needs.verify-scope.outputs.rust }}
          LAUNCHER_ANSWER: ${{ needs.verify-scope.outputs.launcher }}
          MODAPI_ANSWER: ${{ needs.verify-scope.outputs.mod_api }}
          WINDOWS_WASM_CACHE_ANSWER: ${{ needs.verify-scope.outputs.windows_wasm_cache }}
        # A skipped part passes only where its own `if` left it out: verify-scope's answer for it exactly `false`
        # (compared with case, as `if` doesn't), or, for the parts the merge queue leaves out (lint, server build,
        # launcher), the merge queue. The Windows cache part is only for pull requests. Anywhere else the part was
        # never decided for (verify-scope failed, or the run was cancelled first), which fails.
        run: |
          echo "which parts run: $SCOPE, tree and Python tests: $TREE, format and lint: $LINT, native clippy: $NATIVE, server build: $SERVER, launcher: $LAUNCHER, Rust tests: $TEST, mod API: $MODAPI, Windows Wasm cache: $WINDOWS_WASM_CACHE"
          [ "$SCOPE" = success ] || exit 1
          [ "$TREE" = success ] || [ "$TREE" = skipped ] || exit 1
          left_out() { [ "$EVENT" = merge_group ] || [ "$1" = false ]; }
          [ "$LINT" = success ] || { [ "$LINT" = skipped ] && left_out "$RUST_ANSWER"; } || exit 1
          [ "$NATIVE" = success ] || { [ "$NATIVE" = skipped ] && left_out "$RUST_ANSWER"; } || exit 1
          [ "$SERVER" = success ] || { [ "$SERVER" = skipped ] && left_out "$RUST_ANSWER"; } || exit 1
          [ "$LAUNCHER" = success ] || { [ "$LAUNCHER" = skipped ] && left_out "$LAUNCHER_ANSWER"; } || exit 1
          [ "$TEST" = success ] || { [ "$TEST" = skipped ] && [ "$RUST_ANSWER" = false ]; } || exit 1
          [ "$MODAPI" = success ] || { [ "$MODAPI" = skipped ] && [ "$MODAPI_ANSWER" = false ]; } || exit 1
          [ "$WINDOWS_WASM_CACHE" = success ] ||
            { [ "$WINDOWS_WASM_CACHE" = skipped ] &&
              { [ "$EVENT" != pull_request ] || [ "$WINDOWS_WASM_CACHE_ANSWER" = false ]; }; } || exit 1
  # Compile and test Windows ARM64 on an actual ARM64 host, and inspect the resulting PE headers. By hand only
  # (`gh workflow run checks --ref <branch> -f arm64=true`): GitHub's runner queue is the bottleneck, and main's runs
  # gate the releases (tools/release_train.py waits for them), so neither pull requests nor main's pushes start this
  # 90-minute job. The Nightly and launcher releases build and check these binaries on every run.
  windows-arm64:
    name: Windows ARM64 game and launcher
    if: github.event_name == 'workflow_dispatch' && inputs.arm64
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Use every runner core for Cargo
        shell: pwsh
        run: |
          $cores = (Get-CimInstance Win32_Processor | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum
          "CARGO_BUILD_JOBS=$cores" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-arm64-game
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: launcher
          shared-key: windows-arm64-launcher
      - name: Check LLVM assembler used by ring
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Get-Command clang -ErrorAction SilentlyContinue) -and (Test-Path (Join-Path $llvmBin 'clang.exe'))) {
            $env:PATH = "$llvmBin;$env:PATH"
            "PATH=$env:PATH" >> $env:GITHUB_ENV
          }
          $clang = Get-Command clang -ErrorAction Stop
          Write-Output "Using $($clang.Source)"
          & $clang.Source --version
      - name: Build the game for native Windows ARM64 (the official game, as game-build.yml ships it)
        run: cargo build --release --locked --target aarch64-pc-windows-msvc -p horizon-official --bin horizon-official -p horizon-client-lib --bin horizon-ctl -p horizon-prepare --bin horizon-prepare -p horizon-server --bin horizon-server
      - name: Check the game's PE machine
        run: python tools/check_pe_arch.py arm64 target/aarch64-pc-windows-msvc/release/horizon-official.exe target/aarch64-pc-windows-msvc/release/horizon-ctl.exe target/aarch64-pc-windows-msvc/release/horizon-prepare.exe target/aarch64-pc-windows-msvc/release/horizon-server.exe
      - name: Check game DLL imports
        run: python tools/check_imports.py target/aarch64-pc-windows-msvc/release/horizon-official.exe target/aarch64-pc-windows-msvc/release/horizon-ctl.exe target/aarch64-pc-windows-msvc/release/horizon-prepare.exe target/aarch64-pc-windows-msvc/release/horizon-server.exe
      - name: Start every game executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $client = 'target/aarch64-pc-windows-msvc/release/horizon-official.exe'
          $output = & $client --help 2>&1
          if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -notmatch '--resources') { throw 'horizon-client --help failed' }
          foreach ($binary in @('horizon-ctl.exe', 'horizon-prepare.exe', 'horizon-server.exe')) {
            $path = "target/aarch64-pc-windows-msvc/release/$binary"
            $output = & $path --help 2>&1
            if ($LASTEXITCODE -ne 0 -or -not $output) { throw "$binary --help failed" }
          }
          foreach ($binary in @('horizon-prepare.exe', 'horizon-server.exe')) {
            $path = "target/aarch64-pc-windows-msvc/release/$binary"
            $output = & $path --version 2>&1
            if ($LASTEXITCODE -ne 0 -or -not $output) { throw "$binary --version failed" }
            Write-Output ($output -join "`n")
          }
      - name: Test and build the native Windows ARM64 launcher
        working-directory: launcher
        run: |
          cargo test --release --locked --target aarch64-pc-windows-msvc --lib
          cargo build --release --locked --target aarch64-pc-windows-msvc
      - name: Check the launcher's PE machine
        working-directory: launcher
        run: python ../tools/check_pe_arch.py arm64 target/aarch64-pc-windows-msvc/release/horizon-launcher.exe
      - name: Check launcher DLL imports and command-line startup
        working-directory: launcher
        # bash, as launcher.yml's check on the same runner: the launcher is a GUI-subsystem program, and a pwsh
        # `$output = & launcher --version` read no output from it (run 42217014588).
        shell: bash
        run: |
          launcher=target/aarch64-pc-windows-msvc/release/horizon-launcher.exe
          python ../tools/check_imports.py "$launcher"
          out=$("$launcher" --version)
          echo "$out"
          [[ "$out" == "horizon-launcher "* ]] || { echo "::error::horizon-launcher --version printed '$out'"; exit 1; }
      - name: Build a native-mod game with the launcher's managed toolchain
        working-directory: launcher
        shell: pwsh
        env:
          HORIZON_LAUNCHER_HOME: ${{ runner.temp }}\horizon-native-arm64-toolchain
          HORIZON_NATIVE_TARGET_DIR: ${{ runner.temp }}\horizon-native-arm64-toolchain\target
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --release --locked --target aarch64-pc-windows-msvc --lib rust_toolchain::tests::managed_arm64_toolchain_builds_the_game -- --ignored --exact --nocapture
          $client = Join-Path $env:HORIZON_NATIVE_TARGET_DIR 'fast/horizon-client.exe'
          python ../tools/check_pe_arch.py arm64 $client
          python ../tools/check_imports.py $client
  # A try run's Windows part (`gh workflow run checks --ref <branch> -f windows=true`): the game for Windows x64 as
  # game-build.yml's release build makes it, for a maintainer to download and run instead of building it on a PC. Not
  # the exporters (compiled from Minecraft's jars on the Mac mini), the Polytone tests, signing or publishing. No Rust
  # cache, read or saved: it builds from scratch (~48 min). Then the Wasm cache tests and the launcher's tests.
  windows-x64:
    name: Windows x64 game and launcher tests
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-latest
    timeout-minutes: 90
    # Reads the checkout only: not the workflow's actions: read, which the push run's `queued` steps need.
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rust-src
          targets: wasm32-unknown-unknown
      - name: Build the official game, horizon-ctl, horizon-prepare and horizon-server
        env:
          # The C runtime linked in, as the release's.
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p horizon-official --bin horizon-official -p horizon-client-lib --bin horizon-ctl -p horizon-prepare --bin horizon-prepare -p horizon-server --bin horizon-server
      - name: The release's program folder, without the exporters
        run: |
          set -euo pipefail
          out=dist/horizon-windows-x64
          mkdir -p "$out"
          cp target/release/horizon-official.exe "$out/horizon-client.exe"
          cp target/release/horizon-ctl.exe target/release/horizon-prepare.exe target/release/horizon-server.exe "$out/"
          cargo run --locked -p cargo-horizon-mod -- wasm-std "$out/horizon-wasm-std.wasm"
          python tools/ci/fetch_dxc.py "$out"
          python tools/check_pe_arch.py x64 "$out"/horizon-{client,ctl,prepare,server}.exe
          for binary in horizon-client horizon-ctl horizon-prepare horizon-server; do
            python tools/check_imports.py "$out/$binary.exe"
          done
          "$out/horizon-client.exe" --help | grep -q -- '--resources'
          "$out/horizon-prepare.exe" --help | grep -q -- '--minecraft-dir'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: horizon-windows-x64
          path: dist/horizon-windows-x64
          if-no-files-found: error
          retention-days: 3
      - name: Test the Windows Wasm module cache
        run: cargo test --locked -p horizon-mod-wasm --lib module_cache
      - name: Test the launcher in a scratch home
        working-directory: launcher
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          HORIZON_LAUNCHER_NO_SELF_UPDATE: '1'
          HORIZON_NO_AUDIO: '1'
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          scratch=$(mktemp -d "${RUNNER_TEMP//\\//}/horizon-launcher-tests-XXXXXX")
          export HORIZON_LAUNCHER_HOME="$scratch/launcher" HORIZON_HOME="$scratch/game"
          export HORIZON_LAUNCHER_LOCATION_FILE="$scratch/location.json"
          export XDG_DATA_HOME="$scratch/data" XDG_CONFIG_HOME="$scratch/config"
          export HORIZON_LAUNCHER_TRASH="$scratch/trash" HORIZON_LAUNCHER_CLIPBOARD="$scratch/clipboard"
          export HORIZON_LAUNCHER_DESKTOP="$scratch/desktop"
          cargo +stable test --release --locked
  # Most pull requests leave the harnesses to parity-main, which runs them on main a batch of merges at a time
  # (.github/workflows/parity-main.yml; releases wait for it). A pull request still runs them itself when it changes
  # a harness, an oracle, a probe or the runner, or carries the run-parity label (run-parity.yml, when it is added).
  parity-scope:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # A git diff of this repository's own branch: one of our small runners (horizon-light, docs/ci-runners.md).
    runs-on: ${{ vars.SELF_HOSTED_CI != 'off' && fromJSON('["self-hosted", "linux", "horizon-light"]') || 'blacksmith-2vcpu-ubuntu-2404' }}
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          changed=$(git diff --name-only "$(git merge-base "$BASE_SHA" HEAD)" HEAD)
          harness=$(grep -E '^(tools/test_[a-z0-9_]+_parity\.py|tools/(parity[a-z_]*|lab)\.py|tools/parity_hosts\.json|mods/horizon/src/test/|crates/[^/]+/examples/|crates/horizon-client/src/game/[a-z_]*(fixture|harness)\.rs|\.github/workflows/parity[a-z-]*\.yml)' <<< "$changed" || true)
          if [ -n "$harness" ] || [[ " $LABELS " == *" run-parity "* ]] || [[ " $LABELS " == *" frame-identity "* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "The pull request runs its harnesses: ${harness:-label run-parity}"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No harness, oracle, probe or runner change: parity-main checks this on main"
          fi
  parity:
    needs: parity-scope
    if: needs.parity-scope.outputs.run == 'true'
    uses: ./.github/workflows/parity.yml
    with:
      base: ${{ github.event.pull_request.base.sha }}
      head: ${{ github.event.pull_request.head.sha }}
      full: ${{ contains(github.event.pull_request.labels.*.name, 'full-parity') }}
      frame_identity: ${{ contains(github.event.pull_request.labels.*.name, 'frame-identity') }}
  # JFR analysis uses JDK-generated fixture recordings on the self-hosted Linux runner.
  # Start a manual checks dispatch with: gh workflow run checks --ref <branch> -f jfr=true.
  jfr-analysis:
    if: github.event_name == 'workflow_dispatch' && inputs.jfr
    runs-on: [self-hosted, linux, horizon-game]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify streaming JFR analysis against the JDK exporter
        run: python tools/test_jfr.py
      - name: Verify ZGC pause and allocation event interpretation
        run: python tools/test_jfr.py --gc zgc
