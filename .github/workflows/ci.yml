name: checks
# verify: every pull request and every push to main, its parts side by side (below). It is the check main
# requires, so it runs in every run of this workflow, even a cancelled one: a skipped job counts as passed, and every
# run must report a real verify (a pull request that changes no Rust finishes its Rust parts in seconds instead).
# parity: the vanilla harnesses a pull request's changes can affect, on the Mac mini's runner, which holds the
# maintainer's own Minecraft files (Horizon never downloads the game); .github/workflows/parity.yml. Only for a pull
# request that changes a harness, oracle, probe or the runner: the rest are checked on main by parity-main. A fork's pull
# request runs it only when a maintainer adds the run-parity label (.github/workflows/run-parity.yml), so labels
# never start this workflow. See docs/release-flow.md.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  # The merge queue: main plus the queued pull requests ahead, checked as main's pushes are (the whole workspace, the
  # launcher). verify is the check the queue waits for; parity and the pull request's crate selection skip it.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
  # The push run asks whether the merge queue's run of the same commit passed (the `queued` steps).
  actions: read
concurrency:
  # A new push to a pull request replaces its running checks. On main, the running check finishes and only the
  # newest push waits behind it: GitHub cancels a waiting run when a newer one joins the group. A burst of merges
  # queued ~100 main runs on 2026-11-09; the release follows the newest finished main run (docs/release-flow.md).
  group: checks-${{ github.event.pull_request.number || (github.event_name == 'push' && 'main') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  HORIZON_TELEMETRY_URL: "off"
  # Whether a job saves its build folder's sticky disk (see verify below). Only main's pushes and the merge queue do;
  # every pull request, a fork's too, starts from what they built and its changes are discarded, so nothing a pull
  # request builds reaches main's disk. Forks once had a disk of their own, but pull_request jobs never save one
  # (Blacksmith refuses), so it stayed empty and every fork's pull request built the workspace from scratch: 7-10 min
  # per Rust part on 2026-11-17, against ~2 min for a branch of this repository on main's disk.
  SAVE_BUILD_DISK: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}

jobs:
  # verify runs as one job per part, side by side, so a run takes as long as its slowest part, not the sum. It was two
  # jobs (the three short parts as steps of one) while GitHub's 20 concurrent jobs were what a burst of pull requests
  # waited for; Blacksmith's runners are not in that pool. #18004's runs, both cold: the two jobs took 13.7 and 5.2
  # min, the first with its 32 cores mostly idle (clippy 5.5, the server build's clippy 3.0, the launcher 2.3, the Python
  # tests 1.9, one after another).
  # `verify` itself is the check main requires: it waits for the parts and passes only when each passed or had nothing
  # to do. It runs even in a cancelled run (`always()`), so it fails there instead of being skipped, which GitHub
  # would count as passed. A failed part re-runs alone ("Re-run failed jobs"), not the others.
  #
  # Where (docs/ci-runners.md): Blacksmith's runners (blacksmith.sh sponsors our minutes), each part on a size that
  # fits it, for every pull request (a fork's once a maintainer approves it), the merge queue and main's pushes. They are
  # GitHub's own image on faster machines, but report themselves as self-hosted, so the steps tell them apart by
  # runner.name. The repository variable SELF_HOSTED_CI=all sends every part to our checks runners (label
  # horizon-checks), whose build folder persists (CARGO_TARGET_DIR, outside the checkout).
  # On Blacksmith each Rust part keeps its build folder on a sticky disk instead (tools/ci/build_folder.sh), one disk per
  # part: parts that ran side by side on one disk would each replace the other's build. A cold disk builds everything
  # once; after that a pull request rebuilds what it changed.
  verify-tree:
    name: verify (tree and Python tests)
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      # The merge queue merges with merge commits and main moves to the exact commit its merge_group run verified, so
      # that commit's push run would repeat a finished, green verify. Only a green merge_group run of this very commit
      # counts; an admin merge never had one, and an API error counts as not tested, so the push then verifies in full.
      - name: Did the merge queue already verify this commit?
        id: queued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          if n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&status=success&per_page=1" --jq .total_count 2>/dev/null) && [ "${n:-0}" -ge 1 ]; then
            tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: startsWith(runner.name, 'blacksmith-')
        with:
          python-version: '3.12'
      # A pull request or a merge group adds only its own commits to main, so it reads those; main's pushes read every
      # ref's history.
      - name: Keep game artifacts out of Git
        if: steps.queued.outputs.tested != 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          python tools/check_public_tree.py
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; then
            python tools/check_public_tree.py --range "$BASE_SHA..$HEAD_SHA"
          else
            python tools/check_public_tree.py --history
          fi
      # Some Python tests compile Rust with a bare `rustc` (GitHub's image has a default toolchain, our runners' own
      # rustup homes may not), and the GPU tests find no adapter, so they return early. Our runners have Mesa's software
      # Vulkan for parity and Blacksmith's image Mesa's llvmpipe, on which the GPU tests fail; a backend Linux lacks keeps
      # the tests from both, so a pull request's verify doesn't depend on which pool took it (#8627).
      - name: Our runners as GitHub's (a default Rust toolchain, no GPU)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          echo "WGPU_BACKEND=dx12" >> "$GITHUB_ENV"
      # On a pull request, the next two checks compare with HEAD^1: the main that GitHub's merge commit puts the pull
      # request on. pull_request.base.sha is main at the pull request's last push and falls behind, so main's own
      # changes since then would count as the pull request's (#13874).
      # docs/layers.md: a crate depends only on its own layer or a lower one; today's exceptions only shrink.
      - name: Crates follow the layers
        if: steps.queued.outputs.tested != 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: python3 tools/check_layers.py ${BASE:+--base "$BASE"}
      # docs/layers.md#built-in-addresses: every built-in outside address in the Horizon layer's home; the rest only shrinks.
      - name: Built-in addresses stay in their home
        if: steps.queued.outputs.tested != 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: python3 tools/check_addresses.py ${BASE:+--base "$BASE"}
      # One module per process, on every core: in one process the suite took ~2 minutes.
      - name: Test offline research tooling
        if: steps.queued.outputs.tested != 'true'
        run: python tools/ci/unittest_parallel.py
  # Format and lint are not in the merge queue: every pull request passed them on its own head, and main's push after
  # the merge still runs clippy (a combination that breaks a lint shows there). A commit the queue verified skips the
  # format check but still runs clippy.
  verify-lint:
    name: verify (format and lint)
    if: github.event_name != 'merge_group'
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Did the merge queue already verify this commit?
        id: queued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          if n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&status=success&per_page=1" --jq .total_count 2>/dev/null) && [ "${n:-0}" -ge 1 ]; then
            tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - name: Does this pull request need Rust checks?
        if: github.event_name == 'pull_request'
        id: rust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain and the ALSA and udev headers the client links against
        if: steps.rust.outputs.required != 'false'
        env:
          HOSTED: ${{ startsWith(runner.name, 'blacksmith-') }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          fi
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Mount the build folder
        if: steps.rust.outputs.required != 'false' && startsWith(runner.name, 'blacksmith-')
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-verify-lint-own
          path: ~/horizon-target
          commit: ${{ env.SAVE_BUILD_DISK }}
      - name: Build in it, rebuilding only what changed
        if: steps.rust.outputs.required != 'false' && startsWith(runner.name, 'blacksmith-')
        run: tools/ci/build_folder.sh ~/horizon-target
      - name: Check formatting and lint
        if: steps.rust.outputs.required != 'false'
        env:
          TESTED: ${{ steps.queued.outputs.tested }}
        run: |
          [ "$TESTED" = true ] || cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets --locked -- -D warnings
  # The server build (released as horizon-engine): the game without sound or controllers. Its libraries and binaries,
  # not the tests and examples verify-lint checks. Every pull request runs it: the merge queue doesn't, so a change that
  # breaks only the server build must stop on its own pull request (a crate below the client can break it without
  # touching one).
  verify-server:
    name: verify (server build lint)
    if: github.event_name != 'merge_group'
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Does this pull request need Rust checks?
        if: github.event_name == 'pull_request'
        id: rust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain and the ALSA and udev headers the client links against
        if: steps.rust.outputs.required != 'false'
        env:
          HOSTED: ${{ startsWith(runner.name, 'blacksmith-') }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          fi
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Mount the build folder
        if: steps.rust.outputs.required != 'false' && startsWith(runner.name, 'blacksmith-')
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-verify-server-own
          path: ~/horizon-target
          commit: ${{ env.SAVE_BUILD_DISK }}
      - name: Build in it, rebuilding only what changed
        if: steps.rust.outputs.required != 'false' && startsWith(runner.name, 'blacksmith-')
        run: tools/ci/build_folder.sh ~/horizon-target
      - name: Lint the server build
        if: steps.rust.outputs.required != 'false'
        run: cargo +stable clippy -p horizon-client --lib --bins --locked --no-default-features -- -D warnings
  # The launcher is its own workspace (launcher/Cargo.toml), so verify's other cargo runs never build it. A pull request
  # that changes it or a crate it builds is checked here, and so are main's pushes when their range changes it: two pull
  # requests can each pass alone and break it together (#2059 and the registry ratings did, 2026-10-26), and the push
  # after their merge shows it. A push's range is the commits it added to main; a range the job cannot read (a push with
  # no earlier commit, or one a force push removed) runs everything. Not in the merge queue, as verify-lint.
  verify-launcher:
    name: verify (launcher)
    if: github.event_name != 'merge_group'
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Did the merge queue already verify this commit?
        id: queued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          if n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&status=success&per_page=1" --jq .total_count 2>/dev/null) && [ "${n:-0}" -ge 1 ]; then
            tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - name: Does this change the launcher or a crate it builds?
        if: github.event_name != 'workflow_dispatch'
        id: launcher
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ] ||
            ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with: the launcher is checked"
          else
            python3 tools/ci/rust_changes.py --launcher "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust and the headers GPUI links against
        if: steps.launcher.outputs.required != 'false'
        env:
          HOSTED: ${{ startsWith(runner.name, 'blacksmith-') }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-x11-dev libwayland-dev \
              libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
          fi
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Mount the build folder
        if: steps.launcher.outputs.required != 'false' && startsWith(runner.name, 'blacksmith-')
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-verify-launcher-own
          path: ~/horizon-target
          commit: ${{ env.SAVE_BUILD_DISK }}
      - name: Build in it, rebuilding only what changed
        if: steps.launcher.outputs.required != 'false' && startsWith(runner.name, 'blacksmith-')
        run: tools/ci/build_folder.sh ~/horizon-target
      - name: Check the launcher's formatting, lint and tests
        if: steps.launcher.outputs.required != 'false'
        working-directory: launcher
        env:
          TESTED: ${{ steps.queued.outputs.tested }}
        # A commit the queue verified is only built (clippy, test binaries), so the build folder keeps main's build.
        run: |
          [ "$TESTED" = true ] || cargo +stable fmt --check
          cargo +stable clippy --all-targets --locked -- -D warnings
          if [ "$TESTED" = true ]; then
            cargo +stable test --locked --lib --bins --no-run
          else
            cargo +stable test --locked --lib --bins
          fi
  verify-test:
    name: verify (Rust tests)
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Did the merge queue already verify this commit?
        id: queued
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          if n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&status=success&per_page=1" --jq .total_count 2>/dev/null) && [ "${n:-0}" -ge 1 ]; then
            tested=true
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - name: Does this pull request need Rust checks?
        if: github.event_name == 'pull_request'
        id: rust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      # As in verify-tree: a default toolchain and no GPU, so a part doesn't depend on which pool took it.
      - name: Our runners as GitHub's (a default Rust toolchain, no GPU)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          echo "WGPU_BACKEND=dx12" >> "$GITHUB_ENV"
      - name: Install Rust toolchain, the ALSA and udev headers the client links against, and the mold linker
        if: steps.rust.outputs.required != 'false'
        env:
          HOSTED: ${{ startsWith(runner.name, 'blacksmith-') }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev mold
          fi
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Mount the build folder
        if: steps.rust.outputs.required != 'false' && startsWith(runner.name, 'blacksmith-')
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-verify-test-own
          path: ~/horizon-target
          commit: ${{ env.SAVE_BUILD_DISK }}
      - name: Build in it, rebuilding only what changed
        if: steps.rust.outputs.required != 'false' && startsWith(runner.name, 'blacksmith-')
        run: tools/ci/build_folder.sh ~/horizon-target
      # The mold linker, Blacksmith's runners only (installed above): linking the test binaries was a large part of this
      # job. Rust uses its own lld on x86_64 Linux by default; -linker-features=-lld turns that off so mold's
      # -fuse-ld applies. The same on every event, so the build folder's artifacts match between main and pull requests.
      # The variable replaces .cargo/config.toml's rustflags, so it repeats the parallel front end (-Zthreads=8).
      - name: Link with mold
        if: steps.rust.outputs.required != 'false' && startsWith(runner.name, 'blacksmith-')
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker-features=-lld -C link-arg=-fuse-ld=mold -Zthreads=8" >> "$GITHUB_ENV"
      # Libraries, binaries and integration tests, then doc tests: not the ~275 examples, which verify-lint's clippy
      # type-checks and the parity job builds and runs (they were most of this step's build and link time).
      # cargo test --locked, not nextest: nextest's process per test reloads each binary's shared tables for every test, and on
      # these 4-core runners it was no faster (#4978).
      # Every event tests the whole workspace, pull requests included. A pull request used to test only its crates and
      # their dependents (`-p`, tools/ci/test_scope.py), but Cargo resolves features for the packages selected: `-p
      # horizon-core` builds libc, serde, syn and proc-macro2 with other features than `--workspace`, so a scoped run
      # rebuilt its whole selection from the bottom and never reused main's build in the build folder. With the folder
      # warm, the workspace build costs only what changed; running every test costs ~35 s (#18025's cold run: unit
      # tests 17 s, content-root 4 s, doc tests 13 s).
      - name: Test Rust core and voxel kernel correctness
        if: steps.rust.outputs.required != 'false'
        env:
          TESTED: ${{ steps.queued.outputs.tested }}
          # main's pushes record per-crate build times (#18047); the later runs rebuild nothing, so only the first has it.
          TIMINGS: ${{ github.ref == 'refs/heads/main' && '--timings' || '' }}
        run: |
          # A commit the queue already tested is only built, with the same arguments, so the build folder keeps main's build.
          if [ "$TESTED" = true ]; then
            cargo +stable test --locked --workspace --lib --bins --tests --no-run $TIMINGS
            exit 0
          fi
          cargo +stable test --locked --workspace --lib --bins --tests $TIMINGS
          # The full content-root tests (#[ignore]d: minutes each on a laptop). The same build as above; they need the
          # prepared vanilla data, so without it they pass at once. Keep the target selection identical to avoid
          # recompiling the workspace with a different dependency graph.
          cargo +stable test --locked --workspace --lib --bins --tests mod_content::tests:: -- --ignored
          cargo +stable test --locked --workspace --doc
      - name: Upload the cargo build timings
        # Also after a failed test: the build, and so its timings, finished before the tests ran.
        if: "!cancelled() && github.ref == 'refs/heads/main' && steps.rust.outputs.required != 'false'"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-timings
          path: ${{ env.CARGO_TARGET_DIR || 'target' }}/cargo-timings/cargo-timing-*.html
          if-no-files-found: warn
          retention-days: 30
  # docs/layers.md#mod-points-stay-put: every eligible `Game` method is a mod injection point, so a change to `Game`'s
  # source or to the generator must leave the point catalog and the generated API as they were. A point's name,
  # target and signature are part of the mod API: a removed or changed point or any other change to the generated API
  # fails, and a new hook adds points and passes (--allow-added). It builds horizon-mod-api-gen's hook_snapshot example
  # for the pull request's tree (the merge commit) and for HEAD^1 (main, as in verify-tree): the generator's few
  # crates and their dependencies, not the game. A pull request runs it when tools/ci/rust_changes.py says its change
  # can reach the points (`mod_points`: the game module, the generator's crates, the check, manifests, or a Rust file
  # that mentions `replaceable` before or after); the rest skip the setup and the check.
  # It is its own job beside verify-test, with a build folder of its own, so it adds no time to the slowest job (as a
  # step of verify-test it came after the tests and added ~2.5 min to every pull request that touches game/). Like
  # verify-test it runs on every event, because only main's pushes and the merge queue save a build folder's disk:
  # there it only warms the folder (below), and pull requests compare. It needs the history for HEAD^1, so the
  # checkout is whole, as the other parts'.
  verify-mod-points:
    name: verify (mod points)
    runs-on: ${{ vars.SELF_HOSTED_CI == 'all' && fromJSON('["self-hosted", "linux", "horizon-checks"]') || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          # Nothing later pushes, and the pull request's code runs from here on: it needs no token.
          persist-credentials: false
      - name: Does this pull request change the mod points?
        if: github.event_name == 'pull_request'
        id: rust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Our runners as GitHub's (a default Rust toolchain)
        if: steps.rust.outputs.mod_points != 'false'
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install Rust toolchain, the ALSA and udev headers the client links against, and the mold linker
        if: steps.rust.outputs.mod_points != 'false'
        env:
          HOSTED: ${{ startsWith(runner.name, 'blacksmith-') }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev mold
          fi
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Mount the build folder
        if: steps.rust.outputs.mod_points != 'false' && startsWith(runner.name, 'blacksmith-')
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-verify-mod-points-own
          path: ~/horizon-target
          commit: ${{ env.SAVE_BUILD_DISK }}
      - name: Build in it, rebuilding only what changed
        if: steps.rust.outputs.mod_points != 'false' && startsWith(runner.name, 'blacksmith-')
        run: tools/ci/build_folder.sh ~/horizon-target
      # The same mold flags as verify-test's.
      - name: Link with mold
        if: steps.rust.outputs.mod_points != 'false' && startsWith(runner.name, 'blacksmith-')
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker-features=-lld -C link-arg=-fuse-ld=mold -Zthreads=8" >> "$GITHUB_ENV"
      # On main's pushes and in the merge queue, where the build folder's disk is saved (SAVE_BUILD_DISK), the job only
      # builds what the check builds: the same cargo package, example, profile and features, in this folder, so a pull
      # request's run finds the generator's crates and dependencies built. A pull request does the comparison.
      - name: Warm the build folder with the generator
        if: github.event_name != 'pull_request'
        run: cargo build --locked -p horizon-mod-api-gen --example hook_snapshot
      - name: Mod points and the generated API stay as they were
        if: github.event_name == 'pull_request' && steps.rust.outputs.mod_points != 'false'
        run: python3 tools/check_mod_points_unchanged.py --base HEAD^1 --allow-added
  verify:
    needs: [verify-tree, verify-lint, verify-server, verify-launcher, verify-test, verify-mod-points]
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Every part of verify passed or had nothing to do
        env:
          TREE: ${{ needs.verify-tree.result }}
          LINT: ${{ needs.verify-lint.result }}
          SERVER: ${{ needs.verify-server.result }}
          LAUNCHER: ${{ needs.verify-launcher.result }}
          TEST: ${{ needs.verify-test.result }}
          MODPOINTS: ${{ needs.verify-mod-points.result }}
        run: |
          echo "tree and Python tests: $TREE, format and lint: $LINT, server build: $SERVER, launcher: $LAUNCHER, Rust tests: $TEST, mod points: $MODPOINTS"
          for result in "$TREE" "$LINT" "$SERVER" "$LAUNCHER" "$TEST" "$MODPOINTS"; do
            [ "$result" = success ] || [ "$result" = skipped ] || exit 1
          done
  # Compile and test Windows ARM64 on an actual ARM64 host, and inspect the resulting PE headers. By hand only
  # (`gh workflow run checks --ref <branch>`): GitHub's runner queue is the bottleneck, and main's runs gate the
  # releases (tools/release_train.py waits for them), so neither pull requests nor main's pushes start this
  # 90-minute job. The Nightly and launcher releases build and check these binaries on every run.
  windows-arm64:
    name: Windows ARM64 game and launcher
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Use every runner core for Cargo
        shell: pwsh
        run: |
          $cores = (Get-CimInstance Win32_Processor | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum
          "CARGO_BUILD_JOBS=$cores" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-arm64-game
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: launcher
          shared-key: windows-arm64-launcher
      - name: Check LLVM assembler used by ring
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Get-Command clang -ErrorAction SilentlyContinue) -and (Test-Path (Join-Path $llvmBin 'clang.exe'))) {
            $env:PATH = "$llvmBin;$env:PATH"
            "PATH=$env:PATH" >> $env:GITHUB_ENV
          }
          $clang = Get-Command clang -ErrorAction Stop
          Write-Output "Using $($clang.Source)"
          & $clang.Source --version
      - name: Build the game for native Windows ARM64 (the official game, as game-build.yml ships it)
        run: cargo build --release --locked --target aarch64-pc-windows-msvc -p horizon-official --bin horizon-official -p horizon-client-lib --bin horizon-ctl -p horizon-prepare --bin horizon-prepare -p horizon-server --bin horizon-server
      - name: Check the game's PE machine
        run: python tools/check_pe_arch.py arm64 target/aarch64-pc-windows-msvc/release/horizon-official.exe target/aarch64-pc-windows-msvc/release/horizon-ctl.exe target/aarch64-pc-windows-msvc/release/horizon-prepare.exe target/aarch64-pc-windows-msvc/release/horizon-server.exe
      - name: Check game DLL imports
        run: python tools/check_imports.py target/aarch64-pc-windows-msvc/release/horizon-official.exe target/aarch64-pc-windows-msvc/release/horizon-ctl.exe target/aarch64-pc-windows-msvc/release/horizon-prepare.exe target/aarch64-pc-windows-msvc/release/horizon-server.exe
      - name: Start every game executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $client = 'target/aarch64-pc-windows-msvc/release/horizon-official.exe'
          $output = & $client --help 2>&1
          if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -notmatch '--resources') { throw 'horizon-client --help failed' }
          foreach ($binary in @('horizon-ctl.exe', 'horizon-prepare.exe', 'horizon-server.exe')) {
            $path = "target/aarch64-pc-windows-msvc/release/$binary"
            $output = & $path --help 2>&1
            if ($LASTEXITCODE -ne 0 -or -not $output) { throw "$binary --help failed" }
          }
          foreach ($binary in @('horizon-prepare.exe', 'horizon-server.exe')) {
            $path = "target/aarch64-pc-windows-msvc/release/$binary"
            $output = & $path --version 2>&1
            if ($LASTEXITCODE -ne 0 -or -not $output) { throw "$binary --version failed" }
            Write-Output ($output -join "`n")
          }
      - name: Test and build the native Windows ARM64 launcher
        working-directory: launcher
        run: |
          cargo test --release --locked --target aarch64-pc-windows-msvc --lib
          cargo build --release --locked --target aarch64-pc-windows-msvc
      - name: Check the launcher's PE machine
        working-directory: launcher
        run: python ../tools/check_pe_arch.py arm64 target/aarch64-pc-windows-msvc/release/horizon-launcher.exe
      - name: Check launcher DLL imports and command-line startup
        working-directory: launcher
        # bash, as launcher.yml's check on the same runner: the launcher is a GUI-subsystem program, and a pwsh
        # `$output = & launcher --version` read no output from it (run 42217014588).
        shell: bash
        run: |
          launcher=target/aarch64-pc-windows-msvc/release/horizon-launcher.exe
          python ../tools/check_imports.py "$launcher"
          out=$("$launcher" --version)
          echo "$out"
          [[ "$out" == "horizon-launcher "* ]] || { echo "::error::horizon-launcher --version printed '$out'"; exit 1; }
      - name: Build a native-mod game with the launcher's managed toolchain
        working-directory: launcher
        shell: pwsh
        env:
          HORIZON_LAUNCHER_HOME: ${{ runner.temp }}\horizon-native-arm64-toolchain
          HORIZON_NATIVE_TARGET_DIR: ${{ runner.temp }}\horizon-native-arm64-toolchain\target
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --release --locked --target aarch64-pc-windows-msvc --lib rust_toolchain::tests::managed_arm64_toolchain_builds_the_game -- --ignored --exact --nocapture
          $client = Join-Path $env:HORIZON_NATIVE_TARGET_DIR 'fast/horizon-client.exe'
          python ../tools/check_pe_arch.py arm64 $client
          python ../tools/check_imports.py $client
  # Most pull requests leave the harnesses to parity-main, which runs them on main a batch of merges at a time
  # (.github/workflows/parity-main.yml; releases wait for it). A pull request still runs them itself when it changes
  # a harness, an oracle, a probe or the runner, or carries the run-parity label (run-parity.yml, when it is added).
  parity-scope:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # A git diff of this repository's own branch: one of our small runners (horizon-light, docs/ci-runners.md).
    runs-on: ${{ vars.SELF_HOSTED_CI != 'off' && fromJSON('["self-hosted", "linux", "horizon-light"]') || 'blacksmith-2vcpu-ubuntu-2404' }}
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          changed=$(git diff --name-only "$(git merge-base "$BASE_SHA" HEAD)" HEAD)
          harness=$(grep -E '^(tools/test_[a-z0-9_]+_parity\.py|tools/(parity[a-z_]*|lab)\.py|tools/parity_hosts\.json|mods/horizon/src/test/|crates/[^/]+/examples/|crates/horizon-client/src/game/[a-z_]*(fixture|harness)\.rs|\.github/workflows/parity[a-z-]*\.yml)' <<< "$changed" || true)
          if [ -n "$harness" ] || [[ " $LABELS " == *" run-parity "* ]] || [[ " $LABELS " == *" frame-identity "* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "The pull request runs its harnesses: ${harness:-label run-parity}"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No harness, oracle, probe or runner change: parity-main checks this on main"
          fi
  parity:
    needs: parity-scope
    if: needs.parity-scope.outputs.run == 'true'
    uses: ./.github/workflows/parity.yml
    with:
      base: ${{ github.event.pull_request.base.sha }}
      head: ${{ github.event.pull_request.head.sha }}
      full: ${{ contains(github.event.pull_request.labels.*.name, 'full-parity') }}
      frame_identity: ${{ contains(github.event.pull_request.labels.*.name, 'frame-identity') }}
  # JFR analysis uses JDK-generated fixture recordings on the self-hosted Linux runner.
  # Start a manual checks dispatch with: gh workflow run checks --ref <branch>.
  jfr-analysis:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, horizon-game]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify streaming JFR analysis against the JDK exporter
        run: python tools/test_jfr.py
      - name: Verify ZGC pause and allocation event interpretation
        run: python tools/test_jfr.py --gc zgc
