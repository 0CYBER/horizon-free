name: stale pull requests
# A pull request that conflicts with main for 4 idle days, or keeps the head a review asked changes of for 7 days,
# gets the `stale` label and one notice; unchanged 3 days later it is closed (tools/ci/stale_prs.py,
# docs/release-flow.md "Stale pull requests"). A run started by hand is a dry run unless its box is unticked.
#
# On Blacksmith's runners: the token writes pull requests and holds no secret (docs/ci-runners.md). It checks out
# main's script only and reads the API; no pull request's code runs.
on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what the sweep would do without labelling, commenting or closing.
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  sweep:
    concurrency:
      group: stale-prs
      cancel-in-progress: false
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    outputs:
      closed: ${{ steps.sweep.outputs.closed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            tools/ci/stale_prs.py
          sparse-checkout-cone-mode: false
      - name: Sweep
        id: sweep
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '--apply' }}
        run: python3 tools/ci/stale_prs.py "$MODE"
  cancel:
    # A pull request closed by this workflow's token starts no workflow, so cancel-on-close.yml never sees it: its
    # queued and running checks are cancelled here, the same way. No checkout and no code of the pull request; the
    # branch names reach the shell as data only. GitHub's runner: `actions: write` can start workflows
    # (docs/ci-runners.md "What stays on GitHub, and why").
    needs: sweep
    if: always() && needs.sweep.outputs.closed != '' && needs.sweep.outputs.closed != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Cancel the closed pull requests' unfinished runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CLOSED: ${{ needs.sweep.outputs.closed }}
        run: |
          # Cancel only runs belonging to each auto-closed PR and created at or before close, so a same-branch PR
          # targeting another base or a replacement PR opened after close is never touched.
          jq -c '.[]' <<<"$CLOSED" | while read -r item; do
            num=$(jq -r .number <<<"$item")
            branch=$(jq -r .branch <<<"$item")
            head_repo=$(jq -r .repo <<<"$item")
            head_sha=$(jq -r .head <<<"$item")
            closed_at=$(jq -r .closed_at <<<"$item")
            for status in queued in_progress waiting pending requested; do
              gh api -X GET "repos/$REPO/actions/runs" -f branch="$branch" -f event=pull_request -f status="$status" \
                -f per_page=100 \
                --jq --arg repo "$head_repo" --arg sha "$head_sha" --arg closed "$closed_at" --argjson num "$num" '
                  .workflow_runs[]
                  | select(.head_repository.full_name == $repo)
                  | select(.created_at <= $closed)
                  | select(
                      if (.pull_requests | length) > 0 then
                        any(.pull_requests[]; .number == $num)
                      else
                        .head_sha == $sha
                      end
                    )
                  | .id
                '
            done
          done | sort -u | while read -r id; do
            gh run cancel -R "$REPO" "$id" || true
          done
