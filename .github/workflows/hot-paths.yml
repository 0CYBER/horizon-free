name: hot-paths
# Performance trends of the game's hot paths (docs/hot-path-trends.md): the server tick over mobs and hoppers,
# command and selector resolution, hook dispatch and attachment access, each on a fixed, seeded workload in the
# release game as shipped (ThinLTO). tools/hot_paths.py counts instructions and allocator calls per operation
# under Callgrind, which do not depend on the runner's speed, and takes wall time beside them. A run
# prints its measurement in the run's summary and uploads it as an artifact.
#
# It measures; it never judges. No threshold fails this workflow, and it never runs on a pull request or on a
# schedule: by dispatch only, on a machine that holds the prepared vanilla data. A dispatch may name a commit to
# measure instead of the branch's head.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: A commit to measure instead of the branch's head (it must hold the benchmark); not recorded
        type: string
        default: ''
permissions:
  contents: read
# One run at a time per event and ref, on one runner; a started run finishes.
concurrency:
  group: hot-paths-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: 0
  HORIZON_TELEMETRY_URL: "off"
jobs:
  measure:
    # The workloads need the prepared vanilla data: a self-hosted Linux runner holding the maintainer's own
    # Minecraft files (label horizon-game, as ci.yml's vanilla-parity).
    runs-on: [self-hosted, linux, horizon-game]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Choose build parallelism
        run: echo "CARGO_BUILD_JOBS=$(python3 tools/ci/cargo_jobs.py --job-mib 4096)" | tee -a "$GITHUB_ENV"
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # Every job that builds in this runner's persistent target keeps its source snapshot true: a
      # build of another tree without it left artifacts that a later job judged fresh (stale generated
      # sources, 2026-11-13). Only byte-identical Git objects regain their previous timestamps.
      - name: Restore unchanged source timestamps
        run: python3 tools/ci/source_mtimes.py "${CARGO_TARGET_DIR:-target}/ci-source-mtimes-v2.json"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      - name: Tools from the runner
        run: bash tools/ci/runner-env.sh
      - name: Prepare checkout-keyed vanilla data
        run: bash tools/ci/vanilla-data.sh
      # The profile players get, on the server build (no audio, no controllers). horizon-hot-paths-game is
      # horizon-game's entry, with one native listener mod it installs only for the hook workload.
      - name: Build the release game
        run: cargo build --release --locked -p horizon-hot-paths-game
      - name: Measure
        run: |
          set -euo pipefail
          target="${CARGO_TARGET_DIR:-$PWD/target}"
          # RUNNER_TEMP may be a small tmpfs on a self-hosted runner: scratch goes on the build volume, removed at the end.
          scratch=$(mktemp -d "$target/hot-paths.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          command -v valgrind > /dev/null || echo "::warning::no valgrind on this runner: instructions and allocations are not measured"
          python3 tools/hot_paths.py measure --game "$target/release/horizon-hot-paths-game" \
            --resources "$PWD/.local/horizon-client/26.3" --work "$scratch" \
            --commit "$(git rev-parse HEAD)" --host "$RUNNER_NAME" --run "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --out "$RUNNER_TEMP/hot-paths.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: hot-paths
          path: ${{ runner.temp }}/hot-paths.json
          if-no-files-found: error
