name: needs info
# Closes an issue 7 days after a reviewer labels it `needs-info` (`/label needs-info`), when no person has answered;
# a person's comment takes the label off instead (tools/ci/needs_info.py, docs/release-flow.md "Trusted reviewers").
# It never labels anything by itself and skips pull requests.
#
# On GitHub's runners: the token writes issues (docs/ci-runners.md "What stays on GitHub, and why"). It checks out
# main's script only and reads the API; nothing from an issue runs.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  close:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            tools/ci/needs_info.py
          sparse-checkout-cone-mode: false
      - name: Close or keep
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 tools/ci/needs_info.py --apply
