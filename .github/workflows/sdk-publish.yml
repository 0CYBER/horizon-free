name: sdk publish
# Only sign sees the protected release key; it hashes bytes and never executes build output.
on:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      publish:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  issues: read
defaults:
  run:
    shell: bash
env:
  TAG: sdk-${{ inputs.commit }}
  COMMIT: ${{ inputs.commit }}
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - name: Authorize this exact main build before publication
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_PAUSED: ${{ vars.RELEASES_PAUSED }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
          git fetch -q --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 tools/prebuilt_game.py authorize "$COMMIT"
      - id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          targets: wasm32-unknown-unknown
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sdk-leg-*
          path: legs
      - name: Gather matching build data and surfaces
        run: python3 tools/prebuilt_game.py gather legs dist
      - name: Package the complete generated API source
        run: |
          python3 tools/sdk_api_source.py build "$RUNNER_TEMP/api-source"
          python3 tools/sdk_api_source.py archive "$RUNNER_TEMP/api-source" dist/api-source.tar.xz
      - name: Compare with the previous authenticated SDK surface
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(python3 tools/ci/nightly.py sdk-previous "$COMMIT" previous-surface.json)
          echo "build=$previous" >> "$GITHUB_OUTPUT"
          if [[ -n "$previous" ]]; then
            mkdir -p base
            if git cat-file -e "$previous:crates/horizon-mod-vocab/changes" 2>/dev/null; then
              git archive "$previous" crates/horizon-mod-vocab/changes | tar -x -C base
            fi
            cargo run --locked --release -q -p horizon-mod-api-gen --bin horizon-stage -- surface-diff \
              previous-surface.json dist/surface.json --notes crates/horizon-mod-vocab/changes \
              --base-notes base/crates/horizon-mod-vocab/changes --json surface-diff.json | tee -a "$GITHUB_STEP_SUMMARY"
            test -s surface-diff.json
          fi
      - name: Index and validate every exact-host asset and patch
        env:
          PREVIOUS: ${{ steps.previous.outputs.build }}
        run: |
          previous=(); [[ -n "$PREVIOUS" ]] && previous=(--previous "$PREVIOUS" surface-diff.json)
          python3 tools/prebuilt_game.py index dist "${previous[@]}"
          python3 tools/prebuilt_game.py validate-release dist "$COMMIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-release
          path: dist
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  sign:
    needs: index
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: ${{ inputs.publish && github.ref == 'refs/heads/main' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci/sign_release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: The real key signs only a full commit of main
        if: inputs.publish
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git fetch -q --no-tags --filter=blob:none origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$COMMIT" refs/remotes/origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-release
          path: dist
      - name: Sign the SDK release domain, never a game tag
        env:
          RELEASE_SIGNING_KEY: ${{ inputs.publish && github.ref == 'refs/heads/main' && secrets.RELEASE_SIGNING_KEY || '' }}
          RELEASE_SIGNING_KEY_NEXT: ${{ inputs.publish && github.ref == 'refs/heads/main' && secrets.RELEASE_SIGNING_KEY_NEXT || '' }}
          EPHEMERAL: ${{ !inputs.publish && 'yes' || '' }}
        run: bash tools/ci/sign_release.sh "$TAG" dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-signature
          path: dist/SHA256SUMS*
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.publish }}
        with:
          name: sdk-ephemeral.pub
          path: dist/ephemeral.pub
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  verify:
    needs: [index, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-signature
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !inputs.publish }}
        with:
          name: sdk-ephemeral.pub
          path: key
      - name: Verify exactly the complete SDK under its own signature domain
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          key=(); [[ "$PUBLISH" != true ]] && key=(--key "$(cat key/ephemeral.pub)")
          cargo run --locked --quiet -p horizon-release-sign -- verify --repository "$GITHUB_REPOSITORY" --tag "$TAG" \
            "${key[@]}" dist
          expected=$(python3 tools/ci/nightly.py sdk-assets | sort)
          actual=$(ls dist | sort)
          [[ "$expected" == "$actual" ]] || { echo '::error::SDK asset set is incomplete or has extra files'; exit 1; }
      - name: Dry run publishes nothing
        if: ${{ !inputs.publish }}
        run: echo "Validated $TAG with a throwaway key; no release or tag was written." >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: verify
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-signature
          path: dist
      - name: Publish an immutable sdk-<exact main SHA>
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASES_PAUSED: ${{ vars.RELEASES_PAUSED }}
        run: |
          git fetch -q --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 tools/prebuilt_game.py authorize "$COMMIT"
          if answer=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --silent 2>&1); then
            # Do not overwrite an exact-build SDK, even on a forced rebuild or concurrent publication.
            python3 tools/ci/nightly.py require-sdk "$COMMIT"
          elif grep -q 'HTTP 404' <<< "$answer"; then
            gh release create "$TAG" dist/* --target "$COMMIT" --prerelease --latest=false \
              --title "Mod SDK ${COMMIT::10}" --notes "Exact-build SDK for $COMMIT; sdk.json inventories every asset and SHA256SUMS is signed for $TAG."
          else
            echo "$answer"; exit 1
          fi
