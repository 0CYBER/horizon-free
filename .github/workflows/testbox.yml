# Maintainer-dispatched Blacksmith Testbox for running fast Rust builds, clippy, and tests
# against local changes before pushing (docs/ci-runners.md#testbox):
#   blacksmith testbox warmup testbox.yml --ref testbox/<name> --idle-timeout 5
# The CLI syncs unpushed local code to the runner and runs it over SSH, so the job runs code nobody reviewed. It
# therefore runs only on testbox/* branches: on main or a tag it could write Actions cache entries release builds
# restore, and on a branch another workflow builds (launcher-*) entries that a build holding a secret restores.
# Its sticky disk is its own and is never saved: a saved one would hand a session's files to the next. No secrets,
# no write permissions.
name: testbox
on:
  workflow_dispatch:
    inputs:
      testbox_id:
        description: Blacksmith Testbox session ID
        required: true
        type: string
      runner:
        description: Blacksmith runner size
        required: false
        default: blacksmith-16vcpu-ubuntu-2404
        type: choice
        options:
          - blacksmith-16vcpu-ubuntu-2404
          - blacksmith-8vcpu-ubuntu-2404
permissions:
  contents: read
jobs:
  testbox:
    name: Blacksmith Testbox
    runs-on: ${{ inputs.runner == 'blacksmith-8vcpu-ubuntu-2404' && 'blacksmith-8vcpu-ubuntu-2404' || 'blacksmith-16vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    steps:
      # A failing step, not a skipped job: the CLI then shows why instead of waiting for a runner.
      - name: Check the branch and the Testbox session ID
        env:
          TESTBOX_ID: ${{ inputs.testbox_id }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/testbox/* ]]; then
            echo "::error::testbox runs only on testbox/* branches (--ref testbox/<name>), not $GITHUB_REF"
            exit 1
          fi
          if ! [[ "$TESTBOX_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::testbox_id must match ^[A-Za-z0-9_-]+\$"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@d5b883fecd6a7581c3f7467543b819abf8b80bbf # v2
        with:
          testbox_id: ${{ inputs.testbox_id }}
      - name: Install Rust toolchain, client/launcher link headers, and mold
        env:
          HOSTED: ${{ startsWith(runner.name, 'blacksmith-') }}
        run: tools/ci/install_rust.sh libasound2-dev libudev-dev libxkbcommon-x11-dev libfontconfig1-dev mold
      # As in ci.yml's verify parts: a default toolchain, so a bare `cargo` over SSH is the stable one.
      - name: Make stable the default toolchain
        run: rustup default stable
      - name: Mount Testbox Cargo build folder
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
        with:
          key: ${{ github.repository }}-testbox-target
          path: ~/horizon-target
          commit: false
      - name: Build in it, rebuilding only what changed
        run: tools/ci/build_folder.sh ~/horizon-target
      # Commands arrive over SSH: they see neither GITHUB_ENV (later steps only) nor ~/.bashrc (interactive shells
      # only), but Cargo reads $CARGO_HOME/config.toml in any shell. The repository's .cargo/config.toml wins for keys
      # both set; it sets neither target-dir nor these [env] keys, and its build.rustflags is replaced (not joined) by
      # target.<triple>.rustflags, so -Zthreads=8 is repeated (ci.yml's mold flags) and its RUSTC_BOOTSTRAP still
      # applies. [env] reaches only processes Cargo starts: a binary run directly gets neither variable.
      - name: Point Cargo at the build folder and mold
        run: |
          for f in "$HOME/.cargo/config.toml" "$HOME/.cargo/config"; do
            if [ -e "$f" ]; then
              echo "::error::$f already exists; the Testbox settings would not be the ones Cargo reads"
              exit 1
            fi
          done
          mkdir -p "$HOME/.cargo"
          cat <<'EOF' > "$HOME/.cargo/config.toml"
          [build]
          target-dir = "/home/runner/horizon-target"

          [target.x86_64-unknown-linux-gnu]
          rustflags = ["-C", "linker-features=-lld", "-C", "link-arg=-fuse-ld=mold", "-Zthreads=8"]

          [env]
          HORIZON_NO_AUDIO = "1"
          HORIZON_TELEMETRY_URL = "off"
          EOF
      - name: Run Testbox
        uses: useblacksmith/run-testbox@9b976c32aa3bcbffb348889673585a5deee1b2f3 # v2
