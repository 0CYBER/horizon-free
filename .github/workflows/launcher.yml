name: launcher
# Horizon-free: builds and releases the launcher for Windows, Linux and macOS on every push to
# main (the fork's upstream sync bumps launcher/Cargo.toml, which is the release version).
#
# This replaces the upstream workflows: the fork keeps its own, so an upstream rebase must delete
# .github/workflows/* and restore this file, together with the launcher patches (fork-sync.md).
#
# The version comes from launcher/Cargo.toml: tag `launcher@X.Y.Z`. A version whose release
# already exists is not built again; bump the version for the next release.
#   gh workflow run launcher                              # dry run: build everything, publish nothing
#   gh workflow run launcher -f dry_run=false             # publish now

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything but publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: false

env:
  HORIZON_TELEMETRY_URL: "off"

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      build: ${{ steps.meta.outputs.build }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -1)
          [[ -n "$version" ]] || { echo "::error::no version in launcher/Cargo.toml"; exit 1; }
          tag="launcher@$version"
          dry=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            dry=true
          fi
          exists=false
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            exists=true
            echo "::notice::$tag is already released: nothing to publish"
          fi
          build=false
          publish=false
          if [[ "$exists" == false || "$dry" == true ]]; then build=true; fi
          if [[ "$exists" == false && "$dry" == false ]]; then publish=true; fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    if: needs.meta.outputs.build == 'true'
    name: build ${{ matrix.name }}
    # The Windows ARM64 runner is new: a failure there never holds the other platforms' release.
    continue-on-error: ${{ matrix.name == 'windows-arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            asset: horizon-launcher-windows-x64.zip
            binary: horizon-launcher.exe
            # The C runtime linked in: without it the launcher asks for VCRUNTIME140.dll.
            rustflags: -C target-feature=+crt-static
          - name: windows-arm64
            os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            asset: horizon-launcher-windows-arm64.zip
            binary: horizon-launcher.exe
            rustflags: -C target-feature=+crt-static
          - name: linux
            os: ubuntu-22.04
            asset: horizon-launcher-linux-x86_64.tar.gz
            binary: horizon-launcher
          - name: macos-arm64
            # arm64 hosted runners: macos-latest is Apple Silicon (macOS 26 now).
            os: macos-latest
            target: aarch64-apple-darwin
            asset: horizon-launcher-macos-arm64.zip
            binary: horizon-launcher
            mac_arch: arm64
          - name: macos-x64
            # The Intel host builds its own arch: no Rosetta 2 to run the packaged app.
            os: macos-26-intel
            target: x86_64-apple-darwin
            asset: horizon-launcher-macos-x64.zip
            binary: horizon-launcher
            mac_arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      BIN: ${{ matrix.target && format('target/{0}/release', matrix.target) || 'target/release' }}
      # The launcher's `--version` and its self-update compare against these.
      HORIZON_LAUNCHER_VERSION: ${{ needs.meta.outputs.version }}
      HORIZON_LAUNCHER_TAG: ${{ needs.meta.outputs.tag }}
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Cross target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: launcher-${{ matrix.name }}
      - name: Linux libraries GPUI links to
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev patchelf
      - name: Metal shaders compiled now, or at run time without the Metal toolchain
        if: runner.os == 'macOS'
        run: |
          if ! xcrun metal --version > /dev/null 2>&1; then
            echo "::notice::No Metal toolchain: GPUI compiles its shaders at run time"
            echo "LAUNCHER_FEATURES=gpui_platform/runtime_shaders" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: cargo build --release --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }} ${LAUNCHER_FEATURES:+--features "$LAUNCHER_FEATURES"}
      - name: The version is the release's
        run: |
          out=$("$BIN/${{ matrix.binary }}" --version)
          echo "$out"
          [[ "$out" == "horizon-launcher $VERSION" ]] || { echo "::error::expected horizon-launcher $VERSION"; exit 1; }
      - name: Package
        env:
          MAC_ARCH: ${{ matrix.mac_arch }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          rm -rf out dist && mkdir -p out dist
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python3 -m venv "$RUNNER_TEMP/dmg"
            "$RUNNER_TEMP/dmg/bin/pip" install --quiet dmgbuild==1.6.5
            DMGBUILD="$RUNNER_TEMP/dmg/bin/dmgbuild" \
              ../packaging/macos/package.sh "$BIN/${{ matrix.binary }}" "$VERSION" out "$MAC_ARCH"
            rm -rf out/Horizon.app
          else
            cp "$BIN/${{ matrix.binary }}" dist/
            if [[ "$ASSET" == *.tar.gz ]]; then
              (cd dist && tar czf "../out/$ASSET" "${{ matrix.binary }}")
            else
              (cd dist && 7z a "../out/$ASSET" "${{ matrix.binary }}" > /dev/null)
            fi
          fi
          if [[ "$RUNNER_OS" == "Windows" && "${{ matrix.name }}" == "windows" ]]; then
            # The bare executable, as earlier releases shipped it (x64 only: both Windows
            # builds produce a file named horizon-launcher.exe).
            cp "$BIN/${{ matrix.binary }}" out/horizon-launcher.exe
          fi
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: launcher/out/*
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [meta, build]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort |
            while read -r f; do sha256sum "$f"; done > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "Horizon Launcher (free) $VERSION, built automatically from main."
            echo
            echo "Changes:"
            echo "- Rebased on the latest upstream."
            echo "- Offline play enabled by default, in the window and the CLI: no Microsoft account that owns the game is required to launch."
            echo "- No Microsoft sign-in plates in the interface."
            echo "- Horizon-Free button in the sidebar, above the Discord button."
            echo "- Launcher self-updates from 0CYBER/horizon-free (tags launcher@X.Y.Z)."
            echo "- Launcher self-update signature check disabled for fork releases."
            echo "- README warning preserved."
            echo
            echo "Downloads still need an account that owns Minecraft: the fork starts the game from your own assets."
            echo
            echo "Assets:"
            for f in horizon-launcher-*.zip horizon-launcher-*.tar.gz horizon-launcher-macos-*.dmg; do
              [[ -f "$f" ]] && echo "- $f"
            done
            echo "- SHA256SUMS.txt"
            echo
            echo "SHA256:"
            sed 's/^/  /' SHA256SUMS.txt
          } > "$RUNNER_TEMP/notes.md"
      - name: Publish ${{ needs.meta.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          # `-R`: this job has no checkout, and `gh` would otherwise look for a repository here.
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Horizon Launcher (free) $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest=false dist/*
