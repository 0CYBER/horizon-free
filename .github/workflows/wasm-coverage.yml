name: wasm-coverage
# The full internals coverage (#1659): every crossable real internal has a compiling host binding and guest
# binding, generated from the real catalog and checked in one universal crate each. It alone takes about an
# hour on a large runner, so it runs on dispatch only, not on every main push (wasm-mods keeps the fast checks).
# A red run is a main break.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: wasm-coverage
  cancel-in-progress: false
env:
  # sccache cannot cache incremental compiles, so every Rust job builds non-incremental.
  CARGO_INCREMENTAL: 0
jobs:
  wasm-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchains and the ALSA and udev headers
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          else
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
            mkdir -p "$CARGO_TARGET_DIR"
            ln -s "$CARGO_TARGET_DIR" target
          fi
          bash tools/ci/rustup_install.sh --profile minimal --component rustfmt
          rustup toolchain install "$(cat tools/ci/rust-version)" --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: wasm-mods
          # Every fixture uses this workspace's target, so its std and shared dependencies
          # are cached once rather than in seven independent target directories.
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Unlike rust-cache, retain the staged workspace artifacts and source mtimes.
      # A self-hosted runner's persistent target already keeps these directories between jobs.
      - uses: actions/cache/restore@v4
        if: runner.environment == 'github-hosted'
        id: coverage-cache
        with:
          path: |
            target/internals-catalog-coverage
            target/internals-catalog-check
          key: internals-coverage-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            internals-coverage-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            internals-coverage-v1-${{ runner.os }}-
      # Every job that builds in this runner's persistent target keeps its source snapshot true: a
      # build of another tree without it left artifacts that a later job judged fresh (stale generated
      # sources, 2026-11-13). Only byte-identical Git objects regain their previous timestamps.
      - name: Restore unchanged source timestamps
        run: python3 tools/ci/source_mtimes.py "${CARGO_TARGET_DIR:-target}/ci-source-mtimes-v2.json"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      - name: Every crossable real internal has compiling host and guest bindings
        run: |
          export HORIZON_COVERAGE_WASM_CARGO="$(rustup which --toolchain "$(cat tools/ci/rust-version)" cargo)"
          export HORIZON_COVERAGE_WASM_RUSTC="$(rustup which --toolchain "$(cat tools/ci/rust-version)" rustc)"
          cargo test -j4 -p horizon-mod-api-gen --lib guest_compiler_ignores_another_toolchains_driver -- --ignored --nocapture
          cargo test -j4 -p horizon-mod-api-gen --lib real_catalog_has_compiling_host_and_guest_bindings -- --ignored --nocapture
      - uses: actions/cache/save@v4
        if: runner.environment == 'github-hosted' && steps.coverage-cache.outputs.cache-hit != 'true'
        with:
          path: |
            target/internals-catalog-coverage
            target/internals-catalog-check
          key: ${{ steps.coverage-cache.outputs.cache-primary-key }}
