title = "Server dialogs and login screens"
status = "now"
area = "servers"
plain = """Servers that show dialogs, such as the register and login screens of AuthMe, will work in Horizon."""
dev = """26.3's dialog packets and model (#1720), the dialog screen with its buttons and actions (#1734), then text \
and boolean inputs (#1735)."""
links = ["#1720", "#1734", "#1735"]

[[item]]
id = "languages"
title = "Play in your language"
status = "now"
area = "gameplay"
plain = """Item names, container titles and server messages follow the language you pick, as in vanilla. Today \
parts of the game stay in English."""
dev = """Translatable components resolved through the selected language for items, containers and server text \
(#1806), on top of the bundled languages the prepared resources carry (#1594). Left: the client's own screens \
(#1672) and the main menu with zh_cn (#1774)."""
links = ["#1806", "#1594", "#1672", "#1774"]

[[item]]
id = "shader-packs"
title = "Shader packs, written again from scratch"
status = "now"
ongoing = true
area = "rendering"
plain = """Shader packs were removed and are being rebuilt from scratch. They come back, off by default, once the \
best-known packs draw properly."""
dev = """A clean-room rewrite in `horizon-shaderpack`, from the packs' public format documentation only: reading \
packs, the preprocessor and `.properties` files are merged (#1584, #1585, #1586); translating programs to WGSL \
through naga, buffers, uniforms and the terrain, entity, sky, weather and hand stages are in review (#1698 to \
#1801)."""
links = ["#1561", "#1584", "#1586", "#1698", "#1771", "#1786", "#1801"]

[[item]]
id = "discord-presence"
title = "Discord Rich Presence"
status = "now"
area = "extras"
announce = true
plain = """Your Discord profile can show that you are playing Horizon, with a switch to turn it off."""
dev = """A Discord IPC client on its own thread (#1787) and the presence with its setting (#1788). Merged: it ships \
with the next release."""
links = ["#1787", "#1788"]

[[item]]
id = "lean-code"
title = "A leaner codebase that builds faster"
status = "now"
ongoing = true
area = "project"
plain = """Cleaning up Horizon's code: removing what nothing uses and making it quicker to build, so fixes and new \
features land faster."""
dev = """A review of the whole tree: dead code and stubs removed (#1432, #1658), one probe binary per crate (#1453, \
#1454), shared harness helpers (#1448), clippy clean on the whole tree (#1707). docs/architecture.md maps each \
feature to its files and harnesses."""
links = ["#1432", "#1658", "#1453", "#1454", "#1448", "#1707", "docs/architecture.md"]

