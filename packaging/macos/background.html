<!doctype html>
<!-- The .dmg window's background (background.png 660x420, background@2x.png 1320x840).
     Render: from the repository's root, node -e with Playwright at deviceScaleFactor 1 and 2 (see README). -->
<meta charset="utf-8"><style>
@font-face{font-family:Geist;src:url(../../crates/horizon-theme/fonts/Geist-Medium.ttf);font-weight:500}
@font-face{font-family:"Geist Mono";src:url(../../crates/horizon-theme/fonts/GeistMono-Regular.ttf)}
html,body{margin:0;width:660px;height:420px;overflow:hidden;background:#fafafc;font-family:Geist;color:#16181f}
.arrow{position:absolute;left:262px;top:199px;width:136px;height:1px;background:#5b3fd6}
.arrow::after{content:"";position:absolute;right:-1px;top:-4px;width:8px;height:8px;border-top:1px solid #5b3fd6;border-right:1px solid #5b3fd6;transform:rotate(45deg)}
.cap{position:absolute;left:0;right:0;top:346px;text-align:center;font:11px "Geist Mono";letter-spacing:.06em;color:#646875}
.word{position:absolute;left:24px;top:22px;display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px}
.word img{width:16px}
</style><body>
<div class="word"><img src="../../docs/media/brand/mark.svg" alt="">Horizon</div>
<div class="arrow"></div>
<div class="cap">DRAG HORIZON TO APPLICATIONS</div>
</body>
