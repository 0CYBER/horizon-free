<!doctype html><meta charset=utf-8><style>
@font-face{font-family:Geist;src:url(../../../../crates/horizon-theme/fonts/Geist-Regular.ttf);font-weight:400}
@font-face{font-family:Geist;src:url(../../../../crates/horizon-theme/fonts/Geist-Medium.ttf);font-weight:500}
@font-face{font-family:"Geist Mono";src:url(../../../../crates/horizon-theme/fonts/GeistMono-Regular.ttf)}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0e13;color:#ecedf3;font-family:Geist}
.wrap{position:relative;height:100%;padding:var(--pad);box-sizing:border-box}
.top{display:flex;align-items:center;gap:12px;font-size:var(--small);font-weight:500}
.top img{width:calc(var(--small)*1.6)}
.top span{margin-left:auto;font:400 calc(var(--small)*.85) "Geist Mono";color:#8b8f9c;letter-spacing:.04em}
h1{margin:var(--gap) 0 0;font-weight:500;font-size:var(--display);line-height:1.05;letter-spacing:-.025em;max-width:16ch}
p{margin:calc(var(--gap)*.45) 0 0;color:#8b8f9c;font-size:var(--body);line-height:1.5;max-width:40ch}
.word{position:absolute;left:calc(var(--pad) - .06em);bottom:-.2em;font-weight:500;font-size:var(--word);letter-spacing:-.04em;line-height:.8;color:#181a22}
.line{position:absolute;left:0;right:0;bottom:var(--line);height:2px;background:#9a86ff}
</style><body style="--pad:64px;--small:20px;--gap:64px;--display:64px;--body:24px;--word:340px;--line:0px"><div class=wrap>
<div class=word>horizon</div>
<div class=top><img src=../icon.svg>Horizon<span>MINECRAFT: JAVA EDITION 26.3 · RUST</span></div>
<h1>The game you know, rebuilt in Rust.</h1>
<p>An unofficial client and game logic, checked against vanilla by differential harnesses.</p>
</div></body>
