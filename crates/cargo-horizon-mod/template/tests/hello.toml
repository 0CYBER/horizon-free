# `cargo horizon-mod test` runs every tests/*.toml against the built mod, with no game:
# steps happen in order, and `expect` checks what the mod showed during the step.
# Every key: docs/mods.md, "Testing a mod".

[[step]]
expect.commands = ["hello"]

[[step]]
command = "hello world"
expect.chat = ["Hello world! (1 so far)"]

[[step]]
command = "hello again"
expect.chat = ["Hello again! (2 so far)"]
