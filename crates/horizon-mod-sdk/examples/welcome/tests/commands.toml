# /online lists the players and their dimension; /mined counts the acting player's blocks.

[[step]]
join = "Alex"
expect.commands = ["online", "mined"]

[[step]]
join = "Steve"
as = "Steve"
player = { dimension = "minecraft:the_nether" }
command = "online"
expect.feedback = "Alex (overworld), Steve (the_nether)"

[[step]]
as = "Alex"
break = { x = 1, y = 63, z = 0, state = "minecraft:stone" }

[[step]]
as = "Alex"
break = { x = 2, y = 63, z = 0, state = "minecraft:dirt" }

# A step's command comes before its break and place.
[[step]]
as = "Alex"
command = "mined"
expect.feedback = "You broke 2 block(s)"

[[step]]
as = "Steve"
command = "mined"
expect.feedback = "You broke 0 block(s)"
