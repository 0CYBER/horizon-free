# /online lists the players and their dimension; /mined [player] counts a player's blocks.

[[step]]
join = "Alex"
expect.commands = ["online", "mined"]

[[step]]
join = "Steve"
as = "Steve"
player = { dimension = "minecraft:the_nether" }
command = "online"
expect.feedback = "Alex (overworld), Steve (the_nether)"

[[step]]
as = "Alex"
break = { x = 1, y = 63, z = 0, state = "minecraft:stone" }

[[step]]
as = "Alex"
break = { x = 2, y = 63, z = 0, state = "minecraft:dirt" }

# A step's command comes before its break and place.
[[step]]
as = "Alex"
command = "mined"
expect.feedback = "You broke 2 block(s)"

[[step]]
as = "Steve"
command = "mined"
expect.feedback = "You broke 0 block(s)"

[[step]]
as = "Steve"
command = "mined alex"
expect.feedback = "Alex broke 2 block(s)"

# The server parses the arguments before the mod: vanilla's errors.
[[step]]
as = "Steve"
command = "mined Herobrine"
expect.error = "No player was found"

[[step]]
command = "online now"
expect.error = "Incorrect argument for command"
