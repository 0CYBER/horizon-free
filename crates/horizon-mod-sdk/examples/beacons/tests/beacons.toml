# /ground [pos] reads the block under the player (or at pos) and the biome; /beacon [height] sets glowstone two to the east.

[[step]]
join = "Alex"
blocks = [{ x = 0, y = 63, z = 0, state = "minecraft:grass_block[snowy=false]" }]
command = "ground"
expect.feedback = "You are standing on minecraft:grass_block[snowy=false] in minecraft:plains"

[[step]]
command = "beacon"
expect.broadcast = ["Alex lit a beacon at 2 64 0"]
expect.blocks = [
    { x = 2, y = 64, z = 0, state = "minecraft:glowstone" },
    { x = 2, y = 67, z = 0, state = "minecraft:glowstone" },
    { x = 2, y = 68, z = 0, state = "minecraft:air" },
]

# Anywhere the script set nothing is air.
[[step]]
player = { x = 10.5, z = 10.5 }
command = "ground"
expect.feedback = "You are standing on minecraft:air in minecraft:plains"

# Typed arguments: a height, a position relative to the player.
[[step]]
player = { x = 5.5, y = 64.0, z = 5.5 }
command = "beacon 2"
expect.blocks = [
    { x = 7, y = 65, z = 5, state = "minecraft:glowstone" },
    { x = 7, y = 66, z = 5, state = "minecraft:air" },
]

[[step]]
command = "beacon 65"
expect.error = "Integer must not be more than 64, found 65"

[[step]]
command = "ground ~2 ~1 ~"
expect.feedback = "7 65 5 is minecraft:glowstone in minecraft:plains"
