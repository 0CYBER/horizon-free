# The panel follows the player and the clock; /coords hides and shows it.

[player]
x = 12.5
z = -3.25
yaw = 180.0

[clock]
day-time = 29999

[[step]]
ticks = 1
expect.panel = ["XYZ 12.5 / 64.0 / -3.2", "Facing North (-Z)", "Day 2, 12:00"]
expect.corner = "top-left"

[[step]]
player = { x = -100.0, yaw = 90.0 }
ticks = 1
expect.panel = ["XYZ -100.0 / 64.0 / -3.2", "Facing West (-X)", "Day 2, 12:00"]

[[step]]
command = "coords"
expect.feedback = "Coordinates panel hidden"

# A step's ticks come before its command: the panel goes at the next tick.
[[step]]
ticks = 1
expect.panel = []

[[step]]
command = "coords"
expect.feedback = "Coordinates panel shown"

[[step]]
ticks = 1
expect.panel = ["XYZ -100.0 / 64.0 / -3.2", "Facing West (-X)", "Day 2, 12:00"]
