# /where puts the position in chat; on the title screen it answers with an error.

[player]
x = 12.5
y = 70.2
z = -3.25
dimension = "minecraft:the_nether"

[[step]]
command = "where"
expect.chat = ["12, 70, -4 in minecraft:the_nether"]

[[step]]
title-screen = true
command = "where"
expect.chat = []
expect.error = "Not in a world"
