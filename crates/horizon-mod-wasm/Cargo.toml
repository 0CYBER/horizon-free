[package]
name = "horizon-mod-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The runtime for wasm mods: groups packages by their dependencies and refuses what cannot load"

[dependencies]
horizon-guest-stack = { path = "../horizon-guest-stack" }
horizon-core = { path = "../horizon-core" }
horizon-java-properties = { path = "../horizon-java-properties" }
horizon-mod-runtime = { path = "../horizon-mod-runtime" }
mod_api = { package = "horizon-mod-api", path = "../horizon-mod-api" }
horizon-mod-package = { path = "../horizon-mod-package", default-features = false }
log = "0.4"
sha2 = "0.10"
serde_json = "1"
wasmparser = "0.261"
wasmtime = { version = "50", default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "parallel-compilation", "pulley", "threads"] }

[build-dependencies]
horizon-mod-api-gen = { path = "../horizon-mod-api-gen" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
horizon-world = { path = "../horizon-world" }
horizon-threads = { path = "../horizon-threads" }
tempfile = "3.27.0"
libc = "0.2"
horizon-mod-api-gen = { path = "../horizon-mod-api-gen" }
horizon-mod-api-macros = { path = "../horizon-mod-api-macros" }
horizon-client-core = { path = "../horizon-client-core" }
mod_api = { package = "horizon-mod-api", path = "../horizon-mod-api", features = ["wasm-guest", "testing"] }
wat = "1.261"

[lints]
workspace = true

[features]
# Test instrumentation only; does not alter Wire layout.
test-copy-probe = []
runtime-fixture = []
# The hand-written guest fixtures' boundary ids, for the game's tests of them.
listener-fixture = []
mixed-output-fixture = ["mod_api/mixed-output-fixture", "horizon-mod-api-gen/mixed-output-fixture"]

[[test]]
name = "listener_outputs"
required-features = ["mixed-output-fixture"]

[[test]]
name = "real_member"
required-features = ["listener-fixture"]

[[test]]
name = "predicted_block_notice"
required-features = ["listener-fixture"]

[[test]]
name = "bench"
required-features = ["listener-fixture"]

[[test]]
name = "main_stack_probe"
harness = false
required-features = ["runtime-fixture"]
