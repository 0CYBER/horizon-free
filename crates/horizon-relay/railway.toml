# Railway service for the Play with friends relay. Set the service's config
# file path to crates/horizon-relay/railway.toml (docs/play-with-friends.md).
[build]
builder = "DOCKERFILE"
dockerfilePath = "crates/horizon-relay/Dockerfile"
watchPatterns = ["crates/horizon-relay/**", "crates/horizon-friends/**", "Cargo.lock"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
