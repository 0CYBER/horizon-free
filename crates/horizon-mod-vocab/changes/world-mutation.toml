ids = ["handle:LevelRef::relight_chunks", "handle:ChunkRef::resend", "handle:PlayerRef::sees", "handle:PlayerRef::ack_block_changes", "handle:PlayerRef::show_block", "handle:PlayerRef::place_block", "type:ChunkRefusal", "type:PlayerWorldRefusal"]
why = "Adds server-level queued whole-column relighting and chunk resend, player visibility reads, block-action acknowledgements, visual block overrides and setter-plus-follow-up placement. Relighting returns newly queued columns, not completed work; placement is not a full player use-on action. Named refusals preserve their payloads across native and wasm."
migrate = "These operations are additive. Match the named refusal when using them. Observe lighting on a later tick; do not assume relight_chunks finishes lighting synchronously. place_block runs the shared setter and placement follow-up, not survival, protection, advancement, sound or item-consumption checks."
