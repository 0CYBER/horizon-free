ids = ["hook:is_primary_item_for", "hook:apply_enchantments", "hook:is_not_replaceable_by_pick_action", "method:ItemPart::is_primary_item_for", "method:ItemPart::apply_enchantments", "method:ItemPart::is_not_replaceable_by_pick_action", "type:IsPrimaryItemForEvent", "type:ApplyEnchantmentsEvent", "type:IsNotReplaceableByPickActionEvent"]
why = "Adds three server-side ItemPart listen methods from arismoko/horizon#3225 (part 1 of 2), each starting from vanilla's answer: is_primary_item_for (IItemExtension.isPrimaryItemFor), asked once per item and enchantment when parts install and read by every enchantment selection (table offers and clues, loot enchant_with_levels, trades, spawn gear); apply_enchantments (IItemExtension.applyEnchantments), the enchanting table's result for the chosen list, refused when invalid or of another count; and is_not_replaceable_by_pick_action (IItemExtension.isNotReplaceableByPickAction), asked in getSuitableHotbarSlot's second pass for each hotbar stack until one answers false. New hooks: no existing hook version changes."
