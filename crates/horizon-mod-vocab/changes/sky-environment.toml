ids = ["hook:sky_environment", "type:SkyEnvironmentEvent"]
why = "Adds a client hook that sets the time of day and the rain and thunder levels the frame draws, so a client mod can show the local player another time or weather. Only the picture follows; the level's clock, weather, gameplay and the server keep theirs."
migrate = "Nothing to change: additive. Without a listener the frame draws the level's time and weather as before."
