ids = ["type:IntGameRuleKey", "type:GameRuleDefault", "type:GameRuleDecl", "type:GameRuleDecl.default", "type:GameRuleError", "type:GameRuleError.InvalidRange", "handle:LevelRef::game_rule_int", "method:GameRulesRegistrar::game_rule_int"]
why = "Mods declare integer game rules with a default, min and max (arismoko/horizon#3316): GameRulesRegistrar::game_rule_int returns an IntGameRuleKey, read with LevelRef::game_rule_int. GameRuleDecl.default is now a GameRuleDefault (Bool or Int with its range), and GameRuleError gains InvalidRange, so both wire layouts change for wasm mods."
migrate = "Nothing to change for a mod that declares rules: game_rule_bool is unchanged. Only the game reads GameRuleDecl (a hidden installation snapshot that mods cannot build); code that read its default as a bool matches GameRuleDefault::Bool(value). A wasm mod rebuilds against this SDK."
