ids = ["method:DrawContext::fill_gradient", "type:GuiDraw", "type:GuiDraw.FillGradient"]
why = "HUD layers and screens can draw a vertical gradient rectangle (GuiGraphics.fillGradient, arismoko/horizon#4525): DrawContext::fill_gradient(rect, top, bottom) and the GuiDraw::FillGradient op for gui_paint, both through the engine's HudBatch::fill_gradient, first colour on its input y edge, in the current pose and clip; zero area and single-axis inversion draw nothing, while both-inverted bounds are sorted with colours flipped. The existing HUD shader discards alpha below 0.004 rather than vanilla's exact zero. GuiDraw gains the FillGradient variant, so its wire layout changes and wasm mods must rebuild."
migrate = "A match on GuiDraw needs an arm for FillGradient (or a wildcard). Rebuild wasm mods against this SDK for the changed GuiDraw wire layout."
