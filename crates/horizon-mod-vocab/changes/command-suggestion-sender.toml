ids = ["method:CommandArgumentType::suggest", "type:CommandSender"]
why = "A suggestion provider now sees who is asking: `CommandArgumentType::suggest` takes `Option<&CommandSender>` (uuid, name, permission level) before the prefix, so a provider can leave out entries the sender may not run. Provider answers remain unfiltered; each provider owns its sender policy."
migrate = "Rebuild against this SDK. Implement the required `suggest(&self, sender: Option<&CommandSender>, prefix: &str) -> Vec<CommandSuggestion>` method and read `sender`; `None` means no sender could be identified (a console or a headless caller). A provider that ignores the sender offers its answers to everyone. There is no default implementation; return an empty list when the argument offers no completions."
