ids = ["type:CommandSuggestion"]
why = "A completion can now replace only the tail of the text it was asked about. CommandSuggestion carries an optional replace_start, a byte offset into the prefix, so a greedy text argument holding several tokens completes the token being typed instead of rewriting the whole tail (the //replace case). None keeps today's behaviour, replacing the whole prefix. The record's wire layout changes, so a wasm mod built for the previous layout is refused when it loads."
migrate = "Rebuild wasm mods. Leave replace_start as None to keep replacing the whole typed text, or set it with CommandSuggestion::replacing_from(offset) to replace from a byte offset inside the prefix; an offset past the prefix or inside a character refuses that suggestion by name instead of panicking."
