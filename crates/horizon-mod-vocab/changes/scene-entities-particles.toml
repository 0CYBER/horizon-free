ids = ["method:DrawContext::draw_scene", "type:Scene", "type:SceneClock", "type:SceneEntity", "type:SceneParticle", "type:SceneError"]
why = "DrawContext::draw_scene now takes one scene description (blocks, and optionally entities, particles and a clock) and returns Result<(), SceneError>: entities as DrawContext::entity describes and draws them, particles from the blocks' own animate ticks (64 picks a tick among the scene's blocks) and the mod's, on a clock the scene owns per calling mod and id, with hard caps (16 entities, 512 live particles, 4 animating scenes a frame) and named refusals. A scene of blocks alone keeps no state."
migrate = "Replace draw_scene(rect, &blocks, view) with draw_scene(rect, &Scene::new(blocks), view) and handle (or ignore) the returned Result; a scene of blocks alone draws as before."
