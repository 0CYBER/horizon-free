ids = [
    "type:PipelineTexture",
    "type:RenderPipeline",
    "handle:RenderPipeline::textured",
]
why = "A mod render pipeline can sample one texture (vanilla's Sampler0): a block or item atlas sprite, or a texture file of the mod's assets, named by RenderPipeline::textured and read in the shader with pipeline_texture(uv). RenderPipeline gains the texture field, so its wire layout changes for wasm mods."
migrate = "Pipelines without a texture are unchanged; RenderPipeline::new leaves texture None. Rebuild wasm mods against this SDK for the changed RenderPipeline wire layout."
