ids = ["handle:MobRef::move_to_path", "handle:GoalContext::move_to_path", "type:MoveToPathError"]
why = "`move_to_path` answered a bare `bool`, which stood for invalid numbers, a stale or unavailable mob and a path with nothing left to follow at once. It answers `Result<(), MoveToPathError>` now, and `MoveToPathError` (a `#[non_exhaustive]` enum) names the cause: `NotFinite`, `Unavailable`, `Empty`. A finite coordinate at the edge of the `i32` range is still never refused: the classification and the follower saturate their block arithmetic instead of overflowing."
migrate = "Match the result instead of the bool: `Ok(())` was `true`, and each `Err` variant tells you which `false` you got. Rebuild against this SDK: the return type changed, so existing `if mob.move_to_path(..)` call sites stop compiling."
