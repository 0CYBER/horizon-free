ids = ["trait:Registrar", "handle:Registrar::register_raw_recipe_serializer"]
why = "A recipe file's `type` now names a registered serializer, which produces a registered recipe type, as in vanilla and NeoForge. An unregistered serializer id refuses the whole recipe load, naming the file and id; a load condition that is false skips the file first. `recipes_of_type` and `datapack_sync`'s `recipe_types` take recipe type ids."
migrate = "A mod whose recipe files use its own `type` registers it in `Hooks::register`: `register_recipe_type(\"my_mod:grinding\")` and `register_raw_recipe_serializer(\"my_mod:grinding_json\", \"my_mod:grinding\")`, then puts the serializer id in each file's `type` and keeps reading `recipes_of_type(\"my_mod:grinding\")`. A crafting-grid kind implements `CraftingRecipeKind` and registers it with `register_crafting_recipe_serializer`; custom decoding of a type the mod reads itself uses `register_read_only_recipe_serializer`."
