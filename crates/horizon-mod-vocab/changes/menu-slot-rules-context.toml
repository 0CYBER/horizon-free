ids = ["hook:menu_slot_rules", "hook:menu_slot_rules.context", "hook:menu_slot_rules.container", "type:MenuSlotRulesEvent.context", "type:MenuSlotRulesEvent.container", "type:MenuSlotContext", "type:MenuContainer", "handle:MenuSlotContext::slot"]
why = "menu_slot_rules now tells the part who and where it is asked about: event.context (a new MenuSlotContext) carries the player whose menu it is, the block entity the menu belongs to and a read-only copy of the menu's own containers' slots (main, a crafting grid and its result), keyed by MenuContainer, the same on the server and on the client's prediction. event.container (a new MenuContainer) names the container event.slot indexes, and context.slot(container, index) reads any of them. The hook moves from version 3 to 4."
migrate = "Read event.context.player, .pos and context.slot(container, index) where a rule depends on them; event.container says which container event.slot is in. Destructure MenuSlotRulesEvent with .. for the added fields. Named injections request hook_version = 4. Rebuild native and wasm mods against this SDK."
