ids = ["method:ClientSession::client_titles", "method:ClientSession::client_boss_bars", "type:ClientTitles", "type:ClientBossBarEntry"]
why = "Adds client reads of the HUD state a window holds: the title, subtitle and action bar on screen now, and the boss bars with their progress — so a mod need not rebuild them from client_packet."
migrate = "Additive. Read them on the client; each is None outside a logged-in client world."
