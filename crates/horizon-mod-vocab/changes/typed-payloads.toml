ids = ["trait:PayloadCodec", "type:PayloadEncodeError", "type:PayloadSendError", "type:PayloadToken", "type:ToServer", "type:ToClient", "method:prelude::PayloadTokensHost::check_payload_token", "fn:payload_schema", "fn:payload_schema_leaf", "fn:payload_schema_mix", "fn:typed_payload_version"]
why = "Typed payloads on the registered raw transport (arismoko/horizon#813 step 4b-1): typed registration on PayloadRegistrar returns ToServer/ToClient tokens that the host checks before each send. PayloadCodec gains a required schema fingerprint (the derive writes it; a hand-written codec names a leaf); PayloadSendError appends StaleToken; PayloadEncodeError appends BudgetExhausted, as the writer now charges the reader's allocation budget; IPayloadContext and the shared Host gain check_payload_token. Affected WebAssembly mods must rebuild for the changed layouts. No hook meaning changes."
