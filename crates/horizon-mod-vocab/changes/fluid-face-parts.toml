ids = ["hook:should_hide_adjacent_fluid_face", "hook:should_display_fluid_overlay"]
why = "Adds two client BlockPart methods (#3191). should_hide_adjacent_fluid_face (IBlockExtension.shouldHideAdjacentFluidFace): a block state hides the face a fluid beside it draws toward it; collect, hidden starts false, and vanilla's same-fluid and occlusion tests apply first. should_display_fluid_overlay (IBlockExtension.shouldDisplayFluidOverlay): whether a fluid's side beside the state uses the overlay sprite; collect, overlay starts with vanilla's HalfTransparentBlock/LeavesBlock test, and level and pos are dropped. Both are resolved per (state, fluid) on the client thread at join and on refresh_render_visibility and read by the fluid mesher from tables, so they never run on the meshing workers."
