ids = ["hook:can_grindstone_repair", "hook:is_combine_repairable", "hook:can_fit_inside_container_items", "method:ItemPart::can_grindstone_repair", "method:ItemPart::is_combine_repairable", "method:ItemPart::can_fit_inside_container_items", "type:CanGrindstoneRepairEvent", "type:IsCombineRepairableEvent", "type:CanFitInsideContainerItemsEvent"]
why = "Adds three ItemPart listen methods from arismoko/horizon#3225 (part 2 of 2), each on both sides with the loop context and no Host, each starting from vanilla's answer: can_grindstone_repair (IItemExtension.canGrindstoneRepair), asked in GrindstoneMenu.mergeItems for the top of two same-item inputs and by the input slots' mayPlace; is_combine_repairable (IItemExtension.isCombineRepairable), asked for both stacks in RepairItemRecipe.canCombine, a true for a stack with no durability refused; and can_fit_inside_container_items (IItemExtension.canFitInsideContainerItems), asked by a shulker box's slots, bundles and a mod's item slots through one entry point. They are the first ItemPart methods with context = \"loop\". New hooks: no existing hook version changes."
