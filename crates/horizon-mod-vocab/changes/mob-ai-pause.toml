ids = ["type:MobAiPauseRefusal", "handle:MobRef::set_ai_paused", "handle:MobRef::ai_paused"]
why = "Adds MobRef::set_ai_paused and MobRef::ai_paused (arismoko/horizon#4478): a mod pauses a mob's AI step (Mob.serverAiStep: its Brain or its goal and target selectors, navigation and controls) while LivingEntity.aiStep runs on as for isImmobile, with no input, so gravity, fluids, pushes and knockback still apply. Path, move target, target, goals and memories are kept, and the navigation timeout does not count the pause. Saved with the entity under horizon:attachments, never as NoAI. Each refusal is named: Stale, Client, HeldOut, NoAiStep, NotAMob."
