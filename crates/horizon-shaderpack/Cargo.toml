[package]
name = "horizon-shaderpack"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Java (OptiFine/Iris) shader packs for Horizon: Iris's preprocessor and the GLSL to WGSL translation"

[dependencies]
glsl-lang = "0.8.1"
naga = { version = "30.0.1", features = ["glsl-in", "wgsl-in", "wgsl-out"] }
# The C preprocessor naga's GLSL front end uses.
pp-rs = "0.2.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
