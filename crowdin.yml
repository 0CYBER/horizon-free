# Horizon's own text, translated and proofread in Crowdin (docs/translations.md). Vanilla's text is
# not here: it comes from the player's own Minecraft install.
#
# No token and no project id: .github/workflows/crowdin.yml passes CROWDIN_PROJECT_ID and
# CROWDIN_PERSONAL_TOKEN from the repository's secrets, and a run by hand exports them the same way.
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: "."
preserve_hierarchy: true
files:
  - # The reference every language is translated against; the game falls back to it for a key a
    # language does not have.
    source: /crates/horizon-client/assets/horizon/lang/en_us.json
    # A staging folder, never committed (`.gitignore`): tools/crowdin_import.py turns it into the
    # lang files and the review record, so a translation lands through a pull request instead of
    # behind the tooling's back.
    translation: /l10n/game/%locale_with_underscore%.json
